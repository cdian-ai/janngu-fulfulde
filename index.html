        <b class="ff">${esc(L.k)}</b>
        <small>${esc(L.l)}</small></button>`}).join("")}</div>
    <div class="lsfoot" data-st="${all?"go":"wait"}">${lsFoot(all)}</div>
   </div>`;
 }
 const i=Math.min(S.lsI||0,LSQ.length-1), q=LSQ[i], L=LITTLE[q[0]], w0=W2[q[1]];
 const got=S.lsPick===L.k;
 sayNow(got?"Yes \u2014 "+L.k+", "+L.l+"."
   :"Which little word goes with this picture?");
 return `<div class="lset">
   <p class="estep">${i+1} of ${LSQ.length}</p>
   <div class="lsstage" style="${mvars(L.k)}">${lsPic(L.k,w0.g,1.15)}
     ${got?`<p class="lsans"><b class="ff">${esc(w0[L.f])}</b>
       <b class="ff mk">${esc(L.k)}</b></p>`:""}</div>
   <div class="lsopts">${LITTLE.map(function(x){
     return `<button class="lsopt${got&&x.k===L.k?" yes":""}${S.lsMiss===x.k?" no":""}"
       style="${mvars(x.k)}" data-lspick="${esc(x.k)}">
       <b class="ff">${esc(x.k)}</b><small>${esc(x.l)}</small></button>`}).join("")}</div>
   ${S.lsMiss?`<p class="ehint"><b class="ff">${esc(S.lsMiss)}</b> is
     ${esc((LITTLE.filter(function(x){return x.k===S.lsMiss})[0]||{}).l||"")} \u2014 look again</p>`:""}
   ${got?`<button class="wallbtn good" data-lsnext>next \u203a</button>`:""}
  </div>`;
}
function wordmac(){ return wmTeach() }
function wordmac2(){ return wmTeach() }
function wordmac3(){
 if(S.wmPhase==="forms") return wmForms();
 if(S.wmPhase==="tdone") return wmTDone();
 return wmTCheck();
}
/* ---- v243: the beat between the asking and the machine ----
   Six questions answered is a thing that happened, and the screen that
   followed it gave no sign of it: the machine simply appeared, mid-word. The
   six little words the child has just placed stand here together — which is
   also the first time they have been seen as a set — and the door on is
   theirs to press. */
function wmTDone(){
 const mks=TQ.map(function(q){ return W2[q.i].m[MIX[q.f]] })
   .filter(function(v,j,a){ return a.indexOf(v)===j });
 return `<div class="chunkdone">
   <div class="big">⭐</div>
   <h2>${TQ.length} · ${TQ.length}</h2>
   <div class="tdmk">${mks.map(function(m){
     return `<span class="chipm ff" style="${mvars(m)}">${esc(m)}</span>`}).join("")}</div>
   <p>the little words you have just put in front</p>
   <button class="ctl" style="width:100%" data-tdone>next ›</button>
  </div>`;
}

/* The four cards above are all one noun, so they teach baafal's four forms and
   quietly imply that is the whole system. It is not: ngel and koy hold for all
   thirty-three, ɗee/ɗii is a two-way choice, but the ONE word changes with the
   noun — eleven different markers across the list, and nduu alone covers four
   words the child meets at the machine. So a fifth card puts a second noun
   beside the first and shows which two move and which two do not. */
/* v208: the three words the switch is demonstrated on, each one twice */
const DEMOW=[FAMSIX[0],FAMSIX[1],FAMSIX[2]];
const DEMON=DEMOW.length*2;
const CMPW=25;                              /* rawaandu — nduu, and it mutates too */
/* the last card of Ditinn: find the little word inside a real sentence */
function wmUse(k,total){
 const i=Math.min(S.gsI||0,USESENT.length-1), Q=USESENT[i],
  words=Q.s.split(" "), got=S.gsGot===i, last=i>=USESENT.length-1;
 ACTS[S.act].say="A whole sentence. Point at the little word \u2014 the one that says ngel.";
 return wrap(`<div class="meet">
   <p class="rhyme">find <b class="ff">ngel</b></p>
   <div class="usent">${words.map(function(w,j){
     const cls=got&&j===Q.i?" hit":(S.gsMiss===j?" miss":"");
     return `<button class="usw${cls}" data-usw="${j}">${esc(w)}</button>`}).join("")}</div>
   ${got?`<p class="usdone">${i+1} of ${USESENT.length}</p>
     <button class="wallbtn good" ${last?"data-tnext":"data-usnext"}>next \u203a</button>`
    :`<p class="usdone">${i+1} of ${USESENT.length}</p>`}
   ${backStrip("teach",k,total)}
  </div>`,k,total,true);
}

function wmCompare(k,total){
 const a=TEACHW, b=W2[CMPW];
 ACTS[S.act].say="Two words. Look at what changes and what does not.";
 /* Eight cells of small print is a thing to read, and the one pattern in it —
    two of the four little words stay the same and two change — was left for a
    six-year-old to spot on their own. It is four taps now: each one plays the
    two words one after the other and stamps the row same or changed, so the
    pattern is the result of something the child did. */
 if(!S.cmpOpen) S.cmpOpen={};
 const rows=LITTLE.map(function(L,i){
  const am=a.m[MIX[L.f]], bm=b.m[MIX[L.f]], same=am===bm, open=!!S.cmpOpen[i];
  return `<button class="cxrow${open?(same?" same":" diff"):""}" data-cmp="${i}">
    <span class="cxl">${esc(L.l)}</span>
    <span class="cxp"><b class="ff">${esc(am)}</b> ${esc(a[L.f])}</span>
    <span class="cxp"><b class="ff">${esc(bm)}</b> ${esc(b[L.f])}</span>
    <span class="cxs">${open?(same?"same":"changed"):"tap"}</span></button>`}).join("");
 const heard=LITTLE.filter(function(_,i){return S.cmpOpen[i]}).length;
 return wrap(`<div class="meet">
   <p class="marksays">${a.g} ${esc(a.en)} \u00b7 ${b.g} ${esc(b.en)}</p>
   <p class="rhyme">tap a row to hear both words</p>
   ${rows}
   ${heard>=LITTLE.length
     ?`<p class="rhyme">the little ones never change \u2014 it is the <b>one</b> word that
       follows the ending: <b>-al</b> takes <b>ngal</b>, <b>-du</b> takes <b>nduu</b></p>
      <button class="wallbtn good" data-tnext>next \u203a</button>`
     :`<p class="cxwait">${LITTLE.length-heard} more to hear</p>`}
   ${backStrip("teach",k,total)}
  </div>`,k,total,true);
}

/* ---- the first card is walked through; the other three are not ----
   The card used to arrive whole: rail, marker, rule, picture, phrase, all at
   once, with no way on except a rail the child had to discover. Two things
   are fixed. Every card now has its own door, and that door only opens once
   the little word has stood in BOTH boxes — so going on is proof of the one
   thing the card teaches, not proof of a tap.
   And the first card is built up a piece at a time, each piece named before
   the next appears: the little word, then the thing, then the two of them
   together in front, then the two of them together behind. That is a worked
   example, and worked examples are for novices — which is why it runs ONCE.
   By the third card a demonstration is something to sit through, and a child
   who is made to sit through it starts tapping to escape it, so cards two,
   three and four arrive whole and simply wait for the move. */
function wmTeach(){
 const set=mIdx(), pair=(S.act==="wordmac2");
 const total=set.length+(pair?2:0), kk=Math.min(S.wmM||0,total-1);
 if(pair&&kk>set.length) return wmUse(kk,total);
 if(pair&&kk===set.length) return wmCompare(kk,total);
 const k=kk, L=LITTLE[set[k]], w=TEACHW,
  word=w[L.f], er=endOf(w.sg), last=k===set.length-1;
 const tail=L.f==="sg"?er[0]:(L.f==="de"?"el":L.f==="dp"?"oy":"e");
 const side=S.mSide||"front";
 /* ---- the stages ----
    0 meet the little word   1 the picture (card one only)
    2 the ending, on six words
    3 the box in front   4 the box behind   5 both boxes free
    Cards two to four run 0 → 2 → 5: they are met, drilled, and then handed
    both boxes, since the piece-by-piece walkthrough is card one's job.
    turnCard still counts 2 front, 3 behind, 4 free, so the stage is shifted
    by one on the way in. */
 const ms=S.mStep||0;
 /* 0 meet · 1 the ending · 2 the little word · 3 front · 4 behind · 5 both
    free. Cards two to four run 0 → 1 → 2 → 5. turnCard still counts 2 front,
    3 behind, 4 free, so the stage is shifted by one on the way in. */
 const g=ms<=1?0:Math.min(ms-1,4);
 const wclip="words/w"+pad(5,2)+"-"+L.f+".mp3";
 /* the phrase is a recording that does not exist yet; until it does, the
    grown-up line above the card is the voice, which is what it is for */
 const pclip="phr/w"+pad(5,2)+"-"+L.f+"-"+(g===2?"front":side)+".mp3";
 if(g>=4) seeSide(L.k,side);
 const both=!!(S.mSeen&&S.mSeen.has(L.k));

 ACTS[S.act].say = g===0?"A new little word. Press it three times."
  : g===1?"Now tap the picture and say the word."
  : g===2?"Put the little word in the box in FRONT. Then say the two together."
  : g===3?"Now send it round to the box BEHIND, and say those two together."
  : "Move the little word from one box to the other.";

 /* ---- the ending, before anything moves ----
    A child was shown one door, told that -al takes ngal, and then asked to
    move the little word about. One example is not a pattern: it is a fact
    about a door. Six words that end the same way, each one pressed and heard
    with its little word beside it, is the smallest thing that can honestly be
    called a rule — and it has to come before the little word starts changing
    place, or the child is learning two new things at once. */
 if(ms===1){
  /* ================= the ending, on its own =================
     Two skills were being asked for at once. Spotting that baafal ends -al is
     a matter of eyes and ears and has nothing to do with grammar; knowing that
     a word ending -al takes ngal is the grammar. A child who cannot yet do the
     first cannot possibly do the second, and if they fail we have no idea
     which of the two failed. So the ending comes first, with no little word on
     the screen at all: three words shown with the ending lit and heard, the
     rule said once, and then six words mixed — three with this ending and three
     of the same stems wearing a different one — to be sorted before anything
     is allowed to attach itself. Same stems on both sides is deliberate: it
     leaves the ending as the only thing that can be told apart. */
  const pick2=FAMSIX.map(function(i){ return [i,W2[i]] });
  const forms2=pick2.map(function(r){ return r[1][L.f] });
  let sfx="";
  [3,2,1].forEach(function(n){
   if(sfx) return;
   const t2=forms2[0].slice(-n);
   if(forms2.every(function(x){ return x.length>n && x.slice(-n)===t2 })) sfx=t2;
  });
  /* The ending was lit, but it was lit against a stem in the same weight and
     the same black, so what the eye actually saw was a whole word with a
     coloured tail. The stem now steps back a shade. Nothing is hidden \u2014 a
     child still reads the word \u2014 but the part that decides the little word is
     the part that comes forward. */
  const litE=function(f){ return (sfx&&f.slice(-sfx.length)===sfx)
    ?`<span class="stem">${esc(f.slice(0,f.length-sfx.length))}</span><i>${esc(sfx)}</i>`
    :esc(f) };
  /* ---- found once is luck, found twice is the skill ----
     The first round asks for the three words that were just shown, so the
     child begins on ground they have stood on — the only new thing to do is
     tell them apart from the same stems wearing another ending. The second
     round asks for three words that were never shown, which is the whole
     point: the ending can be found on a word nobody demonstrated. */
  const rnd=(S.mRound===2)?2:1;
  const see=pick2.slice(0,3);
  const targ=(rnd===1)?pick2.slice(0,3):pick2.slice(3,6);
  const dec =(rnd===1)?pick2.slice(3,6):pick2.slice(0,3);
  const OF=["sg","de","dp","pl"].filter(function(x){ return x!==L.f });
  if(!S.mSee) S.mSee={};
  const seen3=see.every(function(r){ return S.mSee[r[0]] });
  /* ---- the rule is the reward, so it comes last ----
    The three words, the brace and ngal were all on the first screen: a child
    was handed the conclusion and then asked to go and find the ending they had
    just been told about, which is a test of memory rather than of reading. The
    stage now runs the other way round \u2014 meet the three words and hear how they
    end, find the ending among words that do not have it, find it again on
    words nobody showed you, and only THEN does the brace draw and the little
    word arrive. Same three screens, the payoff at the end of them. */
 const phase=(S.mEphase==="spot")?"spot":((S.mEphase==="join")?"join":"see");

  if(phase!=="spot"){
   /* ---- heard first, and only then the reason ----
      The brace arrived the instant the third word was pressed, which put the
      conclusion on top of the sound the child was still listening to. Hearing
      three words is one job; seeing what they share is another. The second one
      now waits behind a door the child opens, so there is a gap between the
      last word sounding and the little word appearing — and until then the
      rows are the only thing on the screen, to be pressed as often as they
      like. The speakers are gone with it: a row that has to say "press me" in
      an icon is not a button yet. It nudges instead, and stops when it has
      been heard. */
   const shown=(phase==="join");
   ACTS[S.act].say = shown
    ? "All three end -"+sfx+". Press one to hear it with "+L.k+"."
    : seen3 ? "You have heard all three. Now go and find that ending."
    : "Press each word. Listen to how it ends.";
   return wrap(`<div class="meet endsee" style="${mvars(L.k)}">
     ${""/* Printing the little word on all three rows says "three ngals". A
          brace says what is actually true: three words, one ending, and one
          little word between them. It is drawn when the child asks for it,
          so it arrives as the conclusion rather than the wallpaper. */}
     <div class="seewrap${shown?" braced":""}">
      <div class="seelist">${see.map(function(r,ri){
        const w2=r[1], f=w2[L.f], hd=!!S.mSee[r[0]];
        /* v210: the three tiles used to all turn green the moment the brace
           drew, pressed or not. Green is the colour of "you did this". */
        return `<button class="seerow bare${hd?" heard":""}${shown&&hd?" took":""}${hd?"":" nudge"}"
          style="animation-delay:${(1.1+ri*0.25).toFixed(2)}s"
          data-esee="${r[0]}" data-eclip="${shown
            ?`phr/w${pad(r[0],2)}-${L.f}-behind.mp3`
            :`words/w${pad(r[0],2)}-${L.f}.mp3`}">
          ${""/* v209: no picture. This screen is about how the word is
               WRITTEN — the shared ending — and a picture is an invitation to
               answer by recognising the thing instead of reading it. */}
          ${""/* v204: the ending used to be underlined before the child had
               pressed anything, so the answer to "what do these share?" was
               printed on the question. It lights when the row is pressed. */}
          <b class="ff">${hd?litE(f):esc(f)}</b>
         </button>`}).join("")}</div>
      ${shown?`<div class="brace" aria-hidden="true">
        <svg viewBox="0 0 18 120" preserveAspectRatio="none">
         <path d="M2 2 C 11 2, 5 52, 16 60 C 5 68, 11 118, 2 118"/></svg>
       </div>
       <div class="bracemk"><button class="mkplaque big" data-clip="${mkclip(L.k)}"
         aria-label="hear ${esc(L.k)}"><b class="ff">${esc(L.k)}</b></button></div>`:""}
     </div>
     ${shown
       ?`${""/* v173: the brace, the three lit endings and the one plaque already
              say this. Under them sat two sentences of English saying it again
              in words - "all three end -al, so all three took ngal" - which is
              a caption for a grown-up reading over the child's shoulder. The
              picture is the lesson; if it does not carry it, another sentence
              in a language the child cannot read will not either. */}
         <button class="wallbtn good" data-mstep="1">next \u203a</button>`
       :seen3
       ?`<button class="wallbtn good" data-espot>next \u203a</button>`
       :`<p class="waitline">press all three</p>`}
     ${mbackStrip(k,total)}
    </div>`,k,total,true);
  }

  /* ---- find the ones that end this way ---- */
  if(!S.mSpot) S.mSpot={};
  const chips2=[];
  targ.forEach(function(r){ chips2.push({id:"t"+r[0],g:r[1].g,w:r[1][L.f],ok:true}) });
  dec.forEach(function(r,j){
   const of=OF[(j+rnd)%OF.length];
   chips2.push({id:"d"+r[0],g:r[1].g,w:r[1][of],ok:false,end:endTail(r[1][of],sfx)}) });
  chips2.sort(function(a,b){ return (a.w.length*7+a.w.charCodeAt(0)+rnd*3)%5
    -(b.w.length*7+b.w.charCodeAt(0)+rnd*3)%5 });
  const found=chips2.filter(function(c){ return c.ok&&S.mSpot[c.id] }).length;
  const allFound=found>=targ.length;
  ACTS[S.act].say = allFound
   ? (rnd===1?"All three. Now some words you have not seen."
     :"All three again \u2014 and you had not seen any of those.")
   : "Tap the words that end -"+sfx+". Leave the others alone.";
  return wrap(`<div class="meet endspot" style="${mvars(L.k)}">
    <p class="estep"><b class="ff">-${esc(sfx)}</b> \u00b7 ${rnd} of 2</p>
    <div class="spotgrid">${chips2.map(function(c){
      const got=!!S.mSpot[c.id], bad=(S.mSpotBad===c.id);
      /* v210: a twelve-letter word broken across two lines in a half-width
         cell is unreadable. It takes the full row instead. */
      return `<button class="spotc${c.w.length>9?" wide":""}${got?(c.ok?" yes":" no"):""}${bad?" shake":""}"
        data-espick="${esc(c.id)}"${c.ok?' data-eok="1"':` data-eend="${esc(c.end||"")}"`}>
        ${""/* v204: the picture and the little dial are both gone. A child
             asked to find an ending should be reading the word, and a picture
             beside it is a second way to answer that has nothing to do with
             the ending. */}
        <b class="ff">${got&&c.ok?litE(c.w):esc(c.w)}</b></button>`}).join("")}</div>
    ${S.mSpotBad
      ?`<p class="ehint">that one ends <b class="ff">-${esc(S.mSpotEnd||"")}</b>,
         not <b class="ff">-${esc(sfx)}</b></p>`
      :`<p class="ehint">${found} of ${targ.length} found</p>`}
    ${allFound
      ?(rnd===1
        ?`<button class="wallbtn good" data-eround>next \u203a</button>`
        :`<button class="wallbtn good" data-ejoin>next \u203a</button>`):""}
    ${mbackStrip(k,total)}
   </div>`,k,total,true);
 }

 if(ms===2){
  /* ---- collecting the family ----
     Six rows to press was a list, and a list is a thing to get through. The
     same six words are now one at a time, and the child's job changes halfway:
     the first three are HEARD — the word arrives, the ending lights, the little
     word flies in and docks — and the last three are GUESSED, with the little
     word missing and three to choose from. Three examples is enough to see a
     pattern; being asked to use it is what makes it stick, and being right is
     the part a child comes back for. The shelf along the top fills with each
     word caught, so the family assembles in front of them. */
  if(!S.mEdone) S.mEdone={};
  const pick=FAMSIX.map(function(i){ return [i,W2[i]] });
  const forms=pick.map(function(r){ return r[1][L.f] });
  let suf="";
  [3,2,1].forEach(function(n){
   if(suf) return;
   const tail2=forms[0].slice(-n);
   if(forms.every(function(x){ return x.length>n && x.slice(-n)===tail2 })) suf=tail2;
  });
  const lit=function(f){ return (suf&&f.slice(-suf.length)===suf)
    ?`${esc(f.slice(0,f.length-suf.length))}<i>${esc(suf)}</i>`:esc(f) };
  /* the shelf was a scoreboard; it is a way back now. A word already caught can
     be pressed to return to it — a child who wants to see baafal again should
     not have to walk the whole six to reach it. */
  const shelf=`<div class="eshelf">${pick.map(function(r,n){
    const got=S.mEdone[r[0]];
    /* v173: a word shown and a word worked out are not the same thing. The
       first two are demonstrations - the little word flies in on its own - and
       the last four are answered. Both fill the shelf, but the answered ones
       are ringed in the marker's own deep colour and the shown ones stay
       soft, so the row along the top reads as what the child did, not just
       how far they have walked. */
    return `<button class="eslot${got?(n>=2?" got won":" got shown"):""}${n===(S.mEi||0)?" now":""}"
      ${got?`data-eslot="${n}"`:"disabled"}
      aria-label="${got?"back to "+esc(r[1][L.f]):"not yet"}">${
      got?`<span class="egs${(L.n||1)>1?" many":""}">${
        Array.from({length:Math.min(L.n||1,2)}).map(function(){ return r[1].g }).join("")
       }</span>`:"<i></i>"}</button>`}).join("")}</div>`;
  /* The badge used to read -al \u2192 ngal, and an arrow is a claim about order:
     it says ngal comes after -al, which is exactly the thing that is not true.
     ngal stands in FRONT of the word for "this door" and BEHIND it for "the
     door" \u2014 both sides are taught two screens later. Turning the arrow round
     would fix one misreading by teaching the opposite falsehood. So the badge
     names the relation instead of drawing it: -al TAKES ngal, and where it
     stands is a separate lesson with a separate screen. */
  /* While a question is open the badge must not print its answer directly
     above it. It asks the same thing the chips ask, and fills itself in when
     the child has answered. */
  const stampOf=function(quiz){
   return `<div class="estamp"><b class="ff${suf?" end":""}">${
     suf?"-"+esc(suf):esc(L.l)}</b><span class="ea">takes</span>
     <button class="mkplaque${quiz?" q":""}"${quiz?"":` data-clip="${mkclip(L.k)}"`}
      aria-label="hear ${esc(L.k)}"><b class="ff">${quiz?"?":esc(L.k)}</b></button></div>`;
  };
  const stamp=stampOf(false);

  const i=Math.min(S.mEi||0,pick.length);
  /* all six caught */
  if(i>=pick.length && S.eCel!=="seen"){
   /* ---- v230: the well done is a moment, not a paragraph in a list ----
      It was printed underneath the six-word table, so the child read the
      table, then a green box congratulating them, then a button — three
      things stacked in a card that could not hold them, and the praise
      arrived after they had already moved on. It has the screen to itself
      now, and pressing on from it opens the list. */
   sayNow("You made all six. Press on to see them together.");
   return wrap(`<div class="meet mkdone" style="${mvars(L.k)}">
     <div class="mdstar">\u2b50</div>
     <h2 class="mdt">well done</h2>
     <p class="mdp">you made all six with <b class="ff mk">${esc(L.k)}</b></p>
     <div class="celrow">${pick.map(function(r){
       return `<span class="celw">${r[1].g}</span>`}).join("")}</div>
     <button class="wallbtn good" data-ecel>see them together \u203a</button>
    </div>`,k,total,true);
  }
  if(i>=pick.length){
   ACTS[S.act].say="All six. Every one of them takes "+L.k+".";
   return wrap(`<div class="meet endrill" style="${mvars(L.k)}">
     ${stamp}${shelf}
     <p class="edone">${suf
       ?`six words ending <b class="ff">-${esc(suf)}</b> \u2014 and every one of them
         took <b class="ff mk">${esc(L.k)}</b>`
       :`six words that do not end alike \u2014 and every one of them took
         <b class="ff mk">${esc(L.k)}</b>`}</p>
     ${""/* Six chips in a heap said "here are six words" and nothing else.
          The same six in two columns say what the whole stop is about: the
          word on its own, and the word with its little word in front of it.
          The change is on one line, in one place, six times over. */}
     <div class="pairlist frieze">
      <p class="ph"><span>on its own</span><span>with ${esc(L.k)}</span></p>
      ${pick.map(function(r){
       const f=r[1][L.f];
       return `<button class="prow" data-clip="words/w${pad(r[0],2)}-${L.f}.mp3">
         <span class="pl"><span class="eg">${r[1].g}</span>
           <b class="ff">${lit(f)}</b></span>
         <span class="parr">\u2192</span>
         <span class="pr ff">${esc(f)} <b class="mk">${esc(L.k)}</b></span></button>`
      }).join("")}
     </div>
     
     ${""/* v212: the demonstration of the switch belongs to ngal. Once a child
          has watched a little word change sides, watching it again on ngel and
          koy teaches nothing new — they go straight to doing it. */}
     ${""/* v236: "show me" and "my turn" are what the NEXT screen is, which
          reads as an offer to be told something again rather than as the way
          out of this one \u2014 and this is the only screen in the course whose
          way on is not called next. It is called next. */}
     <button class="wallbtn good" data-mstep="${S.act==="wordmac"?3:4}"
       data-pfresh="1">next \u203a</button>
     ${mbackStrip(k,total)}
    </div>`,k,total,true);
  }

  const row=pick[i], wi=row[0], ww=row[1], wf=ww[L.f];
  /* the ending has already been seen and sorted, so only two need showing */
  const ask=i>=2, got=!!S.mEdone[wi];
  /* the card reveals itself once, when it arrives or when it is answered.
     A wrong tap re-draws the screen but must not re-play the entrance — a
     picture that jumps every time you touch anything is noise, not feedback. */
  const akey="ed|"+wi+"|"+(got?1:0), fresh=ARRIVED!==akey;
  if(fresh) ARRIVED=akey;
  const clip="words/w"+pad(wi,2)+"-"+L.f+".mp3";
  ACTS[S.act].say = got
   ? "Yes. "+wf+" takes "+L.k+"."
   : ask ? "Which little word does this one take? Look at the end."
   : "Press the word and listen for the ending.";

  /* two wrong little words to choose between, steady from one visit to the next */
  const others=LITTLE.filter(function(x){ return x.k!==L.k })
    .map(function(x){ return x.k });
  const wrongs=[others[i%others.length],others[(i+1)%others.length]];
  /* the right one moves along one place each time — a child who has worked out
     that the answer is always on the left has learnt the wrong thing */
  const chips=wrongs.slice(); chips.splice(i%3,0,L.k);

  return wrap(`<div class="meet endrill" style="${mvars(L.k)}">
    ${stampOf(ask&&!got)}${shelf}
    <div class="ecard${got?" caught":""}${fresh?" arrive":""}">
     ${""/* ---- the ending and the little word, side by side ----
          baafal ngal puts -al and ngal next to each other; ngal baafal puts a
          whole word between them. The first is the one to learn the rule on,
          because the rule is visible in it: the thing that ends -al is
          touching the thing it took. The other order is taught at the end of
          the stop, once the pairing is not in doubt. It is also the commoner
          of the two — the door rather than this door. */}
     <div class="ecrow">
      <button class="ecw ff" data-clip="${clip}"
        aria-label="hear the word again">${lit(wf)}</button>
      ${got?`<button class="ecmk ff${fresh?" flyin":""}" data-clip="${mkclip(L.k)}"
         aria-label="hear ${esc(L.k)}">${esc(L.k)}</button>`
        :`<span class="ecsock${ask?" asking":""}"><i></i></span>`}
     </div>
     ${got?`<p class="ecen">${esc(ww.en)}</p>`:""}
    </div>
    ${""/* v209: the shelf along the top already counts these. Two counters on
         one card is one too many. */}
    ${got?`<button class="wallbtn good" data-enext>next \u203a</button>`
     : ask?`<div class="echips">${chips.map(function(c){
         return `<button class="echip ff${S.mEbad===c?" bad":""}" data-epick="${esc(c)}"
           data-eidx="${wi}">${esc(c)}</button>`}).join("")}</div>
        ${S.mEbad?`<p class="ehint">not that one \u2014 look at how the word ends</p>`:""}`
     :`<button class="hearbtn mkbtn pulse" data-ehear="${wi}" data-eclip="${clip}">
        <span class="bars"><i></i><i></i><i></i></span>hear it</button>`}
    ${mbackStrip(k,total)}
   </div>`,k,total,true);
 }

 /* The picture screen has gone again, for the reason it went the first time:
    it showed the object, the noun and the lit ending, and the screen after it
    showed the same object, the same noun and the same lit ending in a list of
    three. The word is met inside that list, where it is one of a set. */

 /* ---- the meeting ----
    Same shape as the alphabet stop, and deliberately so: a child who has been
    round the letters knows this screen already, so the only new thing on it is
    the word itself. It says itself when it lands, it moves on every press, and
    three presses open the door. */
 if(g===0){
  const pr=S.mPress||0, doneP=pr>=PRESSES, at=SPOTS[(k*3+pr*3)%SPOTS.length];
  ACTS[S.act].say = doneP?"That is "+L.k+". Hear it again, or go on."
   : pr===0?"This is "+L.k+". Press it to hear it."
   : "Again \u2014 press "+L.k+".";
  return wrap(`<div class="meet mkmeet" style="${mvars(L.k)}">
    <p class="grownup">grown-up: it says <b class="ff">${esc(L.k)}</b>
      <span class="nameis">${esc(L.l)}</span></p>
    <div class="jfield">
     <button class="jletter ff${pr===0?" nudge":""}${doneP?" settled":""}"
       style="left:${at[0]}%;top:${at[1]}%;color:var(--mk-deep)"
       data-mpress>${esc(L.k)}</button>
     ${pr===0?`<i class="autosay" hidden data-autoplay data-clip="${mkclip(L.k)}"></i>`:""}
     ${Array.from({length:PRESSES}).map(function(_,i){
       return `<i class="pdot${i<pr?" on":""}" style="left:${50+(i-1)*9}%"></i>`}).join("")}
    </div>
    ${doneP?`<div class="twoway">
       <button class="tw again" data-mkagain>
        <span class="ic">${SPKSVG}</span>hear it again</button>
       <button class="tw on" data-mstep="0">next \u203a</button>
      </div>`
     :`<p class="meetsay">${pr===0?"press the little word":`${PRESSES-pr} more`}</p>`}
    ${mbackStrip(k,total)}
   </div>`,k,total,true);
 }

 /* ================= watch, then do, then hear =================
    The two boxes were one screen doing three jobs: it showed the little word
    in front, then asked for it behind, then left both live — all on the same
    noun, with the child expected to work out from a dashed outline that
    anything had happened. The three jobs are three screens now.

    WATCH   The little word walks into the front box on its own and the phrase
            says itself; then it walks round the back and the phrase says
            itself again. Nothing is asked. The arc is drawn here and only
            here, because here it is describing rather than instructing.
    DO      Three words, one at a time. The word says itself, then the empty
            box asks. Every switch reads the whole phrase back, so the child
            hears what they made. Each of the three has to be moved at least
            once; after that the door opens.
    HEAR    Four phrases, sound only: was the little word at the start or at
            the end? Which is the only test that matters — the whole point of
            the two positions is that they are two different things to hear. */
 const PWORDS=FAMSIX.slice(0,3);
 const phrClip=function(wi,pos){ return "phr/w"+pad(wi,2)+"-"+L.f+"-"+pos+".mp3" };
 const wordClip=function(wi){ return "words/w"+pad(wi,2)+"-"+L.f+".mp3" };
 const boxes=function(mark,wordHtml,side,opts){
  const o=opts||{};
  const chip=`<span class="chipm ff walked" style="--from:${side==="front"?"132px":"-132px"}">${esc(mark)}</span>`;
  const dock=function(pos,lab){
   const full=(side===pos), ask=(!full&&o.live);
   return `<button class="dock ${full?"full":"empty"}${o.live?"":" idle"}${ask?" asking":""}"
     ${o.live?`data-pflip="${pos}"`:"disabled"}
     aria-label="${full?"the little word is here":"put the little word here"}">
     ${full?chip:'<i class="slot"></i>'}<span class="dl">${esc(lab)}</span></button>`;
  };
  return `<div class="turnc arrived" style="${mvars(mark)}">
    ${o.arc?`<div class="arc" aria-hidden="true"><svg viewBox="0 0 300 46" preserveAspectRatio="none">
      <path d="M254 40 C 204 -6, 96 -6, 46 34"/><polygon points="46,40 36,24 54,24"/></svg></div>`:""}
    <div class="phrase">${dock("front",frontLab(mark))}<button class="pword"
      ${o.clip?`data-clip="${esc(o.clip)}"`:""}>${wordHtml}</button>${dock("behind","the")}</div>
    ${o.gloss?`<div class="gloss">${esc(o.gloss)}</div>`:""}
   </div>`;
 };

 /* ================= what the little word is FOR =================
    The stop taught which words take ngal and where ngal stands, and never
    said what it means. A child could finish it able to put ngal on the right
    six words without knowing that it says ONE of them, or that it is never
    said of a person — which is half of what a class marker is. Two shown
    contrasts, then one question:
      one door takes ngal, many doors take ɗee;
      a thing takes ngal, a person takes oo;
      and then: of these four, which one takes ngal?
    The tiles in the question carry no little words — only the picture and the
    word — or the answer would be printed on them. */
 if(ms===3){
  /* Both contrasts now sit on one screen. What ngal MEANS is said where it
     first appears — on the plaque, the moment the brace draws — because that
     is when a child asks what a new word is. What it does NOT cover needs the
     six examples behind it, so the limits stay here, shown together and asked
     once rather than three screens deep. */
  const u=Math.min(S.uStep||0,1);
  const one=W2[FAMSIX[0]], two=W2[FAMSIX[3]];
  const many=one.pl, manyMk=one.m[MIX.pl];
  if(u<1){
   const left=`<div class="ubox">
     <div class="uobjs"><span class="obj" style="font-size:52px">${one.g}</span></div>
     <p class="uph"><b class="ff">${esc(one[L.f])}</b> <b class="ff mk">${esc(L.k)}</b></p>
     <p class="uen">${esc(L.the_)}</p></div>`;
   const right=`<div class="ubox alt">
      <div class="uobjs">${"<span class=\"obj\" style=\"font-size:30px\">"+one.g+"</span>"
        .repeat(4)}</div>
      <p class="uph"><b class="ff">${esc(many)}</b> <b class="ff other">${esc(manyMk)}</b></p>
      <p class="uen">the ${esc(one.en)}s \u2014 more than one</p></div>`;
   const left2=`<div class="ubox">
     <div class="uobjs"><span class="obj" style="font-size:44px">${one.g}</span></div>
     <p class="uph"><b class="ff">${esc(one[L.f])}</b> <b class="ff mk">${esc(L.k)}</b></p></div>`;
   const right2=`<div class="ubox alt">
     <div class="uobjs"><span class="obj" style="font-size:44px">\ud83e\uddd1</span></div>
     <p class="uph"><b class="ff dim">a person</b> <b class="ff other">oo</b></p></div>`;
   ACTS[S.act].say = L.k+" is for one of them, and it is never said of a person.";
   return wrap(`<div class="meet boxcard" style="${mvars(L.k)}">
     ${mbackStrip(k,total)}
     <p class="estep"><b class="ff">${esc(L.k)}</b></p>
     <div class="urow">${left}<span class="uvs">not</span>${right}</div>
     <p class="rhyme"><b class="ff mk">${esc(L.k)}</b> is <b>one</b> of them</p>
     <div class="urow tight">${left2}<span class="uvs">not</span>${right2}</div>
     <p class="rhyme">and it is for a <b>thing</b>, never a person</p>
     <button class="wallbtn good" data-unext>next \u203a</button>
    </div>`,k,total,true);
  }
  /* the question */
  const rnd=0, thing=W2[FAMSIX[0]];
  const tiles=[
   {id:"one", g:thing.g, n:1, w:thing[L.f], ok:true},
   {id:"many",g:thing.g, n:3, w:thing.pl, ok:false, why:"that is more than one"},
   {id:"per", g:"\ud83e\uddd1", n:1, w:"", ok:false, why:"that is a person", en:"a person"},
   {id:"pers",g:"\ud83e\uddd1", n:3, w:"", ok:false, why:"those are people", en:"people"}];
  tiles.sort(function(a,b){ return ((a.id.length*7+rnd)%5)-((b.id.length*7+rnd)%5) });
  const got=S.uPick==="one";
  ACTS[S.act].say = got
   ? "Yes. One "+thing.en+" \u2014 "+thing[L.f]+" "+L.k+"."
   : "Which one of these takes "+L.k+"?";
  return wrap(`<div class="meet boxcard" style="${mvars(L.k)}">
    ${mbackStrip(k,total)}
    <p class="estep"><b class="ff">${esc(L.k)}</b> ?</p>
    <div class="ugrid">${tiles.map(function(t2){
      return `<button class="utile${got&&t2.ok?" yes":""}${S.uMiss===t2.id?" no":""}"
        data-upick="${t2.id}"><span class="ug">${
        Array.from({length:t2.n}).map(function(){return t2.g}).join("")}</span>
        <b class="ff">${t2.w?esc(t2.w):esc(t2.en)}</b></button>`}).join("")}</div>
    ${S.uMiss?`<p class="ehint">${esc((tiles.filter(function(x){return x.id===S.uMiss})[0]||{}).why||"")}
       \u2014 <b class="ff">${esc(L.k)}</b> is for one thing</p>`
     :got?`<p class="demosay"><b class="ff">${esc(thing[L.f])}</b>
        <b class="ff mk">${esc(L.k)}</b><small>${esc(L.the_.replace("door",thing.en))}</small></p>`
     :`<p class="ehint">one of them, and not a person</p>`}
    ${got?`<button class="wallbtn good" data-unext>next \u203a</button>`:""}
   </div>`,k,total,true);
 }

 /* ---- WATCH ----
    The phrase is the point of the screen, so it goes at the top where a child
    looks first; the picture is underneath, supporting it. The arc is drawn in
    the direction the little word actually travels — from behind the word round
    to the front, which on the page is right to left — and it is drawn once,
    slowly, rather than looping until it becomes wallpaper. Everything on the
    card can be pressed to hear it, because a screen with nothing to press is a
    screen a child assumes is broken. */
 if(ms===4){
  /* ---- v208: a run of examples, not one word shown twice ----
     One word turned round once is an anecdote. Three words, each shown on
     both sides, is the thing a child can generalise from — and it is the
     last stop before they are asked to do it themselves. */
  const d=Math.min(S.dStep||0,DEMON-1), wi=DEMOW[Math.floor(d/2)];
  const w0=W2[wi], f0=w0[L.f];
  const side=(d%2===0)?"behind":"front";
  ACTS[S.act].say = side==="behind"
   ? "Watch. "+L.k+" goes after the word, and it means "+L.the_+"."
   : "Now it goes in front, and it means "+L.this_+".";
  const phrase=side==="behind"
   ? `<b class="ff">${esc(f0)}</b> <b class="ff mk">${esc(L.k)}</b>`
   : `<b class="ff mk">${esc(L.k)}</b> <b class="ff">${esc(f0)}</b>`;
  return wrap(`<div class="meet boxcard" style="${mvars(L.k)}">
    ${mbackStrip(k,total)}
    ${""/* v209: the dots under the phrase are the counter here */}
    <button class="phrasetop demo${side==="front"?" moved":""}" data-clip="${phrClip(wi,side)}"
      aria-label="hear it again">${phrase}
      <small>${esc(side==="behind"?L.the_:L.this_)} ${SPKSVG}</small></button>
    ${""/* v210: koy means "little ONES" and ɗee means "many of them", and the
         picture underneath was drawing exactly one of the thing. The count
         comes from the little word itself, so the picture agrees with the
         word above it. */}
    <div class="picturn small"><div class="objs still">${
      Array.from({length:L.n||1}).map(function(){
        return `<span class="obj" style="font-size:${Math.round(L.z*0.72)}px">${w0.g}</span>`
       }).join("")}</div></div>
    ${""/* The boxes used to sit under the demonstration, half-filled, with an
         arc drawn over the top of them \u2014 so the child was being shown a thing
         and asked to do it in the same breath, and the arc crossed the word
         and the box it was pointing at. The demonstration is now the phrase
         alone: the little word travels across it, once, slowly. The boxes
         belong to the screen after this, where they are the child's job. */}
    <i class="autosay" hidden data-autoplay data-clip="${phrClip(wi,side)}"></i>
    <button class="wallbtn good" data-dnext>next \u203a</button>
   </div>`,k,total,true);
 }

 /* ---- DO ---- */
 if(ms===5){
  /* only Dalaba ends with the listening — the other stops have their own tail */
  const hear=(S.act==="wordmac");
  if(!S.pDone) S.pDone={};
  const pi=Math.min(S.pI||0,PWORDS.length-1), wi=PWORDS[pi], w0=W2[wi], f0=w0[L.f];
  const side=S.pSide||"behind", moved=!!S.pDone[wi];
  const lastW=pi>=PWORDS.length-1;
  ACTS[S.act].say = moved
   ? (side==="front"?L.k+" "+f0+" \u2014 "+L.this_+".":f0+" "+L.k+" \u2014 "+L.the_+".")
   : "Your turn. Put "+L.k+" in FRONT of the word.";
  const phrase=side==="front"
   ? `<b class="ff mk">${esc(L.k)}</b> <b class="ff">${esc(f0)}</b>`
   : `<b class="ff">${esc(f0)}</b> <b class="ff mk">${esc(L.k)}</b>`;
  return wrap(`<div class="meet boxcard" style="${mvars(L.k)}">
    ${""/* v212: the dots under the phrase count these three. A second counter
         pushed the whole card down and the prompt at the foot — the one thing
         telling a child what to do — went off the bottom of the screen. */}
    <button class="phrasetop${moved?"":" quiet"}" data-clip="${
      moved?phrClip(wi,side):wordClip(wi)}" aria-label="hear it again">${phrase}
      <small>${moved?esc(side==="front"?L.this_:L.the_):esc(w0.en)} ${SPKSVG}</small></button>
    <div class="swdots">${PWORDS.map(function(x,n){
      return `<i class="swdot${S.pDone[x]?" on":""}${n===pi?" now":""}"></i>`}).join("")}</div>
    <div class="picturn small"><div class="objs still">${
      Array.from({length:L.n||1}).map(function(){
        return `<span class="obj" style="font-size:${Math.round(L.z*0.72)}px">${w0.g}</span>`
       }).join("")}</div></div>
    ${boxes(L.k,esc(f0),side,{live:true,clip:wordClip(wi)})}
    ${""/* the position line goes last, so it is under everything rather than
         above the thing the child has to see */}
    <i class="autosay" hidden data-autoplay data-clip="${wordClip(wi)}"></i>
    ${moved
      ?`<button class="wallbtn good" ${lastW&&!hear?"data-tnext":"data-swnext"}>next \u203a</button>`
      :(side==="behind"
        ?`<p class="sidecue big"><span class="cuebox" aria-hidden="true"></span>
           <span class="cuearr" aria-hidden="true">\u2190</span>
           <b class="ff mk">${esc(L.k)}</b></p>`
        :`<p class="sidecue big"><b class="ff mk">${esc(L.k)}</b>
           <span class="cuearr" aria-hidden="true">\u2192</span>
           <span class="cuebox" aria-hidden="true"></span></p>`)}
    ${mbackStrip(k,total)}
   </div>`,k,total,true);
 }

 /* ---- HEAR ----
    Two abstract buttons — at the start, at the end — asked a child to hold a
    phrase in their head and then describe its shape, which is a second task on
    top of the listening. The phrases are on the table now: three of them, one
    is the one that played, and the job is to find it. Same skill, no reporting
    step, and it plays like a game rather than a quiz. */
 if(ms===6){
  const qs=[[FAMSIX[0],"behind"],[FAMSIX[1],"front"],[FAMSIX[2],"behind"],[FAMSIX[3],"front"]];
  const li=Math.min(S.lI||0,qs.length-1), q=qs[li], wi=q[0], pos=q[1];
  const w0=W2[wi], f0=w0[L.f];
  const other=FAMSIX[(FAMSIX.indexOf(wi)+2)%FAMSIX.length], w1=W2[other];
  const key=function(i,p){ return i+"|"+p };
  const opts=[{i:wi,p:pos},{i:wi,p:pos==="front"?"behind":"front"},{i:other,p:pos}];
  opts.sort(function(a,b){ return ((a.i*3+(a.p==="front"?1:0)+li)%5)-((b.i*3+(b.p==="front"?1:0)+li)%5) });
  const got=S.lPick===key(wi,pos);
  ACTS[S.act].say = got
   ? "Yes \u2014 "+(pos==="front"?L.k+" "+f0:f0+" "+L.k)+"."
   : "Listen, then tap the one you heard.";
  return wrap(`<div class="meet boxcard listenc" style="${mvars(L.k)}">
    ${mbackStrip(k,total)}
    <p class="estep">${li+1} of ${qs.length}</p>
    ${""/* v209: this was the one screen still wearing a big round speaker of
         its own. There is one listen button in this course. */}
    <button class="hearbtn big" data-clip="${phrClip(wi,pos)}"
      aria-label="hear it again"><span class="bars"><i></i><i></i><i></i></span>listen</button>
    <i class="autosay" hidden data-autoplay data-clip="${phrClip(wi,pos)}"></i>
    <div class="lrow">${opts.map(function(o){
      const ow=W2[o.i], of=ow[L.f], kk=key(o.i,o.p), right=(kk===key(wi,pos));
      const txt=o.p==="front"
        ? `<b class="ff mk">${esc(L.k)}</b> <b class="ff">${esc(of)}</b>`
        : `<b class="ff">${esc(of)}</b> <b class="ff mk">${esc(L.k)}</b>`;
      return `<button class="lopt${got&&right?" hit":""}${S.lMiss===kk?" miss":""}${got?"":" wait"}"
        data-lpick="${esc(kk)}">
        ${""/* v209: the picture answered the question. Three phrases differing
             only in where the little word stands cannot be told apart by a
             door, so a door beside them is either useless or a shortcut. */}
        <span class="lp">${txt}</span></button>`}).join("")}</div>
    ${got?`<div class="matched wide">
       <b class="ff">${pos==="front"
         ?`<span class="mk">${esc(L.k)}</span> ${esc(f0)}`
         :`${esc(f0)} <span class="mk">${esc(L.k)}</span>`}</b>
       <small>${esc(pos==="front"?L.this_:L.the_)}</small>
      </div>
      <button class="wallbtn good" ${li>=qs.length-1?`data-mstep="6"`:"data-lnext"}
      >next \u203a</button>`:""}
   </div>`,k,total,true);
 }

 /* ---- v210: the card ends on something ----
    Six stages of work handed straight over to the next stop with nothing in
    between. A child who has just built, switched and heard a whole little
    word should be told so before the road takes them anywhere. */
 if(ms===7){
  ACTS[S.act].say="That is "+L.k+", both ways round.";
  return wrap(`<div class="meet mkdone" style="${mvars(L.k)}">
    <div class="mdstar">\u2b50</div>
    <h2 class="mdt"><b class="ff mk">${esc(L.k)}</b></h2>
    <p class="mdp">you can make it both ways round</p>
    <div class="mdpair">
     <span class="ff">${esc(TEACHW[L.f])} <b class="mk">${esc(L.k)}</b></span>
     <span class="ff"><b class="mk">${esc(L.k)}</b> ${esc(TEACHW[L.f])}</span>
    </div>
    <button class="wallbtn good" data-tnext>done \u2713</button>
   </div>`,total,total,true);
 }

 /* nothing below: the card is the six stages above */
 return wrap(`<div class="meet boxcard"><p class="waitline">\u2014</p>
   ${mbackStrip(k,total)}</div>`,k,total,true);
}

/* Six questions across two nouns, not four across one: paɗal is ngal like the
   word it was taught on, ombolookuru is nduu like the word it was compared with.
   The options are always that noun's own four, so nothing is guessable from the
   shape of the choices. */
const TQ=[{i:4,f:"de"},{i:4,f:"sg"},{i:4,f:"dp"},{i:4,f:"pl"},
          {i:3,f:"sg"},{i:3,f:"pl"}];
function wmTCheck(){
 const k=Math.min(S.wmI||0,TQ.length-1), q=TQ[k], w=W2[q.i];
 const L=LITTLE.find(function(x){return x.f===q.f});
 const tgt=w.m[MIX[q.f]], word=w[q.f], got=S.wmPick===tgt;
 const opts=[w.m[0],w.m[1],w.m[2],w.m[3]].filter(function(v,j,a){return a.indexOf(v)===j});
 ACTS[S.act].say="Which little word goes in front of this one?";
 return wrap(`<div class="hf">
   <div class="gloss aside${got?" said":""}">${got?`\u2713 ${esc(L.l)}`
     :`${esc(w.en)} \u00b7 ${esc(L.l)}`}</div>
   <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;min-height:64px">
    ${Array.from({length:L.n}).map(function(){
      return `<span class="obj" style="font-size:${L.z}px">${w.g}</span>`}).join("")}</div>
   <div class="wordbig" style="margin-top:4px"><span class="chipm ff${got?"":" blank"}">${got?esc(tgt):"?"}</span> ${esc(word)}</div>
   ${""/* v216: the card printed the English twice — once between the word and
        the options, and again in green underneath once the answer landed.
        Two lines of English on a card about a Pular word, and between them
        they pushed the way on off the bottom of the screen. There is one now,
        in the corner where the other cards keep their English. */}
   <div class="hfrow" style="margin-top:15px">${opts.map(function(x){
     const cls=got&&x===tgt?" hit":(S.wmMiss===x?" miss":"");
     return `<button class="hfk word${cls}" data-tpick="${esc(x)}">${esc(x)}</button>`}).join("")}</div>
   ${got?`<button class="wallbtn good" data-tgo>next \u203a</button>`:""}
   ${backStrip("tcheck",k,TQ.length)}
  </div>`,k,TQ.length,true);
}

/* ---- words you cannot count ----
   Everything in this unit so far has told the child that a word has four forms
   and a partner that matches its ending. That is true of countable things and
   false of water. Rather than let them find the hole by falling in it, the hole
   is taught: these words have no many and no little one, and the reason is that
   you cannot count them.

   Every word below is already in the course with the book behind it — ndiyam
   from the sentence Sira yarii ndiyam, njaareendi from the letter list, leydi
   from Fuuta Jaloo ko leydi labaandi. lamɗam and nguddam are in the primer's
   syllable list too and are almost certainly salt and sweetness, but the book
   never glosses them, so they are held back for the author rather than guessed
   at in front of a child. */
/* v234: ndiyam and baafal are the two families' heads on the sorting board,
   standing on screen the whole time, so they are no longer also cards to sort
   \u2014 a word cannot be both the name of the group and a thing to put in it. */
const MASSQ=[
 {w:"njaareendi", g:"\ud83c\udfdc\ufe0f", en:"sand", mass:true},
 {w:"bareeru",   g:"\ud83d\udc15", en:"dog",         mass:false},
 {w:"leydi",      g:"\ud83c\udf0d", en:"earth, land", mass:true},
 {w:"kaakol",     g:"\ud83c\udf41", en:"leaf",        mass:false},
 {w:"lamɗam",     g:"\ud83e\uddc2", en:"salt",        mass:true},
 {w:"taabal",     g:"\ud83c\udf7d\ufe0f", en:"table",       mass:false},
 {w:"kosam",      g:"\ud83e\udd5b", en:"milk",        mass:true},
 {w:"laɓi",       g:"\ud83d\udd2a", en:"knife",       mass:false},
 {w:"maaro",      g:"\ud83c\udf5a", en:"rice",        mass:true}];

/* ---- v234: Koubia makes two groups, and you can see them ----
   v233 fixed the question (asked about the picture, in English, before any
   Pular is on screen) but kept the shape: two buttons, eleven times, nothing
   left behind. A child could answer every one and still not notice they had
   been building two families \u2014 the whole point of the stop.
   It sorts now. One thing comes to the top, the two families stand open
   underneath, headed by the pair the stop opened with, and the thing is put
   into one of them. Each group keeps what it is given and grows down the
   screen, so the last word is placed against ten already sorted, and the fact
   the stop exists for is written on the chips themselves: the countable ones
   carry their many, the others carry a dash where a many would be.
   The Pular still arrives only after the answer \u2014 the chip is printed as it
   lands, never before. */
function msPlural(w){
 for(var i=0;i<W2.length;i++) if(W2[i].sg===w) return W2[i].pl;
 return "";
}
function msChip(q,fresh){
 const pl=q.mass?"":msPlural(q.w);
 return `<span class="mschip${fresh?" landed":""}"><span class="ce">${q.g}</span>
   <b>${esc(q.w)}</b>${q.mass?`<i class="none">\u2014</i>`
    :(pl?`<i>${esc(pl)}</i>`:"")}</span>`;
}
function msBins(upto,live){
 const held=MASSQ.slice(0,upto);
 const bin=function(mass,cls,em,name){
  const mine=held.filter(function(q){return q.mass===mass});
  return `<${live?"button":"div"} class="msbin ${cls}${S.msBad===(mass?"1":"0")?" bad":""}"
    ${live?`data-msput="${mass?1:0}"`:""}>
   <span class="bh"><span class="be">${em}</span><b class="ff">${esc(name)}</b>
    <i>${mass?"\u223f":"1 2 3"}</i></span>
   <span class="msheld">${mine.map(function(q){
     return msChip(q,q===held[held.length-1])}).join("")}</span>
  </${live?"button":"div"}>`;
 };
 return `<div class="msboard">${bin(false,"count","\ud83d\udeaa","baafal")}
  ${bin(true,"mass","\ud83d\udca7","ndiyam")}</div>`;
}
function masswords(){
 const N=MASSQ.length, TOTAL=N+2;
 if((S.msI||0)>N+1) return done("\ud83d\udca7","Some words have no many");
 ACTS.masswords.say=(S.msI||0)===0
  ?"Some things you can count. Some you just have more of."
  :"Look at the picture. Put it with the ones it is like.";

 /* the worked pair, which is also where the two groups get their names */
 if(!S.msI) return wrap(`<p class="rhyme">Some things you can count. Some you
   just have more of \u2014 and in Pular those ones have no many and no little one.</p>
  <div class="msex">
   <div class="msrow">
    <span class="msg">\ud83d\udeaa</span>
    <span class="mst"><b class="ff">baafal</b><i class="ff">baafe</i>
     <small>one door, two doors \u2014 you can count doors</small></span>
   </div>
   <div class="msrow no">
    <span class="msg">\ud83d\udca7</span>
    <span class="mst"><b class="ff">ndiyam</b><i class="none">\u2014</i>
     <small>water, and more water \u2014 there is no <b class="ff">ndiyams</b></small></span>
   </div>
  </div>
  <button class="wallbtn good" data-msnext>next \u203a</button>`,0,TOTAL);

 /* every one sorted: the two families stand full, and that is the last screen */
 if(S.msI>N) return wrap(msBins(N,false)
  +`<button class="wallbtn good" data-msnext>next \u203a</button>`,TOTAL-1,TOTAL);

 const q=MASSQ[S.msI-1];
 return wrap(`<div class="msnow"><span class="mse">${q.g}</span>
   <span class="msen">${esc(q.en)}</span></div>
  ${msBins(S.msI-1,true)}
  <p class="msleft">${S.msI-1} / ${N}</p>`,S.msI,TOTAL);
}

/* ---- make the word ----
   The pens go word \u2192 little word. This goes the other way: the child is shown
   how many there are and has to choose the little word themselves. Same four
   options every time, all four taken from that noun's own set, so nothing is
   guessable from the shape of the choices. */
const MQ=(function(){
 const out=[], forms=["sg","de","dp","pl"];
 W2.forEach(function(w,i){ if(!w.nd) out.push({i:i,f:forms[i%4]}) });
 return out.filter(function(q,i){
  if(i%3!==0) return false;
  /* A noun whose own singular marker is ngel or koy would contradict the lesson
     the child just had — "one of it?" answered with the little-one word. The
     book gives pennitorgal (ngal) beside pennitorgel (ngel), so the course uses
     the ngal headword and this guard now catches nothing; it stays because the
     everyday word list may yet bring in a noun that needs it. */
  const m=W2[q.i].m[MIX[q.f]];
  return !(q.f==="sg" && (m==="ngel"||m==="koy"));
 });
})();
/* ---- the other families ----
   Lab\u00e9 teaches the four FORMS of one noun, which quietly implies eleven
   markers are eleven separate facts. They are not: the ending predicts the
   marker for all thirty-three words, so what is worth teaching is the ending,
   not the marker. ngal (-al) is already carried by the thirteen words at Lab\u00e9;
   these three cover ten more, which takes the rule to twenty-three of the
   thirty-three. The six one-off markers are deliberately NOT staged \u2014 six stops
   teaching one word each is a worse lesson than a wall you can look at, so they
   stay in the reference sheet. \u00f1aawoowo is left out too: -oo is the class for
   people, not an ending pattern, and folding it in here would teach a rule that
   is not true. */
const FSET=["ngal","nduu","ndee","ngol"];
const FAMS=[
 {k:"nduu", end:"du and -ru", lead:25, rest:[10,29,3]},
 {k:"ndee", end:"re",         lead:13, rest:[18,26]},
 {k:"ngol", end:"ol",         lead:6,  rest:[14,22]}];
/* Two from each family, interleaved rather than blocked, so the answer cannot
   be carried over from the card before. Every question offers the same four,
   so only the ending tells you. */
const FQ=[10,18,14,29,26,22];

function fmTeach(){
 const k=Math.min(S.fmM||0,FAMS.length-1), F=FAMS[k], w=W2[F.lead];
 const side=S.mSide||"front", keys=FAMS.map(function(f){return f.k});
 /* ---- v237: which little word, and then where it stands ----
    One card was carrying two lessons at once: the ending that predicts the
    marker, and the fact that the marker occupies two different positions with
    two different meanings. A child was being asked to hold both while doing
    neither. They are two screens now. The first says which little word this
    family takes and shows the three words it covers; the second is the phrase
    with its two boxes, and that is the only thing on it. */
 const where=(S.fmWhere||0)===1;
 if(where) seeSide(F.k,side);
 const mkDone=!!(S.mSeen&&S.mSeen.has(F.k));
 ACTS.makeword.say=where
  ?"The little word has two places. Send it round."
  :"The end of the word tells you the little word.";

 /* screen one: which little word this family takes */
 if(!where) return wrap(`<div class="meet" style="${mvars(F.k)}">
   ${mrail(FSET,F.k,S.mSeen,["ngal"],S.mBoth,false)}
   <div class="bigmark ff" style="color:var(--mk-deep)">${esc(F.k)}</div>
   <p class="marksays">for the ones ending -${esc(F.end)}</p>
   <div class="picturn">
    <div class="objs"><span class="obj" style="font-size:64px">${w.g}</span></div>
   </div>
   <button class="whichw ff" data-mclip="words/w${pad(F.lead,2)}-sg.mp3"
     style="color:var(--mk-deep)">${esc(w.sg)}</button>
   <p class="rhyme">the <b>-${esc(F.end)}</b> ones take <b>${esc(F.k)}</b></p>
   <div class="famrow">${F.rest.map(function(i){
     return `<span>${W2[i].g} <b>${esc(W2[i].sg)}</b></span>`}).join("")}</div>
   <button class="wallbtn good" data-fwhere>next \u203a</button>
   ${backStrip("mk",k,FAMS.length)}
  </div>`,k,FAMS.length,true);

 /* screen two: and where it stands */
 return wrap(`<div class="meet" style="${mvars(F.k)}">
   ${mrail(FSET,F.k,S.mSeen,["ngal"],S.mBoth,mkDone&&!allTurned(keys))}
   ${turnCard(k,F.k,esc(w.sg),(side==="front"?"this ":"the ")+w.en,side,
     "words/w"+pad(F.lead,2)+"-sg.mp3",4,!mkDone)}
   ${""/* the listen block is gone: the little words at the top are the sound
        now, so pressing one both goes there and says it */}
   ${allTurned(keys)?`<button class="wallbtn good" data-fnext>next \u203a</button>`
    :`<p class="railcue">${mkDone?`<span class="up">\u2191</span>`:""}
      <span>${keys.filter(function(x){return S.mSeen&&S.mSeen.has(x)}).length} / ${keys.length}</span></p>`}
   ${backStrip("mk",k,FAMS.length)}
  </div>`,k,FAMS.length,true);
}

function fmCheck(){
 const k=Math.min(S.fmI||0,FQ.length-1), w=W2[FQ[k]], tgt=w.m[0], got=S.fmPick===tgt;
 const rot=k%FSET.length, shown=FSET.slice(rot).concat(FSET.slice(0,rot));
 ACTS.makeword.say="Which little word goes with this one?";
 return wrap(`<div class="hf">
   <div class="wmpic">${w.g}</div>
   <div class="wordbig" style="margin-top:2px"><span class="chipm ff${got?"":" blank"}">${got?esc(tgt):"?"}</span> ${esc(w.sg)}</div>
   <div class="gloss">${esc(w.en)}</div>
   <div class="hfrow" style="margin-top:15px">${shown.map(function(x){
     const cls=got&&x===tgt?" hit":(S.fmMiss===x?" miss":"");
     return `<button class="hfk word${cls}" data-fpick="${esc(x)}">${esc(x)}</button>`}).join("")}</div>
   ${got?`<p class="hfsay">\u2713 the -${esc(endOf(w.sg)[0])} ones take ${esc(tgt)}</p>
     <button class="wallbtn good" data-fgo>next \u203a</button>`:""}
   ${backStrip("fcheck",k,FQ.length)}
  </div>`,k,FQ.length,true);
}

function makeword(){
 if(S.mkPhase==="fteach") return fmTeach();
 if(S.mkPhase==="fcheck") return fmCheck();
 ACTS.makeword.say="Look at how many. Then choose the little word.";
 if(S.mkI>=MQ.length) return done("\ud83e\uddf1","Every word built");
 const q=MQ[S.mkI], w=W2[q.i], word=w[q.f], tgt=w.m[MIX[q.f]];
 const L=LITTLE.find(function(x){return x.f===q.f});
 const opts=[w.m[0],w.m[1],w.m[2],w.m[3]].filter(function(v,k,a){return a.indexOf(v)===k});
 const rot=S.mkI%opts.length, shown=opts.slice(rot).concat(opts.slice(0,rot));
 const got=S.mkPick===tgt;
 return wrap(`<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;min-height:64px">
    ${Array.from({length:L.n}).map(function(){
      return `<span class="obj" style="font-size:${L.z}px">${w.g}</span>`}).join("")}</div>
   <div class="wordbig" style="margin-top:4px"><span class="chipm ff${got?"":" blank"}">${got?esc(tgt):"?"}</span> ${esc(word)}</div>
   <div class="gloss">${esc(w.en)} \u00b7 ${esc(L.l)}</div>`,S.mkI,MQ.length)
 +`<div class="controls c2">${shown.map(function(o){
    return `<button class="ctl big ${got&&o===tgt?"right":(S.mkPick&&S.mkPick===o?"wrong":"")}"
     ${got?"disabled":""} data-mk="${esc(o)}">${esc(o)}</button>`}).join("")}</div>
  ${got?`<div class="faceline"><span class="f">\u2b50</span><p>The ones ending
     <b class="ff">-${esc(q.f==="sg"?endOf(w.sg)[0]:q.f==="de"?"el":q.f==="dp"?"oy":word.slice(-1))}</b>
     take <b class="ff">${esc(tgt)}</b>.</p></div>
   <button class="wallbtn" data-mknext>next \u203a</button>`:""}
  ${backStrip("mk",S.mkI,MQ.length)}`}

/* Every stage in this unit stepped forwards only, so a child who wanted the
   card before had to leave the town and come back in at the start. Same quiet
   strip the machine uses, so it reads as the one navigation idea rather than a
   new button. At the first card of a phase that follows another phase, back
   steps into the phase before it rather than dead-ending. */
/* ============ v192: the little word, doing its job ============
   Twelve of the fifty steps teach markers and not one of the course's sixteen
   sentences contained a single marker — they were taught and then never used.
   These six lines are attested Pular from Gimoy Boobo (Fanku boobowel, Boobo
   mbuleejo, Ngel Jiwel), not written for the course, and they are here because
   ngel is the ONLY marker in them: a child meets no marker they have not been
   taught, which is the rule this stop now runs to. The task is to point at the
   little word, so no translation is shown and none is needed — nothing on this
   card asks the child to know what the sentence means.
   Ordered by what makes ngel hard to find: sitting after the noun, then in
   front, then beside a word that ENDS in -ngel. That last one is the whole
   discrimination — the noun's ending is not the little word.
   PROVISIONAL: lines are the author's, taken as printed, and the selection
   still wants his sign-off. i is the index of the word to be found. */
const USESENT=[
 {s:"Si colel ngel yimataa",   i:2},
 {s:"Si cofel ngel siikataa",  i:2},
 {s:"Si baalel ngel aatataa",  i:2},
 {s:"Ngel aynoyaali \u00f1alel",   i:0},
 {s:"Jogiingel ngel cerel",    i:1},
 {s:"Ngel hoy\u0257a welngel",     i:0}];

const MCOL={ngal:["--amber","--amber-deep"], ngel:["--leaf","--leaf-deep"],
 koy:["--coral","--coral-deep"], "\u0257ee":["--plum","--plum-deep"],
 nduu:["--leaf","--leaf-deep"], ndee:["--coral","--coral-deep"],
 /* ɗee keeps plum because plum is its identity from the first screen at Tolo and
    for the rest of the course. ngol moved off plum and ɗii took a new colour so
    that no two markers standing side by side on the families screen wear the
    same one. */
 ngol:["--teal","--teal-deep"], mbaa:["--indigo","--indigo-deep"],
 "\u0257ii":["--berry","--berry-deep"]};
/* the four little words have their own recordings — audio/markers/ngal.mp3
   and the rest. ɗee is filed as dee, since a filename should be typeable. */
function mkclip(k){ return "markers/"+String(k).replace(/\u0257/g,"d")+".mp3" }
function mvars(k){const c=MCOL[k]||["--amber","--amber-deep"];
 return `--mk:var(${c[0]});--mk-deep:var(${c[1]});--mk-soft:color-mix(in srgb, var(${c[0]}) 22%, transparent)`;}
/* The rail is the navigation now: four buttons, tap any of them to go straight
   to that little word. Back and next were a long way from the thing they moved,
   so they are gone from these cards \u2014 what is left is one forward door, and it
   only opens once all four have been opened AND turned round. */
/* each little word carries the sound of a noun that takes it, so the rail is
   both the way around the card and the way to hear it again */
function mclip(k){
 const f=(typeof FAMS!=="undefined")?FAMS.filter(function(x){return x.k===k})[0]:null;
 return f?("words/w"+pad(f.lead,2)+"-sg.mp3"):"";
}
/* v234: each button carries its two places as pips, so the rail says what is
   left to do rather than only where you are. nudge lifts the unfinished ones
   once the card on screen is finished \u2014 the moment a child has no idea the
   job continues somewhere else. */
function mrail(set,cur,seen,known,both,nudge){
 return `<div class="mrail">${set.map(function(x){
  const kn=known&&known.indexOf(x)>=0;
  const fin=kn||!!(seen&&seen.has(x));
  const b=(both&&both[x])||{};
  const f=kn||!!b.front, h=kn||!!b.behind;
  let cls=x===cur?"on":(fin?"seen":"");
  if(nudge&&!fin&&x!==cur) cls+=" todo";
  return `<button style="${mvars(x)}" class="${cls}"${kn?" disabled"
    :` data-mgo="${esc(x)}"`}><span>${esc(x)}</span>
    <i class="mpip"><b class="${f?"lit":""}"></b><b class="${h?"lit":""}"></b></i></button>`
 }).join("")}</div>`;
}
/* front = the little word leads, behind = it follows. Both are how the book
   prints it, so the child needs to have seen each one, not read about them. */
/* A marker counts as met only once BOTH sides have been on screen \u2014 which is
   what opens the forward door. Arriving on a card marks the front; turning it
   marks the back. */
function seeSide(k,side){ if(!S.mSeen) S.mSeen=new Set();
 if(!S.mBoth) S.mBoth={}; const b=S.mBoth[k]||{};
 b[side]=true; S.mBoth[k]=b; if(b.front&&b.behind) S.mSeen.add(k); }
function allTurned(set){ return set.every(function(k){ return S.mSeen&&S.mSeen.has(k) }); }

/* The turn control was a badge in a corner and then a line of small text, and
   both were things to notice rather than things to press. It is now a proper
   round button standing beside the picture, big enough to look like the thing
   it is, with the arrow turning as it invites the press. The card still turns
   if the child taps it anywhere. */
/* ---- the little word has two places, and the child moves it there ----
   A round button labelled "turn it round" was a control ABOUT the card sitting
   beside the card, and it asked a child to press one thing in order to watch a
   different thing happen. What actually moves in Fulfulde is the little word
   itself, so that is now the thing you touch and the thing you aim at: the
   marker sits in one of two boxes either side of the noun, the other box is an
   empty socket waiting for it, and tapping the empty socket sends it across.
   The two boxes are labelled once and never move \u2014 THIS in front, THE behind \u2014
   so the meaning is carried by the position rather than by a sentence a
   six-year-old has to hold in their head while they press something. */
/* THIS in front is true of ngal and ngel and false of koy and ɗee, which are
   these and those and never this. The front label follows the marker. */
function frontLab(mark){ return (mark==="koy"||mark==="\u0257ee"||mark==="\u0257ii"
  ||mark==="\u0253ee")?"these":"this" }
function turnCard(k,mark,html,gloss,side,clip,guide,hint){
 /* guide 2 = both boxes empty, the front one asking; 3 = it is in front and
    the back one is asking; 4 or absent = both boxes live, the child decides */
 const g=(guide===undefined||guide===null)?4:guide;
 const chip=`<span class="chipm ff walked" style="--from:${side==="front"?"132px":"-132px"}">${esc(mark)}</span>`;
 const dock=function(pos,lab){
  const full=(side===pos);
  /* the button hands the handler the NEXT stage, and the stages gained one
     when the ending drill went in front of the boxes: 3 is the box in front,
     4 the box behind, 5 both boxes free. */
  const step=(g===2&&pos==="front")?3:((g===3&&pos==="behind")?4:null);
  const live=(g>=4)||step!==null;
  const attrs=step!==null?`data-mstep="${step}" data-dock="${pos}"`
    :(g>=4?`data-mflip data-dock="${pos}"`:"");
  const ask=(step!==null&&!full)||(g>=4&&!full&&pos!==(side||"front"));
  return `<button class="dock ${full?"full":"empty"}${live?"":" idle"}${ask?" asking":""}" ${attrs}
    ${live?"":"disabled"}
    aria-label="${full?"the little word is here":"put the little word here"}">
    ${full?chip:'<i class="slot"></i>'}<span class="dl">${lab}</span></button>`;
 };
 return `<div class="turnc arrived" style="${mvars(mark)}">
   ${(g===3||hint)?`<div class="arc${(g>=4&&side==="behind")?" back":""}" aria-hidden="true">
     <svg viewBox="0 0 300 46" preserveAspectRatio="none">
     <path d="M46 40 C 96 -6, 204 -6, 254 34"/>
     <polygon points="254,40 244,24 262,24"/></svg></div>`:""}
   <div class="phrase">${dock("front",frontLab(mark))}<button class="pword"${g>=4?" data-mflip":""}
     ${clip?`data-mclip="${esc(clip)}"`:""}>${html}</button>${dock("behind","the")}</div>
   ${gloss?`<div class="gloss">${esc(gloss)}</div>`:""}
   ${g===3?`<p class="sidecue">now send it round the back
     <small>tap the empty box behind the word</small></p>`:""}
  </div>`;
}

/* The way back was a word in a line, which read as another instruction to
   follow rather than the door behind you. It is now a round button in the
   bottom-left corner with the arrow the rest of the course uses for going
   back, and the count sits beside it as a label, not a companion button. */
/* The marker cards had no way back at all: a child who pressed on from the
   meeting could not return to it, and a grown-up could not show the ending
   again. This one steps back through the card's own stages first — free,
   behind, front, the six words, the picture, the meeting — and only then to
   the little word before it. */
/* what a decoy actually ends in, so the hint can name it */
function endTail(w,len){
 const n=(len||"").length||2;
 return w.slice(-n);
}
/* ---- one arrow forward, and it is the trio's ----
   The strip carried its own forward arrow, which SKIPPED stages, while the
   floating trio's arrow walked history. Two arrows on one screen doing two
   different things is a puzzle, not navigation. The strip is now a label and
   nothing more, and it only appears where there is more than one card to
   count. Skipping ahead lives in the grown-up drawer. */
function mbackStrip(k,total){
 if(!total||total<=1) return "";
 return `<div class="wmnav solo nb"><span class="pos">${k+1} of ${total}</span></div>`;
}
function mbackStripOld(k,total){
 const first=(k<=0)&&((S.mStep||0)<=0)&&!(S.mEi>0);
 /* the pair of arrows keeps the solo class as well, or it loses the styling
    that makes them round, pink and findable — which is how a screen ended up
    showing a bare "1 of 1" with no way back at all */
 /* the back arrow went to the floating trio, which does the same job on every
    screen of the course. The forward arrow stays because it is not the same
    job: it SKIPS to the next stage of the card, past screens the learner has
    not done, which is a grown-up's "show me" and not a step through history. */
 return `<div class="wmnav solo pair nb">
  <span class="pos">${k+1} of ${total}</span>
  <button class="fwd" data-mfwd aria-label="Skip ahead">${BACKSVG}</button></div>`;
}
/* ---- v218: the header already counts these ----
   "Step 19 of 51 · 5 of 6" is printed above every card, and this line under
   the card said 6 of 6 — the same number, a second time, with a rule above it
   and a row of its own. It moves into the corner of the card, small, so the
   space it was taking goes back to the activity and the way on comes up to sit
   under the last thing the child pressed. */
function backStrip(act,i,n){
 return `<div class="wmnav solo nb corner"><span class="pos">${i+1} of ${n}</span></div>`;
}

/* ---- first pass: meet the noun ----
   Singular only. The picture cannot carry the meaning on its own for a child
   who does not speak the language — there is no hyena emoji, and a slate is not
   an open book — so the English sits under the word and does the work. */
/* ---- how a thing arrives ----
   A hippo does not fade in. It walks on, and it walks on from the right,
   because that is the way the emoji faces — entering from the left would show
   an animal walking backwards. Owls and flies come in on a swoop, a leaf falls
   the way a leaf falls, and everything else parades in with a rock.
   The word waits: the picture has to finish arriving before it is named, so
   the child looks at the thing first and reads it second. */
const WALKERS="\ud83d\udc03\ud83d\udc3a\ud83e\udd8c\ud83d\udc18\ud83e\udecf\ud83e\udd9b\ud83e\udd92\ud83d\udc15\ud83e\uddab\ud83d\udc04\ud83d\udc17\ud83d\udc02";
const FLIERS="\ud83e\udeb0\ud83e\udd89\ud83d\udc26\ud83e\udd8b\ud83d\udc1d";
const FALLERS="\ud83c\udf41\ud83c\udf42\ud83c\udf43";
function entrance(g){
 return FALLERS.indexOf(g)>=0?"fall":FLIERS.indexOf(g)>=0?"fly"
  :WALKERS.indexOf(g)>=0?"walk":"parade";
}
const ENTER_MS={walk:1600,fly:1500,fall:1900,parade:1150};
/* the arrival happens once, when the card is arrived at — pressing listen
   again replays the sound, not the journey */
let ARRIVED=null;

function wmMeet(){
 const grp=WGROUPS[S.wmG], idx=grp[S.wmM], w=W2[idx], last=S.wmM>=grp.length-1;
 /* Each group of words is its own activity (wm0..wm5); writing the line onto
    the old single "wordmac" activity meant the card always showed that
    activity's default, so the find card was still telling a child to listen
    and say it back. */
 if(ACTS[S.act]) ACTS[S.act].say="Look, listen, and say it back.";
 const key="wm|"+idx, fresh=ARRIVED!==key;
 if(fresh) ARRIVED=key;
 const ent=entrance(w.g), ms=ENTER_MS[ent];
 const delay=function(extra){ return fresh?`animation-delay:${ms+extra}ms;`:"" };
 return wrap(`<div class="meet wmcard">
   ${""/* v200: the grown-up's line goes to the top, where it is read before
        the child looks at the picture rather than after they have finished
        with it \u2014 the same place it sits on every letter card. */}
   <p class="grownup">grown-up: say <b class="ff">${esc(w.sg)}</b></p>
   <div class="wmpic${fresh?" ent-"+ent:""}"><span>${w.g}</span></div>
   <div class="gloss aside${fresh?" reveal":""}" style="${delay(150)}">${esc(w.en)}</div>
   <div class="wordbig${fresh?" reveal":""}" style="margin-top:2px;${delay(0)}">${esc(w.sg)}</div>
   <button class="hearbtn big" style="margin-top:20px" data-clip="words/w${pad(idx,2)}-sg.mp3">
    <span class="bars"><i></i><i></i><i></i></span>listen</button>
   ${""/* No second sound button. The block above already is the sound, and a
        card that offers to play the same clip twice in two different shapes
        makes a child work out whether they are the same thing. One way to
        hear it, one way onward. */}
   ${""/* v170: one way on, one shape, one place. This was a full-width button
        filled in the Fouta colour, which put it under the floating trio and
        made it look like a fourth arrow. It is now the same pill the rest of
        the course uses, pushed to the right-hand edge, clear of them. */}
   <button class="wallbtn" data-wmnext>next \u203a</button>
   ${backStrip("meet",S.wmM,grp.length)}
  </div>`,S.wmM,grp.length,true);
}

/* ---- still the first pass: find it again ----
   Retrieval, not testing. A wrong tap shakes and clears and costs nothing;
   nothing here is scored and nothing is recorded. Watching a word five times
   is not the same as being able to fetch it once. */
/* Where the right answer sits. Any sum of the item number and the group number
   marches — add one to each and the position moves by the same amount every
   time, which is a pattern a child finds long before they finish the group. So
   the place comes from a hash of the word itself, and then one rule on top: it
   may not sit in the same place three times running. Fixed per item either
   way, so nothing moves while a child is looking at it. */
function wordHash(s){ let x=0; for(let i=0;i<s.length;i++) x=(x*31+s.charCodeAt(i))>>>0; return x }
function optPos(grp,g,j){
 let last=-1, run=0, p=0;
 for(let i=0;i<=j;i++){
  p=wordHash(W2[grp[i]].sg+"|"+g)%3;
  if(p===last&&run>=2) p=(p+1)%3;
  if(p===last) run++; else { last=p; run=1; }
 }
 return p;
}

/* ---- found in a different order than met ----
   Meeting six words and then finding the same six in the same order tests the
   last ten seconds. The find order is a fixed shuffle of the group, so the
   first word asked for is one the child met several cards ago. Fixed, so
   nothing moves under them; different, so it is retrieval rather than echo. */
function findOrder(g,gi){
 const out=g.slice(), n=out.length;
 for(let i=n-1;i>0;i--){
  const j=wordHash("find|"+gi+"|"+i)%(i+1), t=out[i]; out[i]=out[j]; out[j]=t;
 }
 /* never leave the first one asked for as the one just met */
 if(out[0]===g[n-1]&&n>1){ const t=out[0]; out[0]=out[n-1]; out[n-1]=t }
 return out;
}
function wmFind(){
 const grp=findOrder(WGROUPS[S.wmG],S.wmG), idx=grp[S.wmI], w=W2[idx], got=S.wmPick===idx;
 /* ---- distractors that cost something to tell apart ----
    The two wrong words used to be whichever came next in the group, and the
    right one moved one place along each time, so a child could get most of
    these without reading: pick the odd length, or follow the pattern. The
    wrong words are now the ones closest in length to the right one, so the
    shape of the word gives nothing away and the first letters have to be
    read; and the right one's place is scattered rather than marching. Both
    are still fixed per item, so nothing reshuffles under a child's finger. */
 const tlen=W2[idx].sg.length;
 const ranked=grp.filter(function(i){return i!==idx}).map(function(i){
   return {i:i, d:Math.abs(W2[i].sg.length-tlen), h:(i*13+S.wmI*7)%97};
  }).sort(function(a,b){ return a.d-b.d || a.h-b.h });
 const trio=[idx].concat(ranked.slice(0,2).map(function(x){return x.i}));
 const rot=optPos(grp,S.wmG,S.wmI)%trio.length;
 const opts=trio.slice(rot).concat(trio.slice(0,rot));
 if(ACTS[S.act]) ACTS[S.act].say="Which word is this one? Tap the picture to hear it again.";
 /* the thing arrives here too — the picture is the question, so it walks on
    before the words it has to be matched to */
