.arrive .factbox p{margin:0 0 8px;font-size:13px;line-height:1.6}
.arrive .factbox .q{background:rgba(255,255,255,.16);border-radius:12px;padding:9px 11px;
  font-family:'FulSerif',serif;font-size:14px}


/* ================= the traveller ================= */
.node .me{overflow:visible;cursor:pointer}
.node .me img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.node .me .edit{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;
  background:var(--amber);color:#3B2606;font-size:11px;display:grid;place-items:center;
  box-shadow:0 1px 0 rgba(0,0,0,.2)}
.avapick{padding:6px 4px 0;text-align:center}
.avapick .cur{width:120px;height:120px;border-radius:50%;margin:8px auto 4px;background:#fff;
  border:6px solid var(--amber);display:grid;place-items:center;font-size:60px;overflow:hidden;
  box-shadow:0 5px 0 rgba(0,0,0,.14)}
.avapick .cur img{width:100%;height:100%;object-fit:cover;display:block}
.avapick h2{font-family:'FulSans',sans-serif;font-size:23px;color:var(--indigo);margin:12px 0 3px}
.avapick p{color:var(--muted);font-size:13px;margin:0 0 16px}
.avagrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}
.avaopt{min-height:64px;background:#fff;border:2px solid var(--line);
  border-bottom:4px solid rgba(27,46,107,.16);border-radius:18px;font-size:29px;cursor:pointer;
  font-family:inherit}
.avaopt:active{transform:translateY(2px);border-bottom-width:2px}
.avaopt.on{background:var(--amber);border-color:var(--amber-deep)}
.photobtn{width:100%;min-height:var(--tap);background:var(--indigo);color:#fff;border:none;
  border-bottom:5px solid var(--indigo-deep);border-radius:18px;font-family:'FulSans',sans-serif;
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.photobtn:active{transform:translateY(3px);border-bottom-width:2px}
.arrive .stamp .trav{position:absolute;bottom:-6px;right:-6px;width:44px;height:44px;border-radius:50%;
  background:#fff;border:3px solid var(--amber);display:grid;place-items:center;font-size:22px;overflow:hidden}
.arrive .stamp .trav img{width:100%;height:100%;object-fit:cover;display:block}
.arrive .stamp{position:relative}
.gobtn .gi img{width:100%;height:100%;border-radius:12px;object-fit:cover;display:block}


/* ================= ONE WORLD AT A TIME ================= */
.worldtop{height:146px}
.worldtop .sunny{position:absolute;left:22px;top:16px;width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle,#FFF6D0 30%,#FFD657 70%,#F7B733);z-index:7;
  box-shadow:0 0 0 14px rgba(255,214,90,.20),0 0 0 28px rgba(255,214,90,.09)}
.worldtop .wt{left:92px;top:22px;font-size:23px;z-index:8;max-width:56%}
.worldtop .wt small{font-size:11px;margin-top:3px}
.worldtop .sndbtn{right:12px;top:12px;width:40px;height:40px;font-size:17px;border-radius:13px}
/* the field is always green, in every Fouta */
.worldtop .ground{background:#6FB265!important;bottom:-28px;height:58px;z-index:5}
.worldtop .ground2{background:#5DA155!important;bottom:-40px;height:54px;z-index:4}

/* world strip: where you are among the four */
.wstrip{display:flex;gap:8px;padding:12px 12px 4px}
.wchip{flex:1;min-height:52px;border:2px solid rgba(27,46,107,.14);border-radius:16px;
  background:rgba(255,255,255,.85);cursor:pointer;font-family:'FulSans',sans-serif;font-size:11px;
  color:#3b4256;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:5px 2px}
.wchip .wi{font-size:17px;line-height:1}
.wchip.on{background:var(--wc);color:#fff;border-color:rgba(0,0,0,.14);box-shadow:0 3px 0 rgba(0,0,0,.14)}
.wchip.locked{opacity:.45}
.wchip.doneW .wi::after{content:"\2713";font-size:10px;margin-left:2px}

/* region card with tappable words */
.rcard{margin:10px 12px 2px}
.rcard .motifs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:11px}
.rcard .motif{background:#F5F0E2;border:2px solid transparent;border-radius:14px;padding:8px 2px;
  text-align:center;cursor:pointer;font-family:inherit;min-height:60px}
.rcard .motif:active{transform:translateY(2px)}
.rcard .motif.on{background:#FFF3D8;border-color:var(--amber)}
.rcard .motif .mi{font-size:21px;display:block}
.rcard .motif .ml{font-family:'FulSerif',serif;font-size:11px;color:#3b4256;display:block;margin-top:2px}
.rcard .learnline{background:#F5F0E2;border-radius:12px;padding:10px 12px;margin-top:11px;font-size:12.5px;line-height:1.5;color:#4a5064}
.rcard .learnline b{font-family:'FulSans',sans-serif;font-size:12px;color:#16203a;display:block;margin-bottom:3px}
.rcard .gloss{margin-top:9px;background:#F5F0E2;border-radius:12px;padding:8px 11px;
  font-size:12px;color:#3b4256;min-height:34px;display:flex;align-items:center;gap:8px}
.rcard .gloss b{font-family:'FulSerif',serif;font-size:14px}
.rcard .hintline{font-size:11px;color:#8b90a2;margin-top:7px;text-align:center}

/* compact path inside one world */
.trail{padding:0 0 152px}
.band{padding:0 4px 6px}
.noderow{padding:0}
.noderow.l{padding-left:26px}.noderow.r{padding-right:26px}
.hop{padding:1px 0}
.node{width:112px;gap:4px}
.node .disc{width:72px;height:72px;font-size:30px;border-width:4px}
.node.now .disc{width:84px;height:84px;font-size:35px}
.node.later .disc{width:64px;height:64px;font-size:26px}
.node .cap{font-size:12.5px}

/* the door to the next Fouta */
.doorwrap{position:fixed;left:0;right:0;bottom:78px;z-index:52;padding:0 12px;pointer-events:none}
.door{pointer-events:auto;width:100%;min-height:64px;border:none;border-radius:20px;cursor:pointer;
  display:flex;align-items:center;gap:12px;padding:10px 14px;font-family:inherit;
  box-shadow:0 5px 0 rgba(0,0,0,.22),0 8px 20px rgba(0,0,0,.16)}
.door .di{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.door .dt{flex:1;text-align:left;line-height:1.15}
.door .dt b{font-family:'FulSans',sans-serif;font-size:16px;display:block}
.door .dt small{font-size:11px;opacity:.85;display:block;margin-top:2px}
.door.open{background:var(--wc);color:#fff}
.door.open .di{background:rgba(255,255,255,.22)}
.door.shut{background:#fff;color:#6C7186;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.door.shut .di{background:#F0EADA}
.door .da{font-size:24px;opacity:.9}
.gobar{display:none!important}


/* ================= THE ROAD ================= */
.band>.road{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;pointer-events:none}
.road .rd{fill:none;stroke:#DCCBA4;stroke-width:26;stroke-linecap:round;stroke-linejoin:round}
.road .rdb{fill:none;stroke:rgba(120,96,52,.22);stroke-width:30;stroke-linecap:round;stroke-linejoin:round}
.road .rdl{fill:none;stroke:rgba(255,255,255,.9);stroke-width:3;stroke-dasharray:11 15;stroke-linecap:round}
.hop{display:none}

/* waypoints sitting on the road */
.pinrow{display:flex;padding:2px 0}
.pinrow.l{justify-content:flex-start;padding-left:44px}
.pinrow.r{justify-content:flex-end;padding-right:44px}
.pinrow.m{justify-content:center}
.pin{background:none;border:none;padding:0;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:4px;width:104px}
.pin .pd{width:50px;height:50px;border-radius:16px;background:#fff;border:3px solid #C9B486;
  display:grid;place-items:center;font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.12);
  transform:rotate(-6deg)}
.pin.seen .pd{background:#EFE7D3;border-color:#B8A272}
.pin .pc{font-family:'FulSans',sans-serif;font-size:11.5px;color:#4a4231;
  background:rgba(255,255,255,.86);padding:1px 8px;border-radius:999px}
.pin:active .pd{transform:rotate(-6deg) translateY(2px)}

/* the waypoint screen */
.way{padding:14px 6px 0}
.way .wtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.way .wicon{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:27px;
  color:#fff;flex:0 0 auto}
.way .wttl{flex:1}
.way .wttl em{font-style:normal;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:3px}
.way .wttl b{font-family:'FulSans',sans-serif;font-size:20px;color:var(--indigo);line-height:1.15}
.way .beat{background:#fff;border:2px solid var(--line);border-radius:20px;padding:15px 16px;margin-bottom:10px}
.way .beat .ful{font-family:'FulSerif',serif;font-size:16px;color:var(--indigo);line-height:1.5}
.way .beat .eng{font-size:13px;color:#4a5064;line-height:1.6;margin-top:8px}
.way .beat.plain .eng{margin-top:0}
.way .said{background:var(--amber);color:#3B2606;border-radius:20px;padding:14px 16px;margin-bottom:10px}
.way .said .ful{font-family:'FulSerif',serif;font-size:17px;line-height:1.5}
.way .said .who{font-size:11.5px;opacity:.8;margin-top:7px}


/* ================= DASHBOARD: the road through the Foutas (v22) =================
   v21 discipline: white, type-led, no card borders or shadows, colour only
   where it carries meaning (the emblem ring, the stars, the call to action). */
.dash{background:#fff;padding:14px 0 34px}
.dhead2{display:flex;align-items:center;gap:12px;margin:0 16px 14px}
.dhead2 .me{width:50px;height:50px;border-radius:50%;background:#fff;border:3px solid var(--amber-deep);
  display:grid;place-items:center;font-size:25px;overflow:hidden;flex:0 0 auto;cursor:pointer}
.dhead2 .me img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.dhead2 .dt b{font-family:'FulSans',sans-serif;font-size:20px;color:#16203a;display:block;line-height:1.1}
.dhead2 .dt small{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
.dbar2{height:6px;border-radius:4px;background:#F0EDE4;overflow:hidden;margin:0 16px 6px;display:flex}
.dbar2 i{display:block;height:100%}
.dnote{margin:0 16px 18px;font-size:11.5px;color:#B8B2A5;font-weight:700;letter-spacing:.02em}

.droad{position:relative}
.droad .rl{position:absolute;left:57px;top:18px;bottom:34px;width:4px;border-radius:3px;
  background:repeating-linear-gradient(180deg,#E4DFD1 0 8px,transparent 8px 18px)}
.droad .rl em{position:absolute;left:0;top:0;width:4px;border-radius:3px;background:#CFC5AA}

.fcard{display:flex;align-items:flex-start;gap:12px;width:calc(100% - 32px);margin:0 16px 6px;
  padding:10px 0;background:none;border:0;border-radius:0;text-align:left;font-family:inherit;
  color:inherit;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
.fcard:active{transform:scale(.985);opacity:.72}
.fcard .disc{width:56px;height:56px;border-radius:50%;background:#fff;border:3px solid var(--fc);
  display:grid;place-items:center;font-size:25px;flex:0 0 auto;position:relative;z-index:2}
.fcard.here .disc{box-shadow:0 0 0 5px rgba(242,174,63,.28)}
.fcard .fbody{flex:1;min-width:0}
.fcard .nm{font-family:'FulSans',sans-serif;font-size:18px;color:#16203a;display:block;line-height:1.15;margin-top:5px}
.fcard .lrn{font-size:13px;color:var(--muted);display:block;margin-top:2px}
.fcard .pips{display:flex;gap:4px;margin-top:10px;max-width:180px}
.fcard .pips b{display:block;height:5px;flex:1;border-radius:3px;background:#EFECE3}
.fcard .pips b.on{background:var(--fc)}
.fcard .stat{display:block;margin-top:9px;font-size:12px;font-weight:700;color:var(--fc);letter-spacing:1px}
.fcard .cta{display:block;margin-top:9px;font-size:12.5px;font-weight:800;color:var(--amber-deep);letter-spacing:.01em}
.fcard.locked{opacity:1}
.fcard.locked .disc{border-style:dashed;border-color:#B8B2A5;background:#fff}
.fcard.locked .nm,.fcard.locked .lrn,.fcard.locked .stat{color:#B8B2A5}
.fcard.locked .pips b.on{background:#B8B2A5}
.fcard.locked .cta{color:#B8B2A5;font-weight:700}

/* world chips: dashed when open-but-not-here */
.wstrip{padding:10px 10px 4px}
.wchip{border:2px dashed rgba(27,46,107,.28);background:#FCFAF3}
.wchip.on{border-style:solid}
.wchip.locked{border-style:dotted;background:rgba(255,255,255,.5)}
.sndchip{display:none}
.homechip{flex:0 0 44px;min-height:52px;border:2px solid rgba(27,46,107,.14);border-radius:16px;
  background:#fff;font-size:17px;cursor:pointer;font-family:inherit}
.homechip:active{transform:scale(.94)}

/* sound lives with the grown-ups now */
.sndrow{display:flex;align-items:center;gap:10px;background:#F5F0E2;border-radius:14px;
  padding:10px 12px;margin-bottom:12px}
.sndrow b{flex:1;font-size:13px}
.howto{display:block;width:100%;text-align:left;border:none;cursor:pointer;
  background:var(--unit-bg,#E7E5F7);border-radius:16px;padding:12px 14px;margin:0 0 14px;
  font-family:'FulSans',sans-serif;color:var(--ink)}
.howto:active{filter:brightness(.96)}
.howto .hh{display:block;font-size:11px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--unit,#3B4270)}
.howto .hh em{display:block;font-style:normal;font-weight:600;letter-spacing:.02em;
  text-transform:none;font-size:11.5px;color:#6C7186;margin-top:2px}
.howto .hx{display:block;font-size:15px;line-height:1.4;margin:7px 0 0;color:var(--ink)}
.howto .hp{display:flex;align-items:center;gap:6px;margin-top:9px;
  font-size:11.5px;font-weight:700;color:var(--unit,#3B4270)}
.howto .hp svg{width:15px;height:15px}
.howto .hp i{font-style:normal}
.dctl{padding-top:2px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:4px}
.dctl .sndrow:last-child{margin-bottom:10px}
.sndrow button{min-height:40px;padding:0 14px;border-radius:12px;border:2px solid var(--line);
  background:#fff;font-family:'FulSans',sans-serif;font-size:13px;cursor:pointer;color:var(--indigo)}


/* ================= SENTENCES ================= */
.sentline{font-family:'FulSerif',serif;font-size:22px;color:var(--unit);line-height:1.6;
  text-align:center;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;
  min-height:56px}
.sentline.big{font-size:24px;display:block}
.sentline .sw{background:#fff;border:2px solid var(--line);border-radius:11px;padding:3px 10px;
  cursor:pointer;font-weight:600}
.sentline .sw.bad{background:#F8E6E1;border-color:var(--coral)}
.sentline .sw.stop{background:var(--leaf);color:#fff;border-color:var(--leaf-deep);padding:3px 12px}
.sentline .miss{color:var(--coral);font-weight:700;margin-left:2px}
.wordpool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.pw{min-height:52px;background:#fff;border:2px solid var(--line);border-bottom:4px solid rgba(27,46,107,.18);
  border-radius:14px;padding:0 14px;font-family:'FulSerif',serif;font-size:18px;color:var(--ink);
  cursor:pointer;font-weight:600}
.pw:active{transform:translateY(2px);border-bottom-width:2px}
.pw.used{opacity:.3}
.gloss2{margin-top:12px;background:rgba(255,255,255,.9);border-radius:14px;padding:10px 13px;
  font-size:13px;color:#4a5064;line-height:1.5;max-width:320px}
.wcount{margin-top:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ---------- journey spine ---------- */
.carry{display:flex;align-items:center;gap:13px;width:100%;background:var(--unit);color:#FBF5E7;
  border:none;border-bottom:5px solid rgba(0,0,0,.28);border-radius:22px;padding:15px 16px;
  cursor:pointer;font-family:inherit;text-align:left;min-height:86px;margin-bottom:18px}
.carry:active{transform:translateY(3px);border-bottom-width:2px}
.carry .bub{width:56px;height:56px;border-radius:18px;background:rgba(251,245,231,.18);
  display:grid;place-items:center;font-size:27px;flex:0 0 auto}
.carry .cx{flex:1;min-width:0}
.carry .cx em{font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  opacity:.7;display:block;margin-bottom:3px}
.carry .cx b{font-family:'FulSans',sans-serif;font-size:19px;display:block;line-height:1.15}
.carry .cx small{font-size:11.5px;opacity:.72;display:block;margin-top:2px}
.carry .arrow{font-size:26px;opacity:.85}

.stop{margin-bottom:12px}
.stophead{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
  padding:8px 2px;cursor:pointer;font-family:inherit;text-align:left;min-height:48px}
.stophead .dotn{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
  font-family:'FulSans',sans-serif;font-size:14px;color:#fff;flex:0 0 auto}
.stophead b{flex:1;font-family:'FulSans',sans-serif;font-size:15px;color:var(--ink)}
.stophead .cnt{font-size:11.5px;color:var(--muted);font-weight:700}
.stophead .chev{color:var(--muted);font-size:15px}
.steps{display:flex;flex-direction:column;gap:7px;padding-left:14px;margin-top:2px;
  border-left:3px solid rgba(27,46,107,.1);margin-left:14px}
.step{display:flex;align-items:center;gap:11px;background:#fff;border:2px solid var(--line);
  border-radius:15px;padding:10px 12px;cursor:pointer;font-family:inherit;text-align:left;
  min-height:58px;width:100%}
.step:active{transform:translateY(2px)}
.step .em{font-size:21px;width:28px;text-align:center;flex:0 0 auto}
.step .sx{flex:1;min-width:0}
.step .sx b{font-family:'FulSans',sans-serif;font-size:14.5px;display:block;color:var(--ink)}
.step .sx small{font-size:10.5px;color:var(--muted)}
.step .mark{font-size:17px;flex:0 0 auto;width:26px;text-align:center}
.step.done{background:#F1F7F2;border-color:rgba(79,157,105,.4)}
.step.done .mark{color:var(--leaf)}
.step.now{border-color:var(--amber);box-shadow:0 0 0 4px rgba(242,174,63,.18)}
.step.later{opacity:.5}

/* detour — a suggestion, never a wall */
.detour{text-align:center;padding:20px 4px 0}
.detour .big{font-size:56px;animation:drop .5s both}
.detour h2{font-family:'FulSans',sans-serif;font-size:22px;color:var(--indigo);margin:12px 0 6px;line-height:1.25}
.detour p{color:var(--muted);font-size:13.5px;margin:0 0 18px;line-height:1.5}
.detour .pair{display:flex;flex-direction:column;gap:9px;text-align:left}
.suggest{display:flex;align-items:center;gap:13px;width:100%;background:var(--unit);color:#FBF5E7;
  border:none;border-bottom:5px solid rgba(0,0,0,.28);border-radius:20px;padding:14px;
  cursor:pointer;font-family:inherit;min-height:80px}
.suggest:active{transform:translateY(3px);border-bottom-width:2px}
.suggest .bub{width:52px;height:52px;border-radius:17px;background:rgba(251,245,231,.18);
  display:grid;place-items:center;font-size:25px;flex:0 0 auto}
.suggest .nx{flex:1;text-align:left}
.suggest .nx em{font-style:normal;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  opacity:.75;display:block;margin-bottom:3px}
.suggest .nx b{font-family:'FulSans',sans-serif;font-size:17px;display:block}
.suggest .nx small{font-size:11px;opacity:.75}
.anyway{width:100%;min-height:var(--tap);background:#fff;border:2px solid var(--line);
  border-bottom:4px solid rgba(27,46,107,.18);border-radius:18px;font-family:'FulSans',sans-serif;
  font-size:15px;color:var(--unit);cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:9px}
.anyway:active{transform:translateY(2px);border-bottom-width:2px}
.step .mark.hint{color:var(--amber-deep);font-size:14px}

/* handoff */
.hand{text-align:center;padding:22px 6px 0}
.hand .big{font-size:58px;animation:drop .5s both}
.hand h2{font-family:'FulSans',sans-serif;font-size:24px;color:var(--indigo);margin:12px 0 4px}
.hand p{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.jbar{display:flex;gap:3px;margin:0 0 20px;padding:0 4px}
.jbar i{flex:1;height:7px;border-radius:4px;background:rgba(27,46,107,.14)}
.jbar i.done{background:var(--leaf)}
.jbar i.now{background:var(--amber)}
.nextcard{display:flex;align-items:center;gap:13px;width:100%;background:#fff;border:2px solid var(--line);
  border-radius:20px;padding:14px;margin-bottom:10px;
  cursor:pointer;font-family:inherit;text-align:left;min-height:80px}
.nextcard:active{background:var(--tint,#f6f7fb)}
.nextcard .bub{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;
  font-size:25px;color:#fff;flex:0 0 auto}
.nextcard .nx{flex:1}
.nextcard .nx em{font-style:normal;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:3px}
.nextcard .nx b{font-family:'FulSans',sans-serif;font-size:17px;display:block;color:var(--ink)}
.nextcard .nx small{font-size:11px;color:var(--muted)}
.stopnow{width:100%;min-height:var(--tap);background:none;border:2px solid var(--line);
  border-radius:17px;font-family:'FulSans',sans-serif;font-size:14px;color:var(--muted);cursor:pointer}
.milestone{background:linear-gradient(135deg,var(--unit),rgba(0,0,0,.18));color:#FBF5E7;
  border-radius:20px;padding:16px;margin-bottom:16px;text-align:center}
.milestone b{font-family:'FulSans',sans-serif;font-size:18px;display:block;margin-bottom:4px}
.milestone span{font-size:12.5px;opacity:.82}


/* ==========================================================================
   THE SHARED SYSTEM  ·  v39
   One layer, deliberately last, so it wins over everything the prototype
   grew before it. Notice Me's rules, applied here:

     · the page is a pale cool near-white; content is white cards on it
     · colour identifies a place — a tint behind an emoji, a pale pill
       behind a value — and never fills a screen
     · depth is one soft shadow, never a drawn edge or a pressed rail
     · one sans, two weights; the serif is reserved for Fulfulde letterforms
     · every page: mark, title, one grey line saying what it is for
   ========================================================================== */
:root{
  --paper:#F1F2F9;          /* page */
  --surface:#FFFFFF;        /* cards */
  --sunk:#F3F5FA;           /* tiles inside a card */
  --sunk-press:#E6E9F3;
  --ink:#181A24;
  --muted:#6C7186;
  --line:#E8EAF2;
  --unit:#33307F;
  --unit-bg:#E7E5F7;
  --r-card:20px;            /* card    */
  --r-tile:14px;            /* tile    */
  --r-pill:999px;
  --shadow:0 1px 3px rgba(16,28,69,.06),0 8px 24px rgba(16,28,69,.05);
  --tap:60px;
  /* legacy names, remapped so nothing left behind can reintroduce the cream */
  --ivory:#F1F2F9;--ivory-warm:#F3F5FA;--indigo:#33307F;--indigo-deep:#26246B;
  --amber:#F0B54A;--amber-deep:#8A5A12;--leaf:#4F9D69;--leaf-deep:#2F6B45;
  --coral:#E4694A;--coral-deep:#B8503A;--plum:#7A4A86;--plum-deep:#5C3566;
  --teal:#2E8B87;--teal-deep:#1F6B67;--berry:#B2396B;--berry-deep:#8A2751;
  --berry:#B8365A;
  /* The ending is not the little word and should not borrow its colour, so it
     has one of its own, the same on all four cards. But a solid block of it
     was too heavy for a word inside a sentence, and it collided with the tick
     in the corner of a tile. It is an underline now: the mark sits under the
     letters where it cannot fight anything, and it reads as what it is — the
     evidence for the tick rather than a second decoration competing with it. */
  --end-ink:#343A86;--end-line:#7C84E0;--end-bg:#E7E9FA;
}
body{background:#E4E6F0}
#phone{background:var(--paper);box-shadow:0 0 40px rgba(16,28,69,.14)}
#phone.athome{background:var(--paper)}
.flag{background:var(--paper);color:#A9AEC2;font-size:9.5px;border-bottom:1px solid var(--line)}

/* ---- no pressed edges anywhere. Feedback is a scale, not a rail. ---- */
.ctl,.stone,.gcard,.key,.pw,.avaopt,.nextcard,.anyway,.suggest,.carry,.hearbtn,
.chipm,.sayit .ear,.photobtn,.door,.gobtn,.node .disc,.rcard,.fact,.arrive .stamp,
.avapick .cur,.pin .pd,.landmark,.wchip.on{box-shadow:none!important;border-bottom-width:0!important}
.ctl,.stone,.gcard,.key,.pw,.avaopt,.nextcard,.anyway,.step,.faceline,.ndial,.way .beat{
  border:1px solid var(--line)!important;background:var(--surface);border-radius:var(--r-card)}
.ctl:active,.stone:active,.gcard:active,.key:active,.pw:active,.avaopt:active,
.nextcard:active,.anyway:active,.suggest:active,.carry:active,.hearbtn:active,
.photobtn:active,.door:active,.step:active{transform:scale(.97)!important}
.ctl,.key,.pw,.anyway,.avaopt{box-shadow:var(--shadow)!important}

/* ---- the header on an activity: light, with the unit's tint ---- */
.topbar{background:var(--paper)!important;padding:10px 12px 6px;gap:10px}
.tbtn{background:var(--surface);color:var(--unit);border:1px solid var(--line);
  border-radius:var(--r-tile);font-size:19px;box-shadow:var(--shadow)}
.tname{color:var(--ink);font-weight:700;font-size:15px}
.tname small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:1px}
.prog{background:var(--paper)!important;padding:2px 14px 10px;height:auto;display:block}
.prog .track{height:6px;border-radius:4px;background:#E4E7F2;overflow:hidden}
.prog .track em{display:block;height:100%;border-radius:4px;background:var(--unit);
  transition:width .45s cubic-bezier(.2,.9,.3,1)}
.prog .cnt{display:block;text-align:center;font-size:11px;color:var(--muted);margin-top:5px}

/* v173: the strip is 54px tall and sits 52px up, so the old 140 left the
   last thing on a long card - usually the way on - sitting under it with
   nowhere left to scroll. */
main{padding:12px 14px calc(114px + env(safe-area-inset-bottom))}

/* ---- page header: mark, title, one grey line ---- */
.phead{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.pmark{width:52px;height:52px;border-radius:16px;background:var(--unit-bg);display:grid;
  place-items:center;font-size:26px;flex:0 0 auto}
.ptitle{flex:1;min-width:0}
.ptitle b{display:block;font-size:21px;line-height:1.1;color:var(--unit);font-weight:700}
.ptitle small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.pbar{height:6px;border-radius:4px;background:#E4E7F2;overflow:hidden;margin:0 0 6px}
.pbar em{display:block;height:100%;border-radius:4px;background:var(--unit);transition:width .45s ease}
.pnote{font-size:12px;color:var(--muted);margin:0 0 16px}

/* ---- section header: emoji, label, a rule to the margin ---- */
.shead{display:flex;align-items:center;gap:9px;margin:18px 0 10px;font-size:14px;font-weight:700;color:var(--ink)}
.shead::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---- the closing instruction line every Notice Me screen ends on ---- */
/* ================= THE ROAD, REBUILT =================
   v39 turned this screen into a grid, and a grid is a menu. A child of six
   reads a journey off an ordered line they can see themselves standing on.
   This keeps the shared system — white cards, one soft shadow, tint not fill —
   and gets the road back as a rail behind the cards. */
.path{position:relative;padding-left:26px}
.path::before{content:"";position:absolute;left:9px;top:16px;bottom:16px;width:4px;
  border-radius:3px;background:repeating-linear-gradient(180deg,var(--line) 0 7px,transparent 7px 15px)}
.stepcard,.stopcard{position:relative;display:flex;align-items:center;gap:12px;width:100%;
  margin:0 0 10px;cursor:pointer;font-family:inherit;text-align:left;min-height:var(--tap)}
.stepcard{background:var(--surface);border:none;border-radius:var(--r-card);
  box-shadow:var(--shadow);padding:12px}
.stepcard:active,.stopcard:active{transform:scale(.98)}
/* the bead on the rail, so the card sits on the road rather than beside it */
.stepcard::before,.stopcard::before{content:"";position:absolute;left:-21px;top:50%;
  margin-top:-5px;width:10px;height:10px;border-radius:50%;background:#D9DDEA}
.stepcard.done::before{background:var(--unit)}
.stepcard.now::before{background:var(--unit);box-shadow:0 0 0 4px var(--unit-bg)}
.stepcard .sdisc{width:50px;height:50px;border-radius:50%;background:var(--unit-bg);
  display:grid;place-items:center;font-size:24px;flex:0 0 auto;position:relative}
.stepcard .sdisc .tickb{position:absolute;right:-3px;bottom:-3px;width:22px;height:22px;
  border-radius:50%;background:#DCEBE1;color:#2F6B45;display:grid;place-items:center;
  font-size:12px;font-style:normal;border:2px solid var(--surface)}
.stepcard .sbody{flex:1;min-width:0}
.stepcard .snum{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:2px}
.stepcard b{display:block;font-size:16px;color:var(--ink);line-height:1.15}
.stepcard .pill{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;
  border-radius:var(--r-pill);padding:3px 10px;background:var(--sunk);color:var(--muted)}
.stepcard.done .pill{background:#DCEBE1;color:#2F6B45}
.stepcard.now{box-shadow:0 0 0 2px var(--unit),var(--shadow)}
.stepcard.now .pill{background:var(--unit-bg);color:var(--unit)}
.stepcard .sa,.stopcard .sa{color:var(--muted);font-size:20px;flex:0 0 auto}
/* the child stands on the step they have reached — this is their presence here,
   not a settings avatar, so it is big enough to be a face */
.stepcard .youare{width:46px;height:46px;border-radius:50%;background:var(--surface);
  border:3px solid var(--unit);display:grid;place-items:center;font-size:23px;
  flex:0 0 auto;overflow:hidden}
.stepcard .youare img{width:100%;height:100%;object-fit:cover;border-radius:50%}
/* a saying or a tale is a rest, not a task: dashed, quieter, smaller mark */
.stopcard{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-card);
  padding:11px 12px;min-height:56px}
.stopcard .sm{width:40px;height:40px;border-radius:var(--r-tile);background:var(--sunk);
  display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.stopcard .sx{flex:1;min-width:0}
.stopcard .sx b{display:block;font-size:13.5px;color:var(--ink)}
.stopcard .sx small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.stopcard.seen .sm{background:#DCEBE1}

/* the five Foutas: a strip that scrolls rather than five squeezed labels */
/* a scroll container inside a column flexbox can shrink to nothing, so the
   strip states its own size rather than letting the page squeeze it away */
.wstrip{display:flex;flex:0 0 auto;gap:7px;padding:8px 0 4px;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.wstrip::-webkit-scrollbar{display:none}
.wchip{flex:0 0 auto;min-width:78px;padding:6px 10px}
.wchip .wn{display:block;font-size:11px;line-height:1.15;white-space:nowrap}
.wchip.walked .wi::after{content:"\2713";font-size:10px;margin-left:3px;color:#2F6B45}

.backlink{border:none;background:none;padding:6px 2px;margin:0 0 2px;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:700;color:var(--unit);min-height:44px;
  display:flex;align-items:center}
.backlink:active{opacity:.6}
.phead .homechip{border-radius:50%;overflow:hidden;padding:0;display:grid;place-items:center;font-size:22px}
.phead .homechip img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.footnote{font-size:12px;color:var(--muted);text-align:center;line-height:1.5;margin:18px 4px 0}

/* ---- cards and tiles ---- */
.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);padding:14px}
.tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:none;border-radius:var(--r-card);box-shadow:var(--shadow);
  padding:14px 10px;cursor:pointer;font-family:inherit;text-align:center;min-height:118px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.tile:active{transform:scale(.97)}
.tile .tm{width:48px;height:48px;border-radius:50%;background:var(--unit-bg);display:grid;
  place-items:center;font-size:24px;flex:0 0 auto}
.tile b{font-size:13.5px;line-height:1.2;color:var(--ink);font-weight:700}
.tile .pill{font-size:11px;font-weight:700;border-radius:var(--r-pill);padding:3px 10px;
  background:var(--sunk);color:var(--muted)}
.tile.done .pill{background:#DCEBE1;color:#2F6B45}
.tile.now{box-shadow:0 0 0 2px var(--unit),var(--shadow)}
.tile.now .pill{background:var(--unit-bg);color:var(--unit)}
.tile.later{opacity:.55}

/* a stop on the road reads as a quiet aside, not another activity */
.waycard{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);
  border:1px dashed var(--line);border-radius:var(--r-card);padding:12px 14px;margin:10px 0;
  cursor:pointer;font-family:inherit;text-align:left;min-height:var(--tap)}
.waycard:active{transform:scale(.98)}
.waycard .wm{width:42px;height:42px;border-radius:var(--r-tile);background:var(--sunk);
  display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.waycard .wx{flex:1;min-width:0}
.waycard .wx b{display:block;font-size:13.5px;color:var(--ink)}
.waycard .wx small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.waycard.seen .wm{background:#DCEBE1}
.waycard .wa{color:var(--muted);font-size:18px}

/* the door to the next Fouta: a card in the flow, not a floating slab */
.doorwrap{position:static!important;padding:0!important;margin-top:16px}
.door{width:100%;min-height:72px;border-radius:var(--r-card)!important;padding:12px 14px;
  border:1px solid var(--line)!important;background:var(--surface)!important;color:var(--ink)!important}
.door .di{background:var(--sunk)!important;border-radius:var(--r-tile);width:46px;height:46px}
.door.open{background:var(--wc-bg,var(--unit-bg))!important;border-color:transparent!important}
.door.open .di{background:rgba(255,255,255,.65)!important}
.door.open .dt b{color:var(--wc,var(--unit))}
.door .dt b{font-size:15px}
.door .dt small{color:var(--muted);opacity:1}
.door.shut{opacity:.75}

/* ---- world strip ---- */
.wstrip{padding:10px 0 2px;gap:7px}
.homechip,.wchip{border:none!important;background:var(--surface)!important;box-shadow:var(--shadow);
  border-radius:var(--r-tile);color:var(--muted);min-height:54px}
.wchip.on{background:var(--wc-bg)!important;color:var(--wc)!important;box-shadow:none}
.wchip.locked{background:var(--sunk)!important;box-shadow:none;opacity:.55}
.wchip .wi{font-size:17px}
.homechip{flex:0 0 46px;color:var(--unit)}

/* ---- the activity card and its parts ---- */
.doarea.clean{box-shadow:var(--shadow);border-radius:var(--r-card);padding:14px 12px}
.doarea{background:var(--surface)!important;border:none!important;box-shadow:var(--shadow);
  border-radius:var(--r-card)}
.doarea::after{display:none!important}
.hint{color:var(--muted)}
.ltile,.tk{background:var(--sunk)}
.ltile.got,.tk.hit{background:var(--unit-bg);color:var(--unit)}
.ltile.got b,.ltile.got small{color:var(--unit)}
.wallbtn.quiet{background:var(--sunk);color:var(--unit);border-radius:var(--r-tile)}
.wallbtn.quiet:active{background:var(--sunk-press)}
.cardfoot{color:var(--unit);border-top-color:var(--line)}
.cardfoot span{color:var(--unit)}
.col{background:var(--sunk)}
.cfoot button{background:var(--surface);box-shadow:0 1px 2px rgba(16,28,69,.08)}
.cfoot button:active{background:var(--sunk-press)}
.cfoot .cval,.numeral,.numword,.wordbig,.tok,.sentline{color:var(--unit)}
/* the coins keep their own two colours — they are the place-value key, and the
   swatch beside each column name must match the chips under it */
.col.tens .coin{--cn:#6E9C7C;--cnd:#2F6B45}
.col.ones .coin{--cn:#F0B54A;--cnd:#8A5A12}
.coin{background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.8) 0%,var(--cn) 58%,var(--cnd) 100%);
  box-shadow:none}
.coin::after{display:none}

/* the listen button: a pill in the unit's tint, no pressed edge */
.hearbtn{background:var(--unit-bg);color:var(--unit);border:none;border-radius:var(--r-pill);
  min-height:46px;font-weight:700}
.hearbtn.ghost{background:var(--sunk);color:var(--muted)}
.chipm{background:var(--unit-bg);color:var(--unit)}
.sayit{border:none!important;box-shadow:var(--shadow);border-radius:var(--r-card)}
.sayit .ear{background:var(--unit-bg);color:var(--unit)}
.key.v,.ndial button{background:var(--sunk)!important;border:none!important}
.key.on,.ctl.on{background:var(--unit)!important;color:#fff!important;border-color:transparent!important}
.ctl.right{background:#DCEBE1!important;border-color:transparent!important;color:#2F6B45}
.ctl.wrong{background:#FBE3E6!important;border-color:transparent!important;color:#8E3550}
.sentline .sw{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.sentline .sw.stop{background:var(--unit);border-color:transparent}
.sentline .sw.bad{background:#FBE3E6;border-color:transparent;color:#8E3550}
.cut.on::before{background:var(--unit);box-shadow:0 0 0 4px var(--unit-bg)}
.frames i{background:var(--unit-bg)}.frames i.t{background:var(--unit);opacity:1}
.tag{background:var(--unit-bg);color:var(--unit)}
.clip,.sndrow,.gloss2,.rcard .learnline,.rcard .gloss{background:var(--sunk)!important;
  border:none!important;color:#4A5064}
.sndrow button{border:1px solid var(--line);border-radius:var(--r-tile);color:var(--unit)}

/* ---- dashboard ---- */
.dash{background:var(--paper)}
.dhead2{margin:2px 14px 12px}
.dhead2 .me{border:2px solid var(--line);box-shadow:var(--shadow)}
.dhead2 .dt b{font-size:21px;color:var(--ink)}
.dbar2{background:#E4E7F2;margin:0 14px 6px;height:6px}
.dnote{color:var(--muted);font-weight:400;font-size:12px;margin:0 14px 14px}
.droad .rl{display:none}
.fcard{width:calc(100% - 28px);margin:0 14px 10px;padding:12px;background:var(--surface);
  border-radius:var(--r-card);box-shadow:var(--shadow);align-items:center}
.fcard:active{transform:scale(.98);opacity:1}
.fcard .disc{width:50px;height:50px;border:none;background:var(--fc-bg);border-radius:16px}
.fcard.here .disc{box-shadow:0 0 0 3px var(--fc)}
.fcard .nm{margin-top:0;font-size:17px;color:var(--ink)}
.fcard .lrn{font-size:12.5px}
.fcard .pips b{background:#E8EAF2}
.fcard .stat{display:inline-block;margin-top:9px;font-size:11px;font-weight:700;letter-spacing:0;
  background:var(--fc-bg);color:var(--fc);border-radius:var(--r-pill);padding:3px 10px}
.fcard.locked .stat{background:var(--sunk);color:var(--muted)}
.fcard.locked .disc{border:none!important}
.fcard .cta{color:var(--fc);font-weight:700}
.fcard.locked{opacity:.6}
.fcard.locked .disc{background:var(--sunk)}
.fcard.locked .cta,.fcard.locked .nm,.fcard.locked .lrn{color:var(--muted)}

/* ---- waypoint, arrival, handoff, detour, avatar ---- */
.way .beat,.way .said{border-radius:var(--r-card);box-shadow:var(--shadow);border:none!important}
.way .said{background:var(--unit-bg)!important;color:var(--unit)!important}
.way .said .who{color:var(--muted);opacity:1}
.way .wicon{background:var(--unit-bg)!important;color:var(--unit)!important;border-radius:16px}
.way .wttl b{color:var(--ink)}
.way .beat .ful{color:var(--unit)}
.arrive .stamp{background:var(--unit-bg)!important;color:var(--unit)!important}
.arrive h2,.finish h2,.detour h2,.hand h2,.avapick h2{color:var(--ink)}
.arrive .factbox{background:var(--surface)!important;color:var(--ink)!important;box-shadow:var(--shadow)}
.arrive .factbox b{color:var(--unit)}
.arrive .factbox .q{background:var(--sunk);color:#4A5064}
.arrive .stamp .trav,.avapick .cur,.node .me{border-color:var(--line)!important}
.suggest,.carry{background:var(--unit-bg)!important;color:var(--unit)!important;
  border:none!important;border-radius:var(--r-card)}
.suggest .bub,.carry .bub{background:rgba(255,255,255,.7)!important;border-radius:16px}
.carry .cx small,.suggest .nx small,.carry .cx em,.suggest .nx em{color:var(--muted);opacity:1}
.milestone{background:var(--unit-bg)!important;color:var(--unit)!important}
.milestone span{color:var(--muted);opacity:1}
.jbar i{background:#E4E7F2}.jbar i.done{background:var(--unit)}
.jbar i.now{background:var(--unit);opacity:.4}
.avaopt.on{background:var(--unit-bg)!important;box-shadow:0 0 0 2px var(--unit)!important}
.photobtn{background:var(--unit)!important;border-radius:var(--r-card)}
.stophead .dotn{background:var(--unit-bg)!important;color:var(--unit)}
.step.done{background:#F5FAF6!important;border-color:#DCEBE1!important}
.step.now{border-color:var(--unit)!important;box-shadow:0 0 0 2px var(--unit-bg)!important}
.steps{border-left-color:var(--line)}
.drawer{border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -4px 20px rgba(16,28,69,.08)}
.dgutter{background:linear-gradient(180deg,rgba(241,242,249,0),var(--paper) 60%)}
.dbody h4{color:var(--unit)}
.allbtn{border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);
  box-shadow:var(--shadow);color:var(--muted)}
.finish .big,.detour .big,.hand .big{font-size:52px}

/* the decorated outdoor scene is gone: no skies, no roads, no drifting props */
.worldtop,.sky,.band .bandbg,.band>.scene,.band>.road,.pinrow,.noderow,.hop,
.landmark,.gobar,.finishflag,.rcard .motifs,.rcard .hintline{display:none!important}
.trail,.band{padding:0!important;background:none!important}



/* ==========================================================================
   THE MAP OF THE FIVE FOUTAS  ·  v41
   The v38 dashboard did one thing better than anything since: a child could
   see the whole road at once — circles threaded on a dashed line, stars they
   had earned, padlocks ahead. That is the shape a six-year-old reads a journey
   in, so it comes back. What changes is only the dressing: the shared palette,
   one soft tint per Fouta instead of five saturated rings, and the type from
   the Notice Me system. Tap a Fouta and you land on its road, as before.
   ========================================================================== */
.dash{background:var(--paper);padding:12px 0 30px}
.droad{position:relative;padding-top:2px}

/* the road itself, running behind the circles from the first Fouta to the last */
.droad .rl{display:block;position:absolute;left:40px;top:38px;bottom:52px;width:4px;
  border-radius:3px;background:repeating-linear-gradient(180deg,#D7DCEA 0 7px,transparent 7px 15px)}
.droad .rl em{position:absolute;left:0;top:0;width:4px;border-radius:3px;
  background:var(--unit);opacity:.45;transition:height .5s ease}

/* a Fouta is a stop on the road, not a card sitting beside it */
.fcard{background:none!important;box-shadow:none!important;border-radius:0!important;
  align-items:flex-start;gap:14px;padding:8px 0 16px;margin:0 14px;width:calc(100% - 28px)}
.fcard:active{transform:scale(.985);opacity:.75}
.fcard .disc{width:56px;height:56px;border-radius:50%!important;background:var(--fc-bg);
  border:3px solid var(--fc)!important;font-size:26px;position:relative;z-index:2;
  /* a ring of page colour so the road passes behind the circle, not through it */
  box-shadow:0 0 0 6px var(--paper)!important}
/* where you are now: a thin halo, not a blob that spills off the margin */
.fcard.here .disc{box-shadow:0 0 0 5px var(--paper),0 0 0 8px var(--fc-bg)!important}
.fcard.locked .disc{background:var(--sunk)!important;border:3px dashed #C6CBDA!important;
  box-shadow:0 0 0 6px var(--paper)!important}
.fcard .nm{margin-top:5px;font-size:19px;color:var(--fc);font-weight:700}
.fcard .lrn{font-size:13px;color:var(--muted);margin-top:2px}
.fcard .pips{margin-top:9px;max-width:190px}
.fcard .pips b{height:6px;border-radius:3px}
.fcard .pips b.on{background:var(--fc)}
/* stars: what you have earned here, in this Fouta's own colour */
.fcard .stat{display:block!important;background:none!important;padding:0!important;
  margin-top:8px;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:0}
.fcard .stat .st{font-style:normal;font-size:15px;letter-spacing:2px;color:var(--fc)}
.fcard .cta{margin-top:8px;font-size:13px;color:var(--fc)}
.fcard.locked{opacity:1}
.fcard.locked .nm{color:#9AA0B4}
.fcard.locked .lrn,.fcard.locked .cta,.fcard.locked .stat{color:#B4B9C9}
.fcard.locked .stat .st{color:#C6CBDA}
.fcard.locked .pips b.on{background:#C6CBDA}
.dhead2 .dt b{color:var(--ink)}
.dnote{margin:0 14px 16px}



/* ==========================================================================
   THE FOOTPATH, AND ARRIVING SOMEWHERE  ·  v42
   Two things went quiet in the rebuild and both mattered:
   the path did not show how far you had walked, and the arrival message —
   the reward for finishing a whole Fouta — had its sentences broken in half
   by a rule meant for headings. Both fixed here.
   ========================================================================== */

/* the part of the road already walked is solid, in this Fouta's colour;
   ahead of you it stays dashed. A child sees the distance covered. */
.path .walked{position:absolute;left:9px;top:16px;width:4px;border-radius:3px;
  background:var(--unit);opacity:.5;transition:height .5s ease;max-height:calc(100% - 32px)}

/* ---- arriving in a Fouta ---- */
.arrive{padding:10px 4px 0}
.arrive .stamp{width:104px;height:104px;font-size:46px;
  border:4px solid var(--unit);box-shadow:none!important}
.arrive .stamp .trav{width:40px;height:40px;font-size:20px;bottom:-4px;right:-4px;
  border:3px solid var(--surface)!important;background:var(--surface)}
.arrive .lbl{color:var(--unit);opacity:.75;font-size:10.5px}
.arrive h2{font-size:28px}
.arrive .where{margin-bottom:18px}
/* the fact is a card in the house style, and its sentences stay sentences:
   the bold inside a paragraph is a word, not a heading */
.arrive .factbox{padding:16px 16px 14px;border-radius:var(--r-card)}
.arrive .factbox>b{display:block;font-size:16.5px;margin-bottom:8px;color:var(--unit)}
.arrive .factbox p b,.arrive .factbox p i{display:inline!important;margin:0!important;
  font-size:inherit!important;font-family:inherit!important}
.arrive .factbox p b{color:var(--unit);font-weight:700}
.arrive .factbox p{font-size:13.5px;line-height:1.65;color:#3D4358}
.arrive .factbox .q{background:var(--unit-bg);color:var(--unit);border-radius:var(--r-tile);
  padding:11px 13px;font-size:13.5px;line-height:1.5;margin-top:12px}
/* the same fix on a stop's story card, where bold words appear mid-sentence */
.way .beat p b,.way .beat p i{display:inline}



/* ==========================================================================
   THE FOOTPATH  ·  v43
   A straight rail beside a column of cards reads as a list. A road that bends
   reads as a journey, and that is what the child is actually doing. So the
   v38 trail comes back — but drawn in the Fouta's own tint with a white centre
   line, on the pale page, with the system's discs and labels. Nothing here is
   decoration for its own sake: the bends are what make it a road.
   ========================================================================== */
.trail{display:block!important;padding:2px 0 6px!important;position:relative}
.band{display:block!important;position:relative;padding:6px 0 10px!important;overflow:visible!important}
.band>.road{display:block!important;position:absolute;left:0;top:0;width:100%;height:100%;
  z-index:0;pointer-events:none;overflow:visible}
/* the road needs an edge, or a pale tint on a pale page reads as nothing:
   a soft darker verge under the tint, then the white centre line on top */
.road .rdb{display:block;fill:none;stroke:var(--unit);opacity:.14;stroke-width:34;
  stroke-linecap:round;stroke-linejoin:round}
.road .rd{fill:none;stroke:var(--unit-bg);stroke-width:29;stroke-linecap:round;stroke-linejoin:round}
.road .rdl{fill:none;stroke:#fff;stroke-width:3.5;stroke-dasharray:12 14;stroke-linecap:round}

.noderow{display:flex!important;padding:2px 0}
.noderow.l{justify-content:flex-start;padding-left:18px}
.noderow.r{justify-content:flex-end;padding-right:18px}
.noderow.m{justify-content:center}
.node{position:relative;z-index:2;background:none;border:none;padding:0;cursor:pointer;
  font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;width:126px}
.node .disc{width:74px!important;height:74px!important;border-radius:50%!important;
  background:var(--surface)!important;border:3px solid var(--unit)!important;
  display:grid;place-items:center;font-size:32px!important;position:relative;
  box-shadow:0 2px 8px rgba(16,28,69,.10)!important}
.node .disc::after{display:none!important}
.node .cap{font-size:13px;font-weight:700;color:var(--ink);background:var(--surface);
  padding:3px 11px;border-radius:var(--r-pill);box-shadow:0 1px 3px rgba(16,28,69,.08);
  text-shadow:none;line-height:1.2}
.node:active .disc{transform:scale(.95)}
/* finished: the Fouta's tint fills the disc and a green tick sits on it */
.node.done .disc{background:var(--unit-bg)!important;border-color:var(--unit)!important}
.node.done .disc .tickb{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;
  border-radius:50%;background:#DCEBE1;color:#2F6B45;display:grid;place-items:center;
  font-size:14px;border:2px solid var(--surface);box-shadow:none}
/* where you are: bigger, ringed, with the traveller standing on it */
.node.now .disc{width:88px!important;height:88px!important;font-size:38px!important;
  box-shadow:0 0 0 5px var(--unit-bg),0 2px 8px rgba(16,28,69,.10)!important}
.node.now .cap{font-size:14.5px}
.node.later{opacity:.62}
.node.later .disc{width:64px!important;height:64px!important;font-size:27px!important;
  border-color:var(--line)!important;box-shadow:none!important}
.node .me{position:absolute;top:-24px;left:50%;margin-left:-21px;width:42px;height:42px;
  border-radius:50%;background:var(--surface)!important;border:3px solid var(--unit)!important;
  display:grid;place-items:center;font-size:21px;box-shadow:none!important;overflow:hidden;
  cursor:pointer;z-index:3}
.node .me img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.node .sign{display:none}

/* a stop on the road sits beside the path, small and square, plainly not a task */
.pinrow{display:flex!important;padding:0}
.pinrow.l{justify-content:flex-start;padding-left:34px}
.pinrow.r{justify-content:flex-end;padding-right:34px}
.pinrow.m{justify-content:center}
.pin{position:relative;z-index:2;background:none;border:none;padding:0;cursor:pointer;
  font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;width:112px}
.pin .pd{width:46px;height:46px;border-radius:15px;background:var(--surface)!important;
  border:1px dashed var(--line)!important;display:grid;place-items:center;font-size:20px;
  box-shadow:0 1px 3px rgba(16,28,69,.07)!important;transform:rotate(-5deg)}
.pin.seen .pd{background:#F3FAF5!important;border-color:#CDE6D6!important}
.pin .pc{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--surface);
  padding:2px 9px;border-radius:var(--r-pill);box-shadow:0 1px 3px rgba(16,28,69,.06);
  line-height:1.2;max-width:112px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin:active .pd{transform:rotate(-5deg) scale(.94)}



/* ==========================================================================
   MADE FOR A SIX-YEAR-OLD  ·  v44
   Colour and life belong to the journey; calm belongs to the activity. Every
   rule below touches the map, the road, the arrival and the moment a step is
   finished. Nothing here reaches inside an activity card, because a child
   telling ƴ from y needs an empty field around the letterform.
   ========================================================================== */
:root{
  /* gold is reserved for one job only: things the child has earned */
  --gold:#E9A93C;--gold-deep:#B87A12;--gold-bg:#FDEFD3;
  --good:#3E8F5C;--good-bg:#DCEFE3;
  --oops:#E08163;--oops-bg:#FBE4DC;
  --road:#CFD3E8;--sky:#DDE7F4;--gnd:#9FCB93;
}
#phone,#phone.athome{background:var(--paper);transition:background .5s ease}
body{background:#DFE2EE}

/* ---- the place behind the road ---- */
/* the band is the place: a wash of this Fouta's sky, with the ground sitting
   at the bottom where the road arrives. Anchored to the bottom rather than
   stretched, so a river stays a river however long the road is. */
.band{border-radius:22px;overflow:hidden!important;
  padding:14px 0 18px!important;
  background:linear-gradient(180deg,var(--paper) 0%,var(--sky) 55%)!important}
.scenery{position:absolute;left:0;right:0;bottom:0;top:auto;width:100%;height:auto;
  aspect-ratio:400/340;z-index:0;pointer-events:none;display:block;opacity:.9}
.trail{padding:2px 0 8px!important}

/* ---- the road ---- */
.road .rdb{stroke:var(--unit);opacity:.16;stroke-width:36}
.road .rd{stroke:#fff;opacity:.55;stroke-width:31}
/* the stretch already walked, solid and bright */
.road .rdw{fill:none;stroke:var(--road);stroke-width:31;stroke-linecap:round;stroke-linejoin:round}
.road .rdl{stroke:#fff;stroke-width:4;stroke-dasharray:13 15;opacity:.95}

/* ---- the stops: bigger marks, because a child navigates by picture ---- */
.node .disc{width:84px!important;height:84px!important;font-size:38px!important;
  border-width:4px!important;background:#fff!important}
.node.done .disc{background:var(--unit-bg)!important}
.node.done .disc .tickb{width:30px;height:30px;font-size:16px;right:-5px;bottom:-5px;
  background:var(--gold)!important;color:#fff!important;border:3px solid #fff;
  box-shadow:0 2px 4px rgba(120,80,10,.30)!important}
.node.now .disc{width:98px!important;height:98px!important;font-size:44px!important;
  box-shadow:0 0 0 6px var(--gold-bg),0 4px 10px rgba(16,28,69,.14)!important;
  border-color:var(--gold)!important}
.node.later .disc{width:70px!important;height:70px!important;font-size:30px!important;
  background:rgba(255,255,255,.82)!important;border-color:rgba(255,255,255,.9)!important}
.node .cap{font-size:14px;padding:5px 13px 6px;box-shadow:0 2px 5px rgba(16,28,69,.13);
  display:flex;flex-direction:column;align-items:center;gap:1px}
/* the place sits under the name, not run against it */
.node .cap em{font-style:normal;font-size:11px;font-weight:600;color:var(--gold-deep);
  letter-spacing:.03em}
.node.later .cap em{color:var(--muted)}
.node.now .cap{font-size:15px;background:var(--gold-bg);color:var(--gold-deep)}
.node.later{opacity:.85}
.node.later .cap{color:var(--muted);background:rgba(255,255,255,.86)}

/* the traveller: bigger, and it lands on the step rather than appearing there */
.node .me{width:48px!important;height:48px!important;margin-left:-24px;top:-28px;
  font-size:24px;border:4px solid var(--gold)!important;
  box-shadow:0 3px 7px rgba(120,80,10,.25)!important}
.me.arriving{animation:land .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes land{
  0%{transform:translateY(-26px) scale(.5);opacity:0}
  60%{transform:translateY(3px) scale(1.06);opacity:1}
  100%{transform:none;opacity:1}}
/* the step just finished says so, once */
.node.justdone .disc{animation:stamped .6s cubic-bezier(.2,1.3,.4,1) both}
.node.justdone .tickb{animation:pop .45s .18s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamped{0%{transform:scale(1)}35%{transform:scale(1.13)}100%{transform:none}}
@keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:none;opacity:1}}

/* a stop on the road stays quieter than a task, but is no longer grey */
.pin .pd{width:52px;height:52px;font-size:23px;border:2px dashed var(--gold)!important;
  background:#fff!important;box-shadow:0 2px 5px rgba(16,28,69,.10)!important}
.pin.seen .pd{background:var(--gold-bg)!important;border-style:solid!important}
.pin .pc{font-size:12px;color:var(--gold-deep);background:#fff;padding:3px 10px}

/* ---- the map of the five Foutas: gold stars, warmer discs ---- */
.fcard .stat .st{color:var(--gold)!important;font-size:17px}
.fcard .disc{width:62px!important;height:62px!important;font-size:29px!important}
.fcard.here .disc{border-color:var(--gold)!important;
  box-shadow:0 0 0 5px var(--paper),0 0 0 9px var(--gold-bg)!important}
.droad .rl em{background:var(--gold)!important;opacity:.85!important}
.dbar2 i{background:var(--gold)!important}

/* ---- finishing feels like something ---- */
.hand .big{font-size:66px;animation:cheer .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cheer{0%{transform:scale(.3) rotate(-12deg);opacity:0}
  60%{transform:scale(1.12) rotate(4deg)}100%{transform:none;opacity:1}}
.jbar i.done{background:var(--gold)!important}
.hand h2{color:var(--gold-deep)}
.nextcard{border:2px solid var(--gold)!important;background:var(--gold-bg)!important}
.nextcard .nx b{color:var(--gold-deep)}

/* ---- arriving in a Fouta: the biggest thing in the app ---- */
.arrive .stamp{width:132px!important;height:132px!important;font-size:60px!important;
  border:5px solid var(--gold)!important;background:#fff!important;
  animation:stamp .75s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{0%{transform:scale(.2) rotate(-16deg);opacity:0}
  55%{transform:scale(1.14) rotate(5deg);opacity:1}100%{transform:none}}
.arrive .stamp .trav{width:46px;height:46px;font-size:23px;border:3px solid var(--gold)!important}
.arrive .lbl{color:var(--gold-deep);opacity:1;letter-spacing:.22em}
.arrive h2{font-size:31px}
.arrive .factbox{border:2px solid var(--unit-bg)!important}

/* right and wrong, one colour each, everywhere */
.ctl.right,.step.done{background:var(--good-bg)!important;color:var(--good)!important}
.ctl.wrong{background:var(--oops-bg)!important;color:#9A4A34!important}
.tk.hit,.ltile.got{background:var(--good-bg)!important;color:var(--good)!important}
.ltile.got b,.ltile.got small{color:var(--good)!important}
.tk.miss{background:var(--oops-bg)!important}
.cardfoot span{color:var(--gold-deep)}

@media (prefers-reduced-motion:reduce){
  .me.arriving,.node.justdone .disc,.node.justdone .tickb,
  .hand .big,.arrive .stamp{animation:none!important}
  #phone{transition:none}
}



/* ================= STOPS THAT ARRIVE, AND A SATCHEL ================= */
/* offered after an activity, where the rest has just been earned */
.storycard{display:flex;align-items:center;gap:13px;width:100%;margin:0 0 10px;
  background:var(--surface);border:2px dashed var(--gold);border-radius:var(--r-card);
  padding:13px 14px;cursor:pointer;font-family:inherit;text-align:left;min-height:76px;
  box-shadow:0 2px 6px rgba(16,28,69,.07)}
.storycard:active{transform:scale(.98)}
.storycard .sb{width:52px;height:52px;border-radius:16px;background:var(--gold-bg);
  display:grid;place-items:center;font-size:25px;flex:0 0 auto}
.storycard .sx{flex:1;min-width:0}
.storycard .sx em{font-style:normal;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--gold-deep);display:block;margin-bottom:3px}
.storycard .sx b{display:block;font-size:17px;color:var(--ink);line-height:1.15}
.storycard .sx small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.storycard .sa{font-size:22px;color:var(--gold-deep)}

.satchel{padding:2px 0 10px}
.satbtn{position:relative;width:46px;height:46px;border-radius:50%;border:none;flex:0 0 auto;
  background:var(--gold-bg);font-size:22px;cursor:pointer;font-family:inherit;
  box-shadow:0 2px 5px rgba(120,80,10,.14)}
.satbtn:active{transform:scale(.94)}
.satbtn i{position:absolute;right:-3px;top:-3px;min-width:20px;height:20px;border-radius:10px;
  background:var(--gold);color:#fff;font-style:normal;font-size:11px;font-weight:700;
  display:grid;place-items:center;padding:0 5px;border:2px solid var(--paper)}
.satchel .shead{color:var(--unit);margin:16px 0 8px}
.satchel .stopcard{border-style:solid;border-color:var(--unit-bg)}
.satchel .stopcard .sm{background:var(--unit-bg)}



/* ================= HEAR IT, FIND IT ================= */
.hf{display:flex;flex-direction:column;align-items:center;width:100%}
/* ---- v171: the word cards are all the same box ----
   The meeting card is a picture, a word, a gloss and a listen button; the
   finding card that follows it is a picture and three answers. They were
   different heights, so the white box grew and shrank between two screens the
   child reads as one place, and on the short one the way on floated in the
   middle of a lot of nothing. Both are now the same box, and the door is
   pushed to the bottom of it, where it is on every other card. */
.meet.wmcard,.hf.wmcard{min-height:392px}
.wmcard .wallbtn{margin-top:auto}
.wmcard .wmnav.solo{margin-top:10px}
/* ---- v204: there is one listen button in this course ----
   The gold block was adopted on the letter and word cards, but half a dozen
   screens still carried the older amber pill or the pale "ghost" variant, so
   the same action wore three different faces. They are one thing now; .big is
   the same button, larger, for the screens where listening IS the activity. */
/* v207: one shape, one size, everywhere. It was a pill on one screen, a tall
   rounded block on the next and a wide rectangle on a third, because the
   "grown-up says it" line was printed INSIDE the button and grew it. That line
   now hangs underneath without touching the button's shape. */
.hearbtn{min-height:60px;height:60px;font-size:17px;padding:0 28px;border-bottom:none;
  border-radius:999px;position:relative;justify-content:center;
  background:var(--gold-bg)!important;color:var(--gold-deep)!important;
  box-shadow:0 3px 0 rgba(184,138,42,.22)}
.hearbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(184,138,42,.22)}
.hearbtn .bars{height:19px}
.hearbtn .bars i{width:4.5px;height:7px}
.hearbtn.ghost{background:var(--gold-bg)!important;color:var(--gold-deep)!important}
.hearbtn.big{min-height:60px;height:60px;font-size:18px;padding:0 34px;margin:6px 0 2px;
  background:var(--gold-bg)!important;color:var(--gold-deep)!important}
.hearbtn.big .bars{height:19px;gap:4px}
.hearbtn.big .bars i{width:4.5px;height:7px}
/* until the sound files exist, a grown-up can say the letter aloud */
.grownup{font-size:10.5px;color:#A9AEC2;margin:2px 0 12px;letter-spacing:.02em}
.grownup b{color:#8E93A8;font-size:13px}
.hfrow{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;width:100%}
.hfk{min-width:74px;min-height:74px;border:none;border-radius:20px;background:var(--sunk);
  font-family:'FulSerif',serif;font-size:34px;color:var(--ink);cursor:pointer;padding:0 10px;
  box-shadow:0 2px 5px rgba(16,28,69,.07)}
.hfk:active{transform:scale(.94)}
.hfk.hit{background:var(--good-bg);color:var(--good);box-shadow:0 0 0 3px var(--good)}
.hfk.miss{background:var(--oops-bg);color:#9A4A34;animation:shake .3s}
.hfk.show{box-shadow:0 0 0 3px var(--gold);background:var(--gold-bg);color:var(--gold-deep)}
.hfsay{font-size:13.5px;font-weight:700;color:var(--good);margin:12px 0 0}
.hfsay.teach{color:var(--gold-deep)}
.hf .wallbtn{margin-top:12px}

/* a group finished: the same shape as arriving in a Fouta, scaled down */
.chunkdone{text-align:center;padding:14px 4px 0}
.chunkdone .big{font-size:58px;animation:cheer .7s cubic-bezier(.2,1.4,.4,1) both}
.chunkdone h2{font-family:'FulSans',sans-serif;font-size:23px;color:var(--gold-deep);margin:12px 0 4px}
.chunkdone p{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.chunkbar{display:flex;gap:4px;margin:0 0 18px}
.chunkbar i{flex:1;height:7px;border-radius:4px;background:#E4E7F2}
.chunkbar i.done{background:var(--gold)}



/* ================= THE BACK BUTTON ================= */
/* It was the character ‹ — a guillemet, which is punctuation, not an arrow —
   sitting at 19px inside a 44px tile. Small, thin and off-centre by the glyph's
   own side-bearings. Now it is a drawn chevron in a round button: bigger tap
   area, even weight, and centred by geometry rather than by the font. */
.tbtn{width:48px!important;height:48px!important;border-radius:50%!important;
  display:grid!important;place-items:center;padding:0!important;
  font-size:21px;font-weight:700;color:var(--unit)!important;
  background:var(--surface)!important;border:1px solid var(--line)!important;
  box-shadow:0 2px 5px rgba(16,28,69,.09)!important}
.tbtn svg{width:26px;height:26px;display:block}
.tbtn:active{transform:scale(.92);background:var(--unit-bg)!important}
.topbar{padding:10px 12px 6px;gap:10px;align-items:center}

/* ================= PRESS IT, AND IT JUMPS ================= */
.jfield{position:relative;width:100%;height:min(330px,44vh);min-height:230px;margin-top:10px;
  background:var(--unit-bg);border-radius:22px;overflow:hidden}

  cursor:pointer;box-shadow:0 4px 10px rgba(16,28,69,.16);

  transition:left .28s cubic-bezier(.3,1.5,.5,1),top .28s cubic-bezier(.3,1.5,.5,1)}

.gloss.aside{align-self:flex-end;margin:0 6px 2px 0;font-size:12px;color:var(--muted);
