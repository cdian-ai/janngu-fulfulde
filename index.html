<style>
:root{
  --indigo:#1B2E6B;--indigo-deep:#101C45;
  --amber:#F2AE3F;--amber-deep:#C07A16;
  --leaf:#4F9D69;--leaf-deep:#357A4C;
  --coral:#E4694A;--coral-deep:#B8503A;--plum:#7A4A86;--plum-deep:#5C3566;
  --teal:#2E8B87;--teal-deep:#1F6B67;--berry:#B2396B;--berry-deep:#8A2751;
  --ivory:#FBF5E7;--ivory-warm:#F0E5CC;
  --ink:#181A24;--muted:#6C7186;--line:rgba(27,46,107,.15);
  --unit:#1B2E6B;--tap:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--indigo-deep);display:flex;justify-content:center;min-height:100vh;
  font-family:'FulSans',system-ui,sans-serif;color:var(--ink);overflow-x:hidden}
.ff{font-family:'FulSerif',Georgia,serif}

/* ================= THE LONG MARK =================
   Vowel length is meaning in Fulfulde — fira and fiira are different words —
   and it is the one thing an English-speaking child will not hear unaided.
   Fulfulde already writes length by doubling the letter, and that cue never
   fails, so the mark is a temporary crutch and not a new spelling: a bar drawn
   over the doubled pair, longer because the sound is longer. It is NOT a
   colour. Colour in this course is already spent three times over — a tint per
   Fouta, a tint per little word, white-on-indigo for the ending — and the
   ending is exactly where the doubled vowels sit, so a fourth colour would
   land on the same letters as the third. An overline collides with nothing,
   says something about length by its own shape, and survives a child who
   cannot tell purple from red.
   Drawn with text-decoration rather than a positioned bar so it takes its
   height from the font's own overline metric and clears the dot on ii. */
/* v187: the bar is gone, everywhere.
   It was a mark this course invented and no Fulfulde reader has ever seen. It
   asked a child to learn a convention that exists nowhere outside this app, on
   top of the alphabet they came here for, and then took it away again by Labe
   — so it was also a thing to unlearn. Fulfulde already writes length by
   doubling the letter, that cue never fails, and it is what every book prints.
   The doubling now carries it alone.
   The rule is left as an inert declaration and lmTier() below returns 0, so
   nothing paints and the walker exits at once. Kept rather than deleted so the
   several call sites stay valid. */
.lvm{text-decoration:none}
#phone{width:100%;max-width:430px;background:var(--ivory);min-height:100vh;display:flex;
  flex-direction:column;box-shadow:0 0 60px rgba(0,0,0,.55);position:relative;overflow:hidden}
.flag{background:var(--indigo-deep);color:rgba(251,245,231,.5);font-size:9.5px;padding:5px 16px;text-align:center}

.topbar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--unit);transition:background .3s}
.tbtn{width:44px;height:44px;border:none;border-radius:13px;background:rgba(251,245,231,.16);
  color:#FBF5E7;font-size:20px;cursor:pointer;flex:0 0 auto;font-family:inherit;display:grid;place-items:center}
.tbtn:active{transform:scale(.93)}
.tname{font-family:'FulSans',sans-serif;color:#FBF5E7;font-size:15px;flex:1;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{height:5px;background:rgba(251,245,231,.18);display:flex;gap:2px;padding:0 12px 8px;background:var(--unit)}
.prog i{flex:1;height:5px;border-radius:3px;background:rgba(251,245,231,.22)}
.prog i.done{background:var(--amber)}.prog i.now{background:#FBF5E7}

/* ---- v220: the page reserved more room than the furniture needs ----
   178px was set when the way on lived in the navigation strip and that strip
   was taller. The furniture below the page is now the settings handle (52px)
   and the arrow strip sitting on top of it (about 54px), so seventy-odd pixels
   of the screen were being held back for nothing — which is the empty band
   under every card. This is the height of the card, not the card's own rule. */
main{flex:1;padding:14px 14px calc(114px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;animation:fade .28s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

.sayit{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);
  border-radius:16px;padding:9px 12px 9px 9px;margin-bottom:12px;width:100%;cursor:pointer;
  font-family:inherit;text-align:left;min-height:var(--tap)}
.sayit .ear{width:44px;height:44px;border-radius:13px;background:var(--amber);display:grid;
  place-items:center;font-size:20px;flex:0 0 auto;box-shadow:0 3px 0 var(--amber-deep)}
.sayit.on .ear{background:var(--amber-deep)}
.sayit small{font-size:12px;color:var(--muted);line-height:1.35;display:block}
.sayit:active{transform:translateY(2px)}

/* v207: one card, one height. It was sized to its contents, so a short
   activity drew a shallow box, a long one a deep one, and moving between them
   felt like moving between three different apps. Every card is the same
   height now and its contents sit in the middle of it. */
.doarea{background:linear-gradient(180deg,#F8F1E0,#EFE3C7);border:2px solid rgba(27,46,107,.12);
  border-radius:24px;padding:44px 12px 14px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;position:relative;overflow:hidden;
  /* ---- v221: the card takes the room, it does not ask for a size ----
     Everything until now set the card's height with numbers — a floor, then a
     ceiling, then a smaller ceiling — and it was still sizing itself to its
     own contents and leaving the rest of the page empty underneath. It is a
     flex child of the scrolling area now, so it simply fills whatever is
     between the progress line and the navigation. The floor stays as a
     minimum for very short screens. */
  flex:1 1 auto;
  min-height:240px;
  /* v215: and never taller than the room there is. A card that grows past the
     bottom of the phone takes its way-on with it, and a child cannot press a
     button they have to know is there in order to scroll to it. */
  /* v219: 262px assumed a full-screen viewport. Inside an in-app browser the
     usable height is already smaller, so subtracting that much again capped
     the card well short of the room actually there and clipped the way on at
     its foot. The page's own padding keeps the card clear of the navigation;
     this is only a backstop. */
  max-height:none}
/* the activity takes what is left after the way-on has its place, and scrolls
   inside the card if it must — the button never moves */
/* v218: growing to fill the card left a lake of white between the last option
   and the way on. The activity is as tall as it is; the card centres it, and
   the button follows it. Only a card with something pinned at its foot — the
   listen block — still stretches. */
/* ---- v231: the activity is centred, the door is not ----
   Cards were packing their contents against the top and leaving a field of
   white above the button. The activity takes all the room between the top of
   the card and the door, and centres itself inside it — so a short screen sits
   in the middle of the panel and a tall one fills it, and in both cases the
   way on is in exactly the same place. Cards with a listen block pinned at
   their foot keep packing from the top, because that is what pins it. */
.doarea>.hf,.doarea>.vlen,.doarea>.meet,.doarea>.pens,.doarea>.endsee,.doarea>.endspot{
  flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  width:100%;justify-content:center}
.doarea>.hf:has(.lower),.doarea>.vlen:has(.lower),.doarea>.meet:has(.lower),
.doarea>.pens:has(.lower),.doarea>.endsee:has(.lower){justify-content:flex-start}
.doarea>.hf:has(.lower),.doarea>.vlen:has(.lower),.doarea>.meet:has(.lower),
.doarea>.pens:has(.lower),.doarea>.endsee:has(.lower){flex:1 1 auto}
.doarea>.cardway{flex:0 0 auto;margin-top:14px!important;margin-bottom:2px!important}
/* v224: what was printed outside now sits inside, and takes the card's width */
/* v225: the word and its little word, side by side, nothing to operate */
/* v226: the four forms, side by side, filling in as they are pressed */
.pgrid{width:100%;display:flex;flex-direction:column;gap:5px;margin-top:12px}
.prow2{display:grid;grid-template-columns:76px minmax(0,1fr);gap:6px;align-items:center;
  padding:5px 8px;border-radius:12px;background:var(--sunk);
  border:1.5px solid transparent;transition:background .2s ease,border-color .2s ease}
.prow2.has{background:var(--mk-soft)}
.prow2.now{border-color:var(--mk-deep)}
.prow2 .pl2{font-family:'FulSans',sans-serif;font-size:10.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.prow2.has .pl2{color:var(--mk-deep)}
.prow2 .pw{display:flex;align-items:baseline;justify-content:center;gap:7px;
  min-width:0;flex:1 1 auto}
.prow2 .pw b{font-size:clamp(14px,4.4vw,19px);color:var(--ink)}
/* v227: the row you are on is the display, so it is the big one */
.prow2.now .pw b{font-size:clamp(19px,6.2vw,26px)}
.prow2.now .pw .pm{font-size:clamp(15px,4.8vw,20px)}
.objs2{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center;
  min-height:56px;width:100%}
/* v228: the stepping card */
.fstep{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:8px;
  align-items:center;width:100%;margin-top:6px}
.fsarr{width:52px;height:64px;border:none;border-radius:18px;cursor:pointer;
  background:var(--mk-soft);color:var(--mk-deep);font-size:30px;line-height:1;
  font-family:'FulSans',sans-serif;display:grid;place-items:center}
.fsarr:active{transform:translateY(1px)}
.fscard{background:#fff;border-radius:20px;padding:14px 10px;text-align:center;
  box-shadow:0 0 0 2px var(--mk-deep),0 6px 16px rgba(16,28,69,.10);min-width:0}
.fscard .fsw{font-family:'FulSerif',serif;font-size:clamp(21px,7vw,32px);color:var(--ink);
  line-height:1.15}
.fscard .fsw b{color:var(--mk-deep)}
.fscard .fsw .tail{color:var(--mk-deep)}
.fscard .fsw .head{color:var(--amber-deep)}
.fscard .fsl{font-family:'FulSans',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.fdots{display:flex;gap:9px;justify-content:center;margin-top:12px}
.fdot{width:11px;height:11px;border-radius:50%;background:rgba(16,28,69,.14)}
.fdot.on{background:var(--mk-deep)}
.fdot.now{box-shadow:0 0 0 4px var(--mk-soft)}
.fhint{margin:8px 0 2px;font-size:12px;color:var(--muted);text-align:center}
.pgrid.full .prow2{padding:7px 9px}
/* v233: the finished pattern had four filled colour bands, which is four
   backgrounds competing with the four words they were meant to hold. The
   rows are the card's own paper now and the colour survives only on the
   little word, which is the part the colour was ever telling you about. */
.pgrid.plain .prow2,.pgrid.plain .prow2.has{background:var(--card);
  border-color:rgba(16,28,69,.10)}
.pgrid.plain .prow2.now{border-color:rgba(16,28,69,.16);background:var(--sunk)}
.pgrid.plain .prow2 .pl2,.pgrid.plain .prow2.has .pl2{color:var(--muted)}
.rhyme.tight{margin:2px 0 6px;font-size:12.5px}
/* the form as it arrives */
.fpop{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  pointer-events:none;background:rgba(22,20,44,.28);animation:przfade .2s ease both}
.fpop.out{opacity:0;transition:opacity .34s ease}

/* ---- the step back ----
   It sits above the settings bar rather than in the header, because the header
   arrow means "leave this stop" everywhere in the course and one arrow cannot
   honestly mean two things. Fixed, so it is reachable without scrolling to the
   bottom of a long card; small, and only over the left edge, so it covers as
   little as the settings bar already does. main's bottom padding was raised to
   clear both — the forward button at the end of a stop was sitting under the
   settings bar. */
/* ---- v170: the trio carries the Fouta's tint, not its full colour ----
   Filled in the Fouta colour, the three arrows were the same object as the way
   on \u2014 same maroon, same weight, a hand's width apart at the bottom of the card.
   Solid Fouta colour is now reserved for nothing at all down there: the trio
   drops to the Fouta's tint on white, so it still says which Fouta you are in
   (v163) while reading as what it is \u2014 quiet history controls, not the door.
   ---- v171: and it stops floating ----
   A control pinned over the page will land on top of whatever happens to be
   under it, and on the marker cards it landed squarely on the way on: two
   buttons in the same square inch, with start over underneath one of them and
   unreachable. It is now its own strip, the full width of the page, sitting
   above the settings handle. Nothing is ever beneath it, so nothing is ever
   covered by it, and the arrows are always in the same place on every screen
   rather than wherever the card happens to end. */
.stepnav{position:fixed;left:0;right:0;bottom:52px;z-index:55;display:flex;align-items:center;gap:8px;
  width:100%;max-width:430px;margin:0 auto;padding:6px 12px;border-radius:0;
  background:rgba(247,248,252,.97);
  box-shadow:0 -1px 0 var(--unit-bg),0 -6px 16px rgba(16,28,69,.06)}
/* v176: scoped away from the door. This rule was making every button in the
   strip a 42px circle - including the docked way on, which then squeezed
   "next" onto two lines and hung off the right edge of the screen. */
.stepnav button:not(.wallbtn){width:42px;height:42px;border:none;border-radius:50%;cursor:pointer;
  background:var(--unit-bg);color:var(--unit);display:grid;place-items:center;font-family:inherit}
.stepnav button:not(.wallbtn) svg{width:22px;height:22px}
.stepnav button.fwd svg{transform:scaleX(-1)}
.stepnav button:active{transform:translateY(2px)}
.stepnav button:not(.wallbtn)[disabled]{background:#F3F5FA;color:#C6CBD8;cursor:default}
.stepnav button[disabled]:active{transform:none}
.stepnav button.restart{background:var(--unit-bg);opacity:.72}
.stepnav button.restart[disabled]{background:#F3F5FA;color:#C6CBD8;opacity:1}

/* ================= THE NUMBER MACHINE =================
   Two columns, the way a place-value mat is laid out at school. Each column
   owns its own dial, so the control sits with the coins it fills. Both columns
   hold at most nine, so they are the same height and the card never resizes. */

/* ================= CLEANER ACTIVITY SHELL =================
   White surfaces, soft shadow instead of heavy rails and borders. */

/* ---- the way on is a pill on the right, on every screen ----
   Full width meant the door ran under the floating arrows in the bottom-left
   corner, so on half the cards the label was cut in two. It is now as wide as
   its words, pushed to the right-hand edge, well clear of the trio \u2014 and it is
   the same object in the same corner in every activity.
   v171: and the same COLOUR and the same WORD. It had been three different
   buttons \u2014 a pale grey pill, a green outlined pill after a right answer, and
   a full-width filled one \u2014 carrying eleven different sentences of English
   between them ("now match them", "now let's look at it", "so what do they all
   share?"). A child who cannot read English was reading the shape, and the
   shape kept changing. One filled pill in the Fouta's colour, bottom right,
   saying next. Green still means a right answer everywhere it always did:
   on the answer itself, never on the door. */
.wallbtn{margin:14px 0 0 auto;width:auto;max-width:100%;display:block;min-height:50px;
  padding:0 22px;border:none;border-radius:25px;background:var(--unit);
  font-family:'FulSans',sans-serif;font-size:15px;font-weight:700;color:#fff;
  cursor:pointer;letter-spacing:.02em;box-shadow:0 3px 10px rgba(16,28,69,.16)}
.wallbtn:active{filter:brightness(.92)}
/* the two that are not doors \u2014 they go back, or sideways */
.wallbtn.quiet{background:#EDEFF6;color:var(--unit);box-shadow:none;
  min-height:46px;font-size:14px;margin-right:auto;margin-left:0}
.wallbtn.quiet:active{background:#DFE3EE}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 10px;line-height:1.35;
  max-width:300px;font-family:'FulSans',sans-serif}
/* small, quiet, and in the same place on every card: press it and the card
   tells you what to do in Pular. It is the only thing left of the old band. */
/* ---- v217: the instruction button costs no height ----
   It is the way to the written instruction for the screen (it opens the
   grown-up drawer at this stage's note) and a child does see it. Sitting
   centred at the top of the card it was pushing everything down by its own
   height plus its margin, on every screen in the course. It goes to the
   corner, out of the flow, and everything else moves up. */
.sayear{position:absolute;left:10px;top:9px;z-index:4;
  display:block;margin:0;width:42px;height:28px;border:none;border-radius:14px;
  background:var(--sunk,#EDEFF6);cursor:pointer;padding:0;color:var(--unit,#3B4270);
  opacity:.75}
.sayear .bars{display:flex;align-items:center;justify-content:center;gap:3px;height:100%}
.sayear .bars i{width:3px;height:9px;border-radius:2px;background:currentColor;display:block}
.sayear .bars i:nth-child(2){height:15px}
.sayear:active{opacity:.7}
.ndial.clean{border:none;box-shadow:0 1px 3px rgba(16,28,69,.07);border-radius:18px;padding:8px 12px}
.ndial.clean button{border:none;background:#F4F5F9;box-shadow:none;border-radius:13px}
.ndial.clean button:active{background:#E8EAF2}
.ndial button[disabled]{opacity:.32;cursor:default}
.ctl.clean{border:none;border-bottom:none;box-shadow:0 1px 3px rgba(16,28,69,.07)}
.numword{font-family:'FulSerif',serif;font-size:24px;font-weight:600;color:var(--unit);
  text-align:center;margin-top:4px;line-height:1.2;word-break:break-word}

.frames i{width:13px;height:13px;border-radius:4px;background:var(--amber);animation:drop .3s both}
.frames i.t{background:var(--unit);opacity:.5}
.ndial{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;
  border:2px solid var(--line);border-radius:17px;padding:8px 10px;min-height:var(--tap)}
.ndial b{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ndial button{width:46px;height:46px;border-radius:14px;border:2px solid var(--line);

/* ================= WORLDS ================= */
.worldtop{display:none!important}

.sndchip:active{transform:scale(.94)}

html,body{height:100%}
#phone{height:100vh;overflow:hidden}
/* dvh where it exists: on a phone 100vh includes the browser chrome, which
   pushed the bottom of every card under the settings bar */
@supports (height:100dvh){ #phone{height:100dvh} }
/* flex:1 alone will not scroll — a flex child's min-height is auto, so main
   grew to fit its content and the overflow was simply clipped off the bottom
   of the phone with no way to reach it. min-height:0 is what makes it a
   scrolling box rather than a growing one. */
main{flex:1 1 0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}

.worldtop{position:relative;height:158px;flex:0 0 auto;overflow:hidden;
  transition:background 1.1s ease}
.worldtop .wt{position:absolute;left:18px;top:16px;
  font-family:'FulSans',sans-serif;font-size:22px;color:#fff;line-height:1.05;
  text-shadow:0 2px 6px rgba(0,0,0,.35)}
.worldtop .wt small{display:block;font-size:11.5px;font-weight:600;opacity:.9;letter-spacing:.05em;margin-top:3px}
.worldtop .sndbtn{position:absolute;right:14px;top:14px;width:44px;height:44px;border:none;
  border-radius:14px;background:rgba(255,255,255,.24);color:#fff;font-size:19px;cursor:pointer;
  backdrop-filter:blur(3px)}
.worldtop .sndbtn:active{transform:scale(.93)}
.worldtop .ground{position:absolute;bottom:-26px;left:-8%;width:116%;height:62px;border-radius:50% 50% 0 0;z-index:5}
.worldtop .ground2{position:absolute;bottom:-38px;left:-22%;width:92%;height:58px;border-radius:50% 50% 0 0;z-index:4}

/* scene props (shared by header + bands) */
.scene{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.worldtop .scene{z-index:6}
.worldtop .wt{z-index:8}
.worldtop .sndbtn{z-index:9}
.band>.scene{position:absolute;inset:0;z-index:1}
.p{position:absolute;line-height:1}
.orb{position:absolute;border-radius:50%}
@keyframes driftR{from{transform:translateX(-24vw)}to{transform:translateX(124vw)}}
@keyframes driftL{from{transform:translateX(120vw)}to{transform:translateX(-28vw)}}
@keyframes bobS{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes fall{from{transform:translateY(-16px);opacity:0}
  10%{opacity:.75}to{transform:translateY(150px);opacity:0}}
@keyframes ripple{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes walk{0%{transform:translateX(0) scaleX(1)}
  48%{transform:translateX(58px) scaleX(1)}50%{transform:translateX(58px) scaleX(-1)}
  98%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
@keyframes nod{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(5deg) translateY(-4px)}}
@keyframes paddle{0%,100%{transform:translateX(-8px) rotate(-3deg)}50%{transform:translateX(26px) rotate(3deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 10px rgba(255,214,122,.18)}50%{box-shadow:0 0 0 22px rgba(255,214,122,.06)}}

/* ---- trail bands ---- */
.trail{padding:0 0 150px;position:relative}
