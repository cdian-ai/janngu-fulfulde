/* ---- the three words are the card, so they sit in the middle of it ----
   The tile grid still carried the 26px picture column from the version that
   had pictures, so every word was pushed a picture's width to the right of
   centre on a screen whose whole job is reading. And at 31px in a 20px-padded
   tile three of them filled the card. Centred, and cut to a size that leaves
   the card some air. */
.endsee .seewrap:not(.braced) .seelist{align-items:center;gap:9px}
.endsee .seewrap:not(.braced) .seerow{grid-template-columns:minmax(0,1fr);
  justify-items:center;max-width:300px;padding:13px 16px;border-radius:19px}
.endsee .seewrap:not(.braced) .seerow b{font-size:clamp(16px,5.2vw,25px)}

/* ---- the badge was sharing a line with the ear ----
   .sayear is absolutely positioned in the card's top-left corner, so the first
   thing an activity prints starts underneath it and the two overlap. The badge
   clears it now. The six slots come down with it: at 54px they were a row of
   objects competing with the badge above them, when all they are is a tally of
   what has been caught. */
.endrill .estamp,.endsee .estamp{margin-top:26px}
.eshelf .eslot{width:40px;height:40px;border-radius:12px;font-size:19px}
.eshelf{gap:5px;margin-bottom:11px}

/* ---- six rows, and all six on the screen ----
   The card is measured to the space and clips what will not fit, so the
   frieze was showing three of its six and the reader could not tell there
   were more. Everything in it gives a little. */
.endrill .edone{margin:2px 0 9px;font-size:14px}
.pairlist.frieze .prow{padding:6px 11px}
.pairlist.frieze .prow .eg{width:26px;height:26px;font-size:15px}
.pairlist.frieze .ph{margin:7px 12px 3px}
.pairlist.frieze .prow .pl b,.pairlist.frieze .prow .pr{font-size:clamp(12px,3.9vw,16px)}

/* ---- the settings handle sat on the home line ----
   It was 52px hard against the bottom of the screen, which on a phone with a
   home indicator means the bottom third of it is the system's, not ours: a
   thumb aiming for Settings hits both. It keeps its own 58px and adds the
   inset underneath, so the label sits well clear of the line, and everything
   that measured itself against 52px moves up by the same amount. */
.dhandle{height:auto;min-height:58px;font-size:13px;
  padding:0 12px env(safe-area-inset-bottom,0px)}
.drawer{transform:translateY(calc(100% - 58px - env(safe-area-inset-bottom,0px)))}
.drawer.open{transform:translateY(0)}
.dgutter{height:calc(58px + env(safe-area-inset-bottom,0px))}
.stepnav{bottom:calc(60px + env(safe-area-inset-bottom,0px))}
main{padding-bottom:calc(126px + env(safe-area-inset-bottom))}
.findme{bottom:calc(84px + env(safe-area-inset-bottom))}
.symsheet{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}

/* ==================== v237 ====================
   The cheap four from the design audit: a greeting on day one, the calendar
   off the road, one lesson per card at Tugee, and somewhere to stop. */

/* the word on the "which little word" screen is a word to be read and heard,
   not a control \u2014 same treatment the phrase gets on the screen after it */
.whichw{border:none;background:none;padding:2px 6px;margin:10px 0 2px;cursor:pointer;
  font-family:'FulSerif',serif;font-weight:600;font-size:clamp(26px,8vw,42px);
  line-height:1.1;border-radius:14px}
.whichw:active{transform:translateY(2px);background:var(--mk-soft)}

/* what a child says to somebody, printed where they will see it as they leave */
.sayto{display:flex;flex-direction:column;align-items:center;gap:4px;margin:14px 0 2px;
  padding:14px 12px;border-radius:16px;background:var(--gold-bg,#FBF2DC)}
.sayto b{font-size:26px;color:var(--gold-deep);line-height:1.1}
.sayto span{font-family:'FulSans',sans-serif;font-size:13px;color:#6C7186}

/* ---- the resting place ----
   Nothing new on the screen: the same two doors, the other way round. The
   moon is the whole of the signal, and "or one more" keeps the road open for
   a child who is not tired \u2014 a stopping point that refuses to let you carry
   on is a wall, and this is an inn. */
.restcard{display:flex;align-items:center;gap:12px;width:100%;margin:12px 0 8px;
  padding:14px 14px;border:none;border-radius:19px;cursor:pointer;font:inherit;
  text-align:left;background:var(--unit);color:#fff;
  box-shadow:0 3px 0 rgba(16,28,69,.18),0 10px 22px rgba(16,28,69,.14)}
.restcard:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(16,28,69,.18)}
.restcard .rb{flex:0 0 auto;width:44px;height:44px;border-radius:14px;
  background:rgba(255,255,255,.16);display:flex;align-items:center;
  justify-content:center;font-size:23px}
.restcard .rx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.restcard .rx em{font-style:normal;font-family:'FulSans',sans-serif;font-size:10.5px;
  font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.72}
.restcard .rx b{font-size:17px;line-height:1.2}
.restcard .rx small{font-size:12px;opacity:.75}
.restcard .ra{font-size:24px;opacity:.7}
.nextcard.quietcard{background:transparent;box-shadow:none;
  border:1.5px solid var(--line)}

/* ==================== v239 ====================
   Two names for one day, at the same size, because they are not a headword
   and a footnote — they are two answers to the same question, centuries apart. */
.twoname{display:flex;gap:9px;width:100%;margin:6px 0 0}
.nmcard{flex:1 1 0;min-width:0}
.nmcard{display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:16px 9px 12px;border-radius:19px;border:2px solid transparent;
  cursor:pointer;font:inherit;background:var(--sunk);
  box-shadow:0 2px 0 rgba(16,28,69,.06)}
.nmcard:active{transform:translateY(2px);box-shadow:none}
.nmcard b{font-size:clamp(17px,5.6vw,25px);line-height:1.12;color:var(--ink);
  text-align:center;overflow-wrap:normal;word-break:keep-all}
.nmcard span{font-family:'FulSans',sans-serif;font-size:10.5px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.nmcard.own{background:var(--unit-bg);border-color:var(--unit)}
.nmcard.own b,.nmcard.own span{color:var(--unit)}
.nmcard.lent{background:var(--gold-bg,#FBF2DC)}
.nmcard.lent b{color:var(--gold-deep)}
.nmsame{font-family:'FulSans',sans-serif;font-size:12px;color:var(--muted);
  text-align:center;margin:10px 0 0;letter-spacing:.03em}

/* ==================== v240 ====================
   The doubled letter stops being a shape to spot and becomes the difference
   between laughing and being strong. */
.gpwrap{display:flex;flex-direction:column;align-items:center;width:100%}
.gppic{font-size:62px;line-height:1.05;margin:2px 0 12px}
.gprow{display:flex;gap:9px;width:100%}
.gpw{flex:1 1 0;min-width:0;padding:15px 8px;border-radius:18px;border:2px solid var(--line);
  background:#fff;cursor:pointer;font-family:'FulSerif',serif;font-weight:600;
  font-size:clamp(15px,4.8vw,21px);color:var(--ink);line-height:1.15;
  overflow-wrap:normal;word-break:keep-all;
  box-shadow:0 2px 0 rgba(16,28,69,.07)}
.gpw:active{transform:translateY(2px);box-shadow:none}
.gpw em{font-style:normal;color:var(--gold-deep);background:var(--gold-bg,#FBF2DC);
  border-radius:6px;padding:0 3px}
.gpw.hit{border-color:var(--leaf-deep);background:#F3F9F1}
.gpw.miss{border-color:var(--coral);animation:msshake .34s}
.gpw.dim{opacity:.5}
.gpsay{width:100%;margin-top:13px;padding:11px 12px;border-radius:15px;background:var(--sunk)}
.gpsay p{display:flex;align-items:baseline;gap:9px;margin:0 0 5px;font-size:14px}
.gpsay p b{font-size:17px;color:var(--ink)}
.gpsay p span{color:var(--muted)}
.gpsay .gphold{justify-content:center;margin:8px 0 0;padding-top:8px;
  border-top:1px solid rgba(16,28,69,.08);font-size:19px;color:var(--gold-deep)}

/* ==================== v241 ====================
   A doing word and a describing word, because a child with thirty-three nouns
   and nothing to do with them cannot be handed a sentence. */
.vbwrap,.ajwrap{display:flex;flex-direction:column;align-items:center;width:100%}
.vbpic,.ajpic{font-size:56px;line-height:1.05;margin:2px 0 10px}
.vbline{justify-content:center;flex-wrap:wrap}
.sw.plain{opacity:.55}
.sw.doing{background:var(--leaf-bg,#EAF4E6);color:var(--leaf-deep);font-weight:700}
.sw.hole{display:inline-block;min-width:78px;height:26px;border-radius:9px;
  border:2px dashed var(--unit);background:var(--unit-bg);vertical-align:middle;
  animation:dockwait 1.9s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.sw.hole{animation:none}}

.ajphrase{display:flex;align-items:baseline;justify-content:center;gap:9px;
  flex-wrap:wrap;width:100%}
/* older engines ignore flex gap and the two words run together; the margin is
   belt and braces and costs nothing where gap already works */
.ajphrase>b{margin-right:9px}
.gpsay p b{margin-right:9px}
.ajphrase>b{font-size:clamp(21px,6.6vw,31px);color:var(--ink);line-height:1.1}
.ajstem{font-size:clamp(18px,5.6vw,26px);color:#A2A7BC;
  border-bottom:3px dashed #C6CBDA;padding-bottom:2px}
.ajfull{font-size:clamp(21px,6.6vw,31px);color:var(--unit);line-height:1.1}
.ajfull em{font-style:normal;color:var(--gold-deep);
  background:var(--gold-bg,#FBF2DC);border-radius:6px;padding:0 3px}
.ajsay{width:100%;margin-top:14px;padding:12px;border-radius:15px;background:var(--sunk)}
.ajsay .ajen{margin:0;text-align:center;font-size:15px;color:var(--muted)}
.ajsay .ajsw{display:flex;flex-direction:column;align-items:center;gap:3px;
  margin:9px 0 0;padding-top:9px;border-top:1px solid rgba(16,28,69,.08);
  font-size:18px;color:var(--gold-deep)}
.ajsay .ajsw span{font-family:'FulSans',sans-serif;font-size:11px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* ==================== v243 ====================
   ---- the greeting is a conversation, so it looks like one ----
   v242 put the words in a bubble but left three things in the way: the button
   holding the phrase still wore the pressable-word chrome from elsewhere in
   the course (a grey box inside the bubble), a gold listen button stood
   between the two turns so they never read as one exchange, and the reply
   simply appeared. The bubbles are the sound buttons now, they sit one under
   the other, and the second one only exists once the child has chosen it. */
.gsay,.gbub .gsay{border:none!important;background:none!important;
  box-shadow:none!important;padding:0;margin:0;min-height:0;cursor:pointer;
  font:inherit;color:inherit;text-align:left;display:block;width:100%}
.gbub{cursor:pointer}
.gbub:active{transform:translateY(2px)}
.gline.new .gbub{animation:bubin .42s cubic-bezier(.2,1.35,.4,1) both}
@keyframes bubin{from{opacity:0;transform:translateY(14px) scale(.94)}
  to{opacity:1;transform:none}}
/* it arrives as a wave, and the wave settles into the person waving */
.gwho.arrive{position:relative;display:block;width:48px;height:48px}
.gwho.arrive i{position:absolute;left:0;top:0;font-style:normal;
  font-size:42px;line-height:1}
.gwho.arrive .w{animation:gwave 1.15s ease both}
.gwho.arrive .f{opacity:0;animation:gface .42s ease .95s both}
@keyframes gwave{0%{opacity:0;transform:scale(.5) rotate(-20deg)}
  16%{opacity:1;transform:scale(1.05) rotate(16deg)}
  34%{transform:rotate(-14deg)}52%{transform:rotate(14deg)}
  70%{transform:rotate(-6deg)}86%{opacity:1;transform:rotate(0)}
  100%{opacity:0;transform:scale(.78)}}
@keyframes gface{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
/* the reply, once chosen, asks to be pressed until it has been heard once */
.gbub.mine.nudge{animation:gnudge 2s ease-in-out infinite}
@keyframes gnudge{0%,100%{transform:none;box-shadow:0 2px 7px rgba(16,28,69,.08)}
  50%{transform:translateY(-3px);box-shadow:0 8px 18px rgba(47,107,69,.20)}}
/* the three things that could be said back */
.gopts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;
  margin-top:16px}
.gopt{flex:1 1 auto;min-width:96px;min-height:66px;border:none;border-radius:20px;
  background:var(--sunk);cursor:pointer;font-family:inherit;padding:8px 14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  box-shadow:0 2px 6px rgba(16,28,69,.07)}
.gopt b{font-family:'FulSerif',serif;font-weight:600;font-size:clamp(19px,5.6vw,24px);
  color:var(--ink);line-height:1.1}
.gopt .gob{display:flex;gap:2px;align-items:flex-end;height:9px}
.gopt .gob i{width:3px;border-radius:2px;background:var(--muted);height:5px}
.gopt .gob i:nth-child(2){height:9px}.gopt .gob i:nth-child(3){height:6px}
.gopt:active{transform:scale(.96)}
.gopt.no{background:var(--oops-bg);animation:shake .3s}
@media (prefers-reduced-motion:reduce){.gline.new .gbub,.gwho.arrive .w,
  .gwho.arrive .f,.gbub.mine.nudge{animation:none}.gwho.arrive .f{opacity:1}}

/* ---- the four forms, written on the card ----
   The finished pattern was a box inside a box: each row had a tinted tray and
   inside it a white pill, because .pw carries the pressable-word chrome used
   for word buttons elsewhere and these are not buttons, they are the answer.
   The words sit on the card's own paper now, one hairline apart. */
.pgrid .prow2,.pgrid.plain .prow2,.pgrid.plain .prow2.has,.pgrid.full .prow2{
  background:none;border:none;border-radius:0;box-shadow:none;
  padding:9px 2px;border-bottom:1px solid rgba(16,28,69,.07)}
.pgrid .prow2:last-child{border-bottom:none}
.pgrid.plain .prow2.now,.pgrid .prow2.now{background:none;border-color:transparent;
  border-bottom:1px solid rgba(16,28,69,.07)}
.pgrid .prow2 .pw{background:none!important;border:none!important;
  box-shadow:none!important;min-height:0;padding:0}
.tdmk{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 10px}

/* ---- the page could not be scrolled ----
   Closing the drawer from anywhere outside its own closure (Start again, and
   the buttons in the drawer that move you) removed the drawer and the scrim
   but not the class on <body> that holds the page still while the drawer is
   up. main kept overflow:hidden and touch-action:none for the rest of the
   session, which is a frozen screen with its lower half out of reach. */
.hand.rest{padding-top:8px}
.hand.rest .big{font-size:46px}
.hand.rest h2{font-size:21px;margin:8px 0 2px}
.hand.rest p{margin:0 0 10px}

/* ==================== v242 ====================
   ---- a greeting is said TO somebody ----
   The card put the speaker's face INSIDE the panel, so the greeting read as
   a label with a picture beside it rather than as words coming out of a
   person's mouth. It is a speech bubble now: the words fill the bubble, and
   the bubble's tail points down at the face of whoever is speaking, who
   stands outside it. The elder speaks from the left; the reply comes back
   from the right, out of the child's own traveller, so the two turns of a
   real greeting sit one under the other the way a conversation does. */
.gline{width:100%;display:flex;flex-direction:column;align-items:flex-start;
  margin:2px 0 4px}
.greet .gline:first-child{margin-top:14px}
.gline.you{align-items:flex-end}
.gbub{position:relative;box-sizing:border-box;width:100%;
  background:var(--unit-bg);border-radius:26px;padding:17px 19px;
  box-shadow:0 2px 7px rgba(16,28,69,.08)}
/* the tail: it leaves the bubble at the bottom corner nearest the speaker
   and leans towards them, so the eye runs from the words to the face */
.gbub::after{content:"";position:absolute;bottom:-13px;left:27px;width:0;height:0;
  border-top:16px solid var(--unit-bg);border-right:17px solid transparent}
.gbub .gtext{width:100%;text-align:left}
.gbub .gtext b{font-size:clamp(24px,7.4vw,32px);color:var(--unit);line-height:1.15}
.gbub .gtext small{font-size:13px;margin-top:4px}
/* the face, standing under its own words rather than inside them */
.gwho{display:block;font-size:42px;line-height:1;margin:15px 0 0 14px;
  filter:drop-shadow(0 3px 4px rgba(16,28,69,.16))}
.gline.you .gwho{margin:15px 14px 0 0}
.gwho img{display:block;width:46px;height:46px;border-radius:50%;object-fit:cover}

/* the child's turn: the same bubble mirrored, in the colour a right answer
   already wears everywhere else in the course */
.gline.you .gbub{background:var(--good-bg);text-align:center}
.gline.you .gbub::after{left:auto;right:27px;border-right:none;
  border-left:17px solid transparent;border-top-color:var(--good-bg)}
.gbub .gword{display:inline-block;border:none;background:none;padding:3px 8px;margin:0;cursor:pointer;
  font-family:'FulSerif',serif;font-weight:600;line-height:1.15;
  font-size:clamp(25px,7.8vw,33px);color:var(--good);border-radius:12px}
.gbub .gword:active{transform:translateY(2px);background:rgba(255,255,255,.6)}
.gline.you .gbub small{display:block;font-size:13px;color:#4A5064;margin-top:1px}
/* before the reply is chosen the bubble is empty and waiting, so the three
   words below are visibly what goes in it */
.gbub.empty{min-height:84px;display:grid;place-items:center;background:var(--sunk);
  box-shadow:inset 0 0 0 2px var(--good);animation:gwait 1.9s ease-in-out infinite}
.gbub.empty::after{border-top-color:var(--sunk)}
.gq{font-family:'FulSerif',serif;font-size:32px;color:var(--good);opacity:.45}
@keyframes gwait{0%,100%{opacity:.82}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.gbub.empty{animation:none}}

/* ---- v248: the settings bar sits on the bottom edge, and nothing shows under it ----
   Two faults, one visible symptom. First, the closed drawer was translated up by
   58px PLUS the safe-area inset, but the handle was min-height:58px with the inset
   as padding INSIDE that 58 (everything is border-box here). So the reveal was
   taller than the gold bar by exactly the inset, and the top slice of the drawer
   body — the grown-ups text about audio files — sat in the open below it.
   The handle now measures 58px plus the inset, so the reveal and the bar are the
   same height and the label still clears the home indicator.
   Second, html and body could still scroll: #phone was min-height:100vh, so on a
   short road the document ran past the viewport and the page itself moved under
   the fixed drawer. The shell is locked to the viewport now and only main scrolls,
   which is what it was always built to do. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{min-height:0}
#phone{min-height:0;height:100vh;overflow:hidden}
@supports (height:100dvh){ html,body{height:100dvh} #phone{height:100dvh} }
.dhandle{min-height:calc(58px + env(safe-area-inset-bottom,0px))}
.drawer.open .dhandle{min-height:58px;padding-bottom:0}


/* v249: counting cards */
.syl{display:inline-block;padding:2px 10px;margin:0 3px;border-radius:10px;
 background:var(--gold-bg);color:var(--gold-deep);font-family:'FulSerif',serif}
.coin.gold{background:#F0B54A}
.jeepre{color:#6E9C7C}
.jeetail{color:#B8860B}
.jeetail.ok{color:#B8860B}
.jeetail.no{color:var(--oops,#B4544B);opacity:.7}
.jeeblank{display:inline-block;min-width:2.2ch;color:var(--sunk);opacity:.55}
.tenlad{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.tenrung{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;
 border:1.5px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;font-family:inherit}
.tenrung b{font-size:19px;color:var(--unit)}
.tenrung span{font-size:12.5px;color:var(--muted)}
.tenrung.hun{grid-column:1 / -1;background:var(--gold-bg);border-color:rgba(184,138,42,.35)}

</style>
</head>
<body>
<div id="phone">
  <div class="topbar" id="tb"></div>
  <div class="prog" id="pg"></div>
  <input type="file" id="avafile" accept="image/*" style="position:absolute;left:-9999px;width:1px;height:1px">
  <main id="app"></main>
  <div class="dgutter"></div>
  <div class="dscrim" id="dscrim"></div>
  <div class="drawer" id="drawer">
    <button class="dhandle" id="dh">⚙  Settings  · hold</button>
    <div class="dbody" id="db"></div>
  </div>
</div>

<script>
/* ==========================================================
   JANNGU FULFULDE 1 — full course
   Source: Amadu Sajoh Bah, Peeral, London/Leiden 2019
   ========================================================== */

/* ---------- UNIT 1: letters ---------- */
/* a replay control that looks like a replay control. The round arrow was read
   as a switch — something that changes the card — rather than as "say it
   again", which is all it has ever done. */
const SPKSVG='<svg class="spk" viewBox="0 0 24 24" aria-hidden="true">'
 +'<path d="M4 9.3h3.9L12.4 5.2v13.6L7.9 14.7H4z" fill="currentColor"/>'
 +'<path d="M15.6 9.1a4.3 4.3 0 0 1 0 5.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
 +'<path d="M18.4 6.3a8 8 0 0 1 0 11.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".5"/></svg>';
const LETTERS=[["A","a","aa","amugol"],["B","b","baa","barkugol"],["Ɓ","ɓ","ɓaa","ɓaaragol"],
["C","c","caa","caangol"],["D","d","daa","daasugol"],["Ɗ","ɗ","ɗaa","ɗaanagol"],["E","e","ee","entugol"],
["F","f","faa","faamugol"],["G","g","gaa","gasugol"],["H","h","haa","haarugol"],["I","i","ii","ilugol"],
["J","j","jaa","jalugol"],["K","k","kaa","kaanugol"],["L","l","laa","laamagol"],["M","m","maa","malugol"],
["Mb","mb","mbaa","mbabba"],["N","n","naa","nanugol"],["Nd","nd","ndaa","ndaarugol"],["Ng","ng","ngaa","ngaari"],
["Nj","nj","njaa","njaareendi"],["Ŋ","ŋ","ŋaa","ŋatugol"],["Ñ","ñ","ñaa","ñaamugol"],["O","o","oo","okkugol"],
["P","p","paa","paamugol"],["R","r","raa","raɗagol"],["S","s","saa","saalugol"],["T","t","taa","taalugol"],

/* ==========================================================
   audio: drop files into /audio and they play. Missing files
   fall back silently to the animated indicator.
   ========================================================== */
/* ---- one place decides the file type ----
   Every clip path in this course is written as .mp3 because that is what the
   paths were first drafted as. The recordings are .m4a, straight off the phone,
   and converting 270 of them would lose quality for no gain. So the extension
   is a setting, applied once as the clip is loaded, and every path in the code
   below can go on saying .mp3 without a single one of them being wrong.
   Change AUDIO.ext to ".mp3" if the library is ever re-cut. */
const BUILD="v250 · 5 September 2026";
const AUDIO={base:"audio/",ext:".m4a",last:"—",el:{},buf:{},cur:null,src:null,order:[],
 missing:{},scope:null};
/* ---- when there is no sound ----
   Every clip path in this course is wired and none of them is recorded yet, so
   the commonest state of this app in the world right now is silent. A child
   who cannot read then has nothing at all: "listen, then tap the letter you
   heard" is not answerable. So the first clip that fails to load turns the
   grown-up line from a footnote into the instruction — the adult becomes the
   audio, which is what they were always going to be. */
/* ---- the quiet belongs to a screen, not to the session ----
   v179 had this and the v180 audio rewrite lost it. Without it the flag
   latches: the first clip that fails anywhere puts the whole course into
   grown-up-says-it mode, so one silent letter card at Dagana makes the syllable
   machine look broken even though all 267 of its clips are there. With the
   library arriving a folder at a time that is exactly the wrong failure. The
   flag is cleared on every screen change, so each screen answers for its own
   sound. A path that has already failed is remembered, so a screen that wants
   it shows the grown-up line at once rather than after a wait. */
function soundScope(){
 const k=String(S.view)+"|"+String(S.act);
 if(AUDIO.scope===k) return;
 AUDIO.scope=k;
 document.body.classList.remove("nosound");
}
function noSound(){
 if(document.body.classList.contains("nosound")) return;
 document.body.classList.add("nosound");
}
/* ---- v180: one channel, and the file is already there ----
   Three faults, all of them heard rather than seen. A clip was a brand-new
   Audio() every single press, so every press was a fresh network request to
   the server and the sound arrived a beat or more after the finger left the
   screen — on a syllable machine, where the whole point is that the sound
   belongs to the tap, a beat late is wrong. Nothing ever stopped the clip
   before, so a letter still talking when the next thing was pressed simply
   carried on underneath it, which is where the two-sounds-at-once came from.
   And nothing was ever fetched before it was wanted.
   So: every clip is loaded once and kept, there is exactly one clip sounding
   at any moment, and pressing a letter quietly fetches its ten syllables while
   the letter is still saying itself — by the time a vowel is pressed the file
   is in memory and the sound is instant.
   Web Audio is used where the browser has it (a decoded buffer starts in the
   same frame as the tap); the audio element is kept as the fallback. */
function clipPath(path){ return String(path||"").replace(/\.mp3$/i,AUDIO.ext) }
function clipURL(path){ return AUDIO.base+clipPath(path) }
function clipEl(path){
 const u=clipURL(path); let a=AUDIO.el[u];
 if(!a){
  a=new Audio(); a.preload="auto"; a.src=u;
  /* only a clip the child is actually waiting on turns the grown-up line into
     the instruction — a warmed file that happens not to exist yet is silent
     news, not an announcement */
  a.addEventListener("error",function(){ AUDIO.missing[path]=true; if(AUDIO.cur===a) noSound() });
  AUDIO.el[u]=a; AUDIO.order.push(u);
  /* the cache is small on purpose: 267 syllables plus letters and words would
     hold more decoded audio than a cheap phone wants to carry */
  while(AUDIO.order.length>90){
   const old=AUDIO.order.shift();
   if(old!==AUDIO.src){ delete AUDIO.el[old]; delete AUDIO.buf[old] }
  }
 }
 return a;
}
/* fetch and decode ahead of the press, quietly, never blocking anything */
function warmClip(path){
 const u=clipURL(path);
 if(AUDIO.missing[clipPath(path)]) return;   /* v185: asked once, it wasn't there */
 try{ clipEl(path) }catch(e){}          /* setting src is the fetch */
 if(AUDIO.buf[u]!==undefined) return;
 const c=(SND&&SND.ctx)?SND.ctx:null; if(!c||!c.decodeAudioData) return;
 AUDIO.buf[u]=null;                      /* in flight — don't ask twice */
 try{
  fetch(u).then(function(r){ return r.arrayBuffer() })
   .then(function(b){ return c.decodeAudioData(b) })
   .then(function(d){ AUDIO.buf[u]=d })
   .catch(function(){ delete AUDIO.buf[u] });
 }catch(e){ delete AUDIO.buf[u] }
}
/* v185: the prefetch waits for the screen.
   warmCons asks for a consonant's ten syllables, which is twenty paths, and
   each one makes an Audio element and a fetch. That was happening on
   pointerdown, synchronously, before the sheet had painted — so on a phone the
   letters were still on screen while forty requests went out, and the sheet
   arrived when they were done rather than when the finger came down. Worse
   with no audio folder beside the file, because then all forty fail slowly.
   The batch now waits for a frame and then a beat, and it is spread rather
   than fired at once, so nothing it does can hold up a screen a child is
   waiting for. */
function warmClips(list){
 const l=(list||[]).slice(); if(!l.length) return;
 const go=function(){
  let i=0;
  const step=function(){
   if(i>=l.length) return;
   try{ warmClip(l[i]) }catch(e){}
   i++; setTimeout(step,25);
  };
  step();
 };
 if(window.requestAnimationFrame) requestAnimationFrame(function(){ setTimeout(go,60) });
 else setTimeout(go,80);
}
/* whatever is sounding, stop it — a new sound replaces the old one, it never
   joins it */
function stopClip(){
 try{ if(AUDIO.cur&&AUDIO.cur.stop) AUDIO.cur.stop(0); }catch(e){}
 try{ if(AUDIO.cur&&AUDIO.cur.pause){ AUDIO.cur.pause(); AUDIO.cur.currentTime=0 } }catch(e){}
 AUDIO.cur=null;
}
function play(btn,path){
  if(btn){btn.classList.add("on");setTimeout(()=>btn.classList.remove("on"),820)}
  const p=clipPath(path), u=AUDIO.base+p;
  AUDIO.last=p; AUDIO.src=u; paintDrawer();
  if(AUDIO.missing[p]){ noSound(); return }   /* known silent: say so at once */
  stopClip();
  try{
   const c=(SND&&SND.ctx)?SND.ctx:null, d=AUDIO.buf[u];
   if(c&&d){                              /* decoded already: starts now */
    if(c.state==="suspended") try{ c.resume() }catch(e){}
    const s=c.createBufferSource(); s.buffer=d; s.connect(c.destination);
    AUDIO.cur=s; s.start(0);
    document.body.classList.remove("nosound");
    return;
   }
   const a=clipEl(p);
   AUDIO.cur=a; try{ a.currentTime=0 }catch(e){}
   const r=a.play();
   if(r&&r.then) r.then(function(){ document.body.classList.remove("nosound") })
    .catch(function(){ AUDIO.missing[p]=true; noSound() });
   warmClip(p);                            /* next press will be instant */
  }catch(e){ AUDIO.missing[p]=true; noSound() }
}
const ci=c=>String(CONS.indexOf(c)).padStart(2,"0");
const vi=v=>VOW.indexOf(v);
const pad=(n,w)=>String(n).padStart(w,"0");

/* ---------- helpers ---------- */
const DI=["mb","nd","ng","nj"];
const tok=w=>{const o=[];for(let i=0;i<w.length;){const t=w.substr(i,2);
  if(DI.includes(t)){o.push(t);i+=2}else{o.push(w[i]);i++}}return o};
const cutsFrom=s=>{const p=s.split("/"),c=[];let n=0;
  for(let i=0;i<p.length-1;i++){n+=tok(p[i]).length;c.push(n)}return c};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const splitHead=(w,o)=>{let i=0;while(i<w.length&&i<o.length&&w[i]===o[i])i++;
  const k=Math.max(1,i);return[w.slice(0,k),w.slice(k)]};
const chunk=(arr,n)=>{const o=[];for(let i=0;i<arr.length;i+=n)o.push(arr.slice(i,i+n));return o};

/* ----------------------------------------------------------
   THE ALPHABET WALL
   A linear deck hid the thing the book is most careful about:
   mb, nd, ng and nj are single letters, not spelling accidents.
   On a wall they each hold their own tile, and the child chooses
   the order. Opening one asks for the letter inside a real word.
   ---------------------------------------------------------- */

/* longest match first, so mbabba breaks as mb·a·b·b·a, never m·b·a… */
const LTOKS=CONS.concat(VOW).slice().sort(function(a,b){return b.length-a.length});
function tokenise(w){
 const out=[]; let i=0;
 while(i<w.length){
  let hit=null;
  for(let k=0;k<LTOKS.length;k++){
   const t=LTOKS[k];
   if(w.substr(i,t.length)===t){hit=t;break}
  }
  if(!hit){hit=w[i]}
  out.push(hit); i+=hit.length;
 }
 return out;
}

function parade(){ return S.lopen===null ? lwall() : lcard() }

/* wrap() reads the activity's one instruction line; the wall and the letter
   ask for different things, so the line changes with the view */


function lwall(){
 const tiles=LETTERS.map(function(L,i){
  const got=S.lfound.has(i);

 }).join("");

 return wrap(`<div class="lwall">${tiles}</div>
  <p class="wallnote">${S.lfound.size} of 32 found · every letter you have met</p>
  <button class="cardfoot" data-finish><span>✓</span>I've finished this</button>`,
  S.lfound.size,32,true);
}

function lcard(){
 const [U,l,nm,ex]=LETTERS[S.lopen];
 const toks=tokenise(ex);
 const got=S.lfound.has(S.lopen);
 const chips=toks.map(function(t,k){
  const right=(t===l), cls=(got&&right)?" hit":(S.lmiss===k?" miss":"");
  return `<button class="tk${cls}" data-tk="${k}" data-right="${right?1:0}">${esc(t)}</button>`;
 }).join("");
 ACTS.parade.say=got?"Tap the word to hear it.":"Find the letter inside the word.";

/* ==========================================================
   HEAR IT, FIND IT — sound to letter
   The alphabet wall runs letter -> sound. This runs the other way, and that
   direction is the one that is actually reading. The wrong answers are the
   curriculum: every distractor is a letter the target is genuinely confusable
   with — by hook, by nasal, or by the mutation pairs the book itself teaches.
   Nothing is scored. A wrong pick costs nothing; a second wrong pick teaches.
   ========================================================== */
const LIX={}; LETTERS.forEach(function(L,i){ LIX[L[1]]=i });

const SQ=[
 {n:"The five vowels", q:[
   ["a",["e","o"]],["e",["i","a"]],["i",["e","u"]],["o",["u","a"]],["u",["o","i"]]]},
 {n:"The plain stops", q:[
   ["b",["p","d"]],["d",["t","b"]],["g",["k","d"]],
   ["k",["g","t"]],["p",["b","f"]],["t",["d","k"]]]},
 {n:"The hooked letters", q:[
   ["ɓ",["b","p","ɗ"]],["ɗ",["d","t","ɓ"]],["ƴ",["y","i","ñ"]],["’",["a","h","k"]]],
  r:[["i",["e","u","ƴ"]],["u",["o","w","i"]],["e",["i","a","’"]]]},
 {n:"The nasals", q:[
   ["m",["n","mb"]],["n",["m","nd"]],["ŋ",["n","ng"]],["ñ",["n","nj","y"]]],
  r:[["b",["ɓ","p","mb"]],["d",["ɗ","t","nd"]],["g",["k","ŋ","ng"]]]},
 {n:"Fricatives", q:[
   ["c",["s","j"]],["f",["p","h"]],["h",["f","’"]],["j",["c","ñ"]],["s",["c","t"]]],
  r:[["ɓ",["b","p","mb"]],["ɗ",["d","nd","t"]],["ƴ",["y","ñ","i"]]]},
 {n:"Liquids and glides", q:[
   ["l",["r","n"]],["r",["l","d"]],["w",["u","b"]],["y",["ƴ","i","j"]]],
  r:[["m",["mb","n","ŋ"]],["n",["ŋ","ñ","nd"]],["ñ",["nj","ŋ","n"]]]},
 {n:"The two-letter letters", q:[
   ["mb",["b","m","nd"]],["nd",["d","n","ng"]],["ng",["g","ŋ","nd"]],["nj",["j","ñ","ng"]]],
  r:[["s",["c","j","ñ"]],["y",["ƴ","j","i"]],["r",["l","d","ɗ"]]]}
];
/* the options for one item, in a fixed order per item so they never reshuffle
   under a child's finger mid-answer */
function sqRow(item,seed){
 /* three at a time: target plus its two closest neighbours. The distractor
    lists are written hardest-first, so trimming to two keeps the hard ones. */
 const opts=[item[0]].concat(item[1].slice(0,2));
 for(let i=opts.length-1;i>0;i--){
  seed=(seed*9301+49297)%233280;
  const j=Math.floor(seed/233280*(i+1)), t=opts[i]; opts[i]=opts[j]; opts[j]=t;
 }
 return opts;
}
function sqItems(ci){ const c=SQ[ci]; return c.q.concat(c.r||[]) }

/* Four places in Fuuta Tooro a letter can hide. PLACEHOLDER — these are a
   guess from the geography (the Senegal river valley, where the Subalɓe fish)
   and need the author's confirmation before this ships. Each Fouta should get
   its own four, chosen by someone who knows the place. */
const HIDES=[
 [["\ud83d\udc1f","the fish"],["\ud83c\udf33","the tree"],["\ud83d\udef6","the boat"],["\ud83c\udffa","the pot"]],
 [["\ud83d\udc04","the cow"],["\u26f0\ufe0f","the hill"],["\ud83e\uded8","the basket"],["\ud83c\udf3f","the bush"]],
 [["\ud83d\udc2b","the camel"],["\ud83c\udf3e","the millet"],["\ud83c\udfba","the horn"],["\ud83c\udf19","the moon"]],
 [["\ud83c\udfd4\ufe0f","the mountain"],["\ud83d\udc10","the goat"],["\ud83e\udeb5","the wood"],["\ud83e\udd4a","the drum"]],
 [["\u2708\ufe0f","the plane"],["\ud83d\udcda","the books"],["\u2709\ufe0f","the letter"],["\ud83c\udfe0","the house"]]
];

/* which coat of the letter we ask for — they alternate, so a child meets the
   capital and the small letter as two coats of one thing, not two letters */
function meetCoat(k){ return k%2===0 ? 1 : 0 }   /* 1 = small, 0 = capital */

function hearfind(ci){
 if(ci===undefined) ci=S.sqChunk;
 S.sqChunk=ci;
 const c=SQ[ci], items=sqItems(ci);
 if(!c) return done("\ud83d\udc42","Every letter heard");
 if(S.sqPhase!=="parade") return meetView(ci,c);

 if(S.sqI>=items.length){
  /* Length is contrastive in Fulfulde — fira and fiira are different words —
     and it is the one thing a book cannot show. It used to be taught once, at
     the listening pairs near the end of the Fouta, by which time the child had
     been building long vowels in the sound machine for two stops without ever
     being told what one was. It is met here instead, at the stop where the
     five vowels are first met, as a pair you can see as well as hear: the
     same sound, one of them held. */
  if(ci===0 && !S.vlDone) return vowLength();
  if(ci===0 && !S.vcDone) return vowCheck();
  if(ci===0 && !S.viDone) return vowInWord();
  /* a chunk finished is a small arrival — the same shape as reaching a Fouta */
  const last=ci===SQ.length-1;
  return `<div class="chunkdone">
    <div class="big">${last?"\ud83c\udfc6":"\u2b50"}</div>
    <h2>${esc(c.n)} \u2014 done</h2>
    <p>${last?"You have heard every letter in the alphabet."
      :`${SQ.length-ci-1} more ${SQ.length-ci-1===1?"group":"groups"} to go`}</p>
    <div class="chunkbar">${SQ.map(function(_,i){
      return `<i class="${i<=ci?"done":""}"></i>`}).join("")}</div>
    <button class="ctl" style="width:100%" data-finish>done \u2713</button>
   </div>`;
 }

 const item=items[S.sqI], tgt=item[0], isReview=S.sqI>=c.q.length;
 const opts=sqRow(item,ci*97+S.sqI*13+7);
 const got=S.sqPick===tgt, shown=S.sqWrong>=2;
 const ix=LIX[tgt];

 sayNow(isReview?"One you have met before. Listen, then find it."
   :"Listen. Then tap the letter you heard.");
 return wrap(`<div class="hf">
   <p class="grownup">grown-up: say <b class="ff">${esc(LETTERS[ix][1])}</b>
     <span class="nameis">${esc(LEX.name.f)}: ${esc(LETTERS[ix][2])}</span></p>
   <div class="hfrow">${opts.map(function(o){
      const right=o===tgt;
      const cls=got&&right?" hit":(S.sqPick===o&&!right?" miss":"")
        +((shown&&right)?" show":"");
      return `<button class="hfk${cls}${S.sqPick?"":" wait"}"
        data-sq="${esc(o)}">${esc(o)}</button>`}).join("")}</div>
   ${got?`<p class="hfsay">\u2713 that one</p>`
     :shown?`<p class="hfsay teach">This one \u2014 listen once more</p>
       <button class="wallbtn quiet" data-refl="${ix}">see this letter</button>`:""}
   <div class="lower">
    <button class="hearbtn big${S.sqPick?"":" pulse"}" data-autoplay
      data-clip="letters/sound-${pad(ix,2)}.mp3">
      <span class="bars"><i></i><i></i><i></i></span>${S.sqPick?"again":"listen"}</button>
    ${got?`<button class="wallbtn good" data-sqgo>next \u203a</button>`:""}
   </div>
  </div>`,S.sqI,items.length,true);
}

/* ---- the same sound, held ---- */
const VPAIRS=["a","e","i","o","u"];
/* the vowel, found inside a word */
function vowInWord(){
 const i=Math.min(S.viI||0,VINW.length-1), Q=VINW[i], t=tok(Q.w),
  got=S.viGot===i, last=i>=VINW.length-1;
 sayNow("The same sound, now inside a word. Find it.");
 return wrap(`<div class="vlen">
   <p class="grownup">grown-up: say <b class="ff">${esc(Q.w)}</b>, slowly</p>
   <p class="rhyme">find the <b class="ff">${esc(Q.v)}</b></p>
   <div class="viw">${t.map(function(ch,j){
     const right=ch===Q.v;
     const cls=got&&right?" hit":(S.viMiss===j?" miss":"");
     return `<button class="viwl ff${cls}" data-viw="${j}">${esc(ch)}</button>`}).join("")}</div>
   <div class="lower">
    ${(function(cl){ return cl?`<button class="hearbtn big" data-clip="${esc(cl)}">
      <span class="bars"><i></i><i></i><i></i></span>hear the word</button>`:"" })(vinwClip(Q.w))}
    ${got?`<p class="rhyme">the <b class="ff">${esc(Q.v)}</b> you heard is in there</p>
      <button class="wallbtn good" data-viwnext>${last?"done \u2713":"next \u203a"}</button>`:""}
   </div>
  </div>`,i,VINW.length,true);
}

function vowLength(){
 const i=Math.min(S.vlI||0,VPAIRS.length-1), v=VPAIRS[i], ix=LIX[v];
 const seen=(S.vlSeen&&S.vlSeen[v])||{};
 const both=seen.s&&seen.l, last=i>=VPAIRS.length-1;
 sayNow("Tap the short one, then the long one. Say them with it.");
 return wrap(`<div class="vlen">
   <p class="grownup">grown-up: say <b class="ff">${esc(v)}</b>, then hold it —
     <b class="ff">${esc(v+v)}</b></p>
   <div class="vlrail">${VPAIRS.map(function(x,k){
     const dn=S.vlSeen&&S.vlSeen[x]&&S.vlSeen[x].s&&S.vlSeen[x].l;
     return `<button class="vlchip ff${k===i?" on":""}${dn?" done":""}"
       data-vlgo="${k}">${esc(x)}</button>`}).join("")}</div>
   <div class="vlpair">
    <button class="vlcard${seen.s?" heard":""}${S.vlJust==="s"?" just":""}" data-vlsay="s" data-vl="${esc(v)}">
      <span class="vlw ff">${esc(v)}</span>
      <span class="vlbar"><i style="width:26%"></i></span>
      <span class="vll">short</span></button>
    <button class="vlcard${seen.l?" heard":""}${S.vlJust==="l"?" just":""}" data-vlsay="l" data-vl="${esc(v)}">
      <span class="vlw ff">${esc(v+v)}</span>
      <span class="vlbar"><i style="width:96%"></i></span>
      <span class="vll">long</span></button>
   </div>
   <p class="rhyme">one sound. the long one is the same one, held</p>
   <p class="grownup">The doubled letter is the whole mark \u2014 it is what every book
     prints, and it never fails. Say the short one, then hold the long one, and let
     them hear the difference. <b>fira</b> and <b>fiira</b> are two words.</p>
   ${both?`<button class="wallbtn good" data-vlnext>next \u203a</button>`
     :`<p class="waitline">tap both to go on</p>`}
  </div>`,i,VPAIRS.length,true);
}

/* ---- v201: the check that belongs beside the teaching ----
   Long against short was taught at Dagana and not asked for again until Matam,
   nine stops later. The distance is right for the ear test \u2014 retrieval at a
   distance is the only kind that lasts, and Matam sits where it does because
   the stop after it is doubled CONSONANTS, which is the same idea again.
   What was missing was the immediate check: two questions, on the card the
   teaching just finished on, while it is still in front of the child.
   The two ask different things on purpose. This one asks about the MARK \u2014
   which of these two words holds the vowel \u2014 and is answerable by looking,
   because "the doubled letter is the whole mark" is what the card just said
   and what a book will always show. Matam asks by ear. Teach the mark, check
   the mark, then hear the difference later. */
const VCHK=[{k:0,v:"i"},{k:1,v:"a"}];
function markVow(w,v){
 const m=String(w).match(new RegExp("^(.*?)("+v+"+)(.*)$"));
 if(!m) return esc(w);
 return esc(m[1])+'<b class="vv">'+esc(m[2])+'</b>'+esc(m[3]);
}
function vowCheck(){
 const i=Math.min(S.vcI||0,VCHK.length-1), q=VCHK[i], pr=PAIRS[q.k];
 const shortW=pr[0], longW=pr[1];
 /* the long one is not always on the same side, or it stops being a question */
 const order=i%2?[longW,shortW]:[shortW,longW];
 const pick=S.vcPick, right=pick===longW, last=i>=VCHK.length-1;
 sayNow("Two words. One holds its vowel. Find the long one.");
 return wrap(`<div class="vlen vchk">
   <p class="grownup">grown-up: say <b class="ff">${esc(shortW)}</b>, then
     <b class="ff">${esc(longW)}</b> \u2014 two different words</p>
   <h3 class="tkt">which one holds the <b class="ff">${esc(q.v)}</b>?</h3>
   <div class="vlpair">${order.map(function(wd){
     const chosen=pick===wd;
     return `<button class="vlcard vcw${chosen?(wd===longW?" right":" wrong"):""}"
       data-vc="${esc(wd)}"${right?" disabled":""}>
       <span class="vlw ff">${markVow(wd,q.v)}</span>
       ${""/* the bars would answer the question for them: they fill in only
            once the child has chosen, as the confirmation */}
       <span class="vlbar"><i style="width:${right?(wd===longW?96:26):0}%"></i></span>
       <span class="vll">${right?(wd===longW?"long":"short"):"\u00a0"}</span>
      </button>`}).join("")}</div>
   ${right?`<p class="rhyme">yes \u2014 two of them, so it is held</p>`
     :pick?`<p class="rhyme">that one says it once. look for two the same</p>`
     :`<p class="rhyme">the long one is written twice</p>`}
   <div class="lower">
    <button class="hearbtn big" data-clip="pairs/p${pad(q.k,2)}b.mp3">
     <span class="bars"><i></i><i></i><i></i></span>listen</button>
    ${right?`<button class="wallbtn good" data-vcnext>${last?"done \u2713":"next \u203a"}</button>`:""}
   </div>
  </div>`,i,VCHK.length,true);
}

/* ---- meeting a letter ----
   Present it with its sound, nudge, then let the child press it three times.
   Each press replays the sound and the letter JUMPS to a new spot — it never
   travels. Chasing a moving letter trains the eye to track motion, which is a
   different skill from recognising a shape, and it is actively wrong for ɓ
   against b where the task is to hold still and look at a hook. For the same
   reason the nudge is a gentle swell, not a wobble: a child learning ƴ must
   never see it tilted, because they do not yet know which parts of the shape
   are the letter and which are the animation. */
const SPOTS=[[50,26],[20,44],[78,44],[34,68],[66,70],[50,50],[16,22],[82,24]];
const PRESSES=3;
/* the letter on screen is the instrument: pressing it plays it */
/* ---- v198: the found-thing moment, shared by charms and stories ----
   Two collectibles that behave the same should look the same. Both go through
   here: the band names the kind, the disc holds the thing, and the same fly
   into the satchel ends it. Tapping anywhere ends it early, because the second
   time a child sees an animation they want it over. */
function prizeShow(kind,glyph,ff,title,sub){
 const w=document.createElement("div");
 w.className="przwrap";
 let sp="";
 [[-96,-64],[92,-72],[-104,52],[100,44],[-16,-118],[22,116]].forEach(function(d){
  sp+='<span class="przsp" style="--dx:'+d[0]+'px;--dy:'+d[1]+'px;animation-delay:'
   +(0.06*Math.random()+0.12).toFixed(2)+'s"></span>';
 });
 w.innerHTML='<div class="przburst"></div>'+sp
  +'<div class="prize"><span class="rib">'+kind+'</span>'
  +'<span class="disc"><span class="cg'+(ff?" ff":"")+'">'+glyph+'</span></span>'
  +(title?'<b>'+title+'</b>':'')+(sub?'<small>'+sub+'</small>':'')+'</div>';
 document.body.appendChild(w);
 S.justGot=true;
 return w;
}
/* it shrinks into the bag it is going into — the one bit of the old charm
   animation worth keeping, now used by everything */
function prizeFly(w){
 const el=w.querySelector(".prize"); if(!el) return;
 if(w.dataset.flown) return; w.dataset.flown="1";
 w.style.background="transparent";
 const b=w.querySelector(".przburst"); if(b) b.style.opacity="0";
 w.querySelectorAll(".przsp").forEach(function(x){ x.style.display="none" });
 const sat=document.querySelector(".tbtn.sat");
 el.style.animation="none";                    /* fill:both would win otherwise */
 if(sat){
  const to=sat.getBoundingClientRect(), r=el.getBoundingClientRect();
  el.style.transition="transform .7s cubic-bezier(.4,0,.2,1),opacity .7s ease";
  el.style.transform="translate("+((to.left+to.width/2)-(r.left+r.width/2)).toFixed(0)
   +"px,"+((to.top+to.height/2)-(r.top+r.height/2)).toFixed(0)+"px) scale(.16) rotate(10deg)";
  el.style.opacity=".15";
  sat.classList.add("caught");
  setTimeout(function(){ sat.classList.remove("caught") },760);
 } else { el.style.transition="opacity .4s ease"; el.style.opacity="0" }
}
/* a tap anywhere skips the wait. once: the waiting timer fires later whatever
   happens, and a `then` that continues a flight must not be run twice. */
function prizeSkip(w,done){
 w.addEventListener("click",function(){ prizeFly(w); setTimeout(done,620) },{once:true});
}
function prizeOnce(w,done){
 return function(){ if(w.dataset.done) return; w.dataset.done="1"; done(); };
}

/* ---- a story goes in the bag ----
   A child who reads a tale and then finds themselves back on the road has no
   sign that anything was kept. The story flies into the satchel and the bag
   jumps, which is the whole of the reward: you went somewhere, you came back
   with something, and you can see where it went. */
function tuckStory(){
 if(!S.tuck) return;
 const icon=S.tuck, kind=S.tuckL||"a story", title=S.tuckT||"";
 S.tuck=null; S.tuckL=null; S.tuckT=null;
 const w=prizeShow(kind,icon,false,esc(title),"kept in your bag");
 try{ sWin(); }catch(e){}
 const done=prizeOnce(w,function(){ w.remove() });
 prizeSkip(w,done);
 setTimeout(function(){ prizeFly(w); setTimeout(done,720) },1250);
}

/* ---- the instruction says itself ----
   A child who cannot read "Listen. Then tap the letter you heard." has to
   discover that the gold button is a button before the activity can even
   begin. So the sound plays on its own when a question arrives — once, and
   only once per question; the button stays for hearing it again. */
let AUTOP=null;
function autoSay(){
 const el=document.querySelector("[data-autoplay][data-clip]"); 
 if(!el){ AUTOP=null; return; }
 const key=S.act+"|"+S.progI+"|"+el.dataset.clip;
 if(AUTOP===key) return;
 AUTOP=key;
 setTimeout(function(){
  const now=document.querySelector("[data-autoplay][data-clip]");
  if(now && AUTOP===key) play(now,now.dataset.clip);
 },430);
}
function playLetter(){
 try{
  const c=SQ[S.sqChunk]; if(!c) return;
  const q=c.q, k=Math.min(S.sqM,q.length-1), ix=LIX[q[k][0]];
  const el=document.querySelector("[data-press]")||document.querySelector(".jletter");
  if(el) play(el,"letters/sound-"+pad(ix,2)+".mp3");
 }catch(e){}
}

function meetView(ci,c){
 const q=c.q, k=Math.min(S.sqM,q.length-1), tgt=q[k][0], ix=LIX[tgt];
 const L=LETTERS[ix], coat=meetCoat(k), want=coat?L[1]:L[0];
 const p=S.sqPress||0, doneP=p>=PRESSES;
 const at=SPOTS[(ci*5+k*3+p*3)%SPOTS.length];

 /* A letter here has two different things attached to it and they had been
    run together. Its NAME is aa, baa, caa — what you call it when you recite
    the alphabet. Its SOUND is a, b, c — what it does inside a word, and the
    only one of the two that the syllable machine, the pairs and every word in
    this course are built on. The recordings already keep them apart:
    letters/name-NN.mp3 against letters/sound-NN.mp3. The written lines did
    not, so a child met b and was then asked for baa, and at the vowels it was
    worse than untidy — "say aa" for the letter a states a length contrast
    that is real, meaningful and the opposite of what was wanted.
    The sound leads everywhere the child is reading or listening. The name is
    still here, said once, labelled as the name. */
 sayNow(doneP
   ? `That is ${L[1]}. Hear it again, or go on.`
   : p===0 ? `This is ${L[1]}. Press it to hear it.`
   : `Again \u2014 press ${L[1]}.`);

 /* No sound button above the letter. It said the same thing twice — pressing
    the letter has always played it — and it took the height that the two
    choices below now need. */
 return wrap(`<div class="meet">
   <p class="grownup">grown-up: it says <b class="ff">${esc(L[1])}</b>
     <span class="nameis">${esc(LEX.name.f)}: ${esc(L[2])}</span></p>
   <div class="jfield">
    <button class="jletter ff${p===0?" nudge":""}${doneP?" settled":""}"
      style="left:${at[0]}%;top:${at[1]}%" data-press>${esc(want)}</button>
    ${Array.from({length:PRESSES}).map(function(_,i){
      return `<i class="pdot${i<p?" on":""}" style="left:${50+(i-1)*9}%"></i>`}).join("")}
   </div>
   ${doneP?`<div class="twoway">
      <button class="tw again" data-meetagain aria-label="hear it again">
       <span class="bars"><i></i><i></i><i></i></span></button>
      <button class="tw on" data-meetnext>next \u203a</button>
     </div>`
    :`<p class="meetsay">${p===0?"press the letter":`${PRESSES-p} more`}</p>`}
  </div>`,S.sqM,q.length,true);
}

/* ---- four animals, each of which only eats its own kind ----
   The boxes were labelled VOWELS, NASALS, TWO-LETTER and PLAIN. Three of
   those are grammar words a six-year-old does not have, so the child was
   sorting by a label they could not read into a category nobody had taught
   them, and nothing at all happened when they got it right. Each box is an
   animal now, and each animal says in a picture what its label was trying to
   say in a word: the bird can hold its sound and sing it, the elephant does
   its through the nose, the camel has two of everything, and the goat eats
   whatever is left over. The linguistic names live in the grown-ups drawer,
   which is where they were always meant to be.
   A refused letter is spat back rather than parked in the box in pink. The
   pile in front of an animal is now only ever correct — which is the whole
   reason it is worth showing at the end. */
/* ---- v202: the mark shows the rule, instead of standing for it ----
   A bird had nothing to do with a vowel and a camel's humps had nothing to do
   with letters \u2014 both were a second thing to learn before the first one could
   be understood, and a child who does not get the joke gets nothing at all.
   Each kind now carries a small picture of ITSELF, made of letter tiles:
   one tile with the sound running on after it, one tile on its own, two tiles
   bracketed together into one. Nothing to decode. */
function kindMark(k){
 if(k==="V") return '<span class="km v"><i class="kt">a</i>'
  +'<span class="khold"><b></b><b></b><b></b></span></span>';
 if(k==="S") return '<span class="km s"><i class="kt">b</i></span>';
 return '<span class="km p"><i class="kt">n</i><i class="kt">g</i>'
  +'<span class="kjoin"></span></span>';
}
const PENS={V:{g:kindMark("V"),n:"one sound \u2014 you can hold it"},
            S:{g:kindMark("S"),n:"one letter \u2014 one sound"},
            P:{g:kindMark("P"),n:"two letters \u2014 still one sound"}};
const PENK=["V","S","P"];
const GTEACH=[
 {k:"V", t:"You can hold these and sing them", items:GVOW,
  clip:function(x){ return "letters/long-"+pad(LIX[x],2)+".mp3" },
  why:"a vowel keeps going for as long as your breath does"},
 {k:"S", t:"One letter, one sound", items:["b","d","f","l","m","n","s","t"],
  clip:function(x){ return "letters/sound-"+pad(LIX[x],2)+".mp3" },
  why:"most letters are like this — you see one, you say one"},
 {k:"P", t:"Two letters, but only one sound", items:GDI,
  word:function(x){ return LETTERS[LIX[x]][3] },
  clip:function(x){ return "letters/word-"+pad(LIX[x],2)+".mp3" },
  why:"they never come apart — inside a word they are still one sound"}];
const BR_PER=3;                                  /* planks earned per group */
const BR_ALL=BR_PER*GTEACH.length;               /* nine, then the far bank */

/* the sound a plank asks for. If that clip is known to be absent the letter is
   shown instead, so the crossing degrades to matching and never dead-ends. */
/* ---- v200: a listening test needs something to listen to ----
   The letter recordings do not exist yet, so every child met the fallback:
   the letter printed above a grid containing that same letter, under "find
   this one". That is not a test, it is a matching game with one move, and it
   was the wrong shape for the screen as well \u2014 this stop is about the three
   KINDS of letter, not about letter recognition.
   While a group has no sound, the planks are earned by meeting the letters
   instead: press three you have not pressed, and you are across. Nothing is
   pretended. The moment the clips land the listening question returns on its
   own, because this reads AUDIO.missing rather than a setting. */
function brSilent(T,i){
 if(!S.gTP) return false;
 const tried=T.items.filter(function(x){ return S.gTP[i+"|"+x] });
 if(!tried.length) return false;
 return tried.every(function(x){
   try{ return !!AUDIO.missing[clipPath(T.clip(x))] }catch(e){ return false } });
}
function brHeard(T,i){
 if(!S.gTP) return 0;
 return T.items.filter(function(x){ return S.gTP[i+"|"+x] }).length;
}
function brPick(T,i){
 const pool=T.items.filter(function(x){ return x!==S.brAsk });
 return pool[Math.floor(Math.random()*pool.length)]||T.items[0];
}
/* the bridge is drawn by both the teaching cards and the digraph stop */
function bridgeHTML(laid){
 const at=BR_ALL?(laid/BR_ALL*100):0;
 return `<div class="bridge">
   <span class="bank near">\ud83c\udf3e</span><span class="bank far">\ud83c\udfe0</span>
   <div class="span">${Array.from({length:BR_ALL},function(_,k){
     return `<i class="plank${k<laid?" laid":k===laid?" now":""}"></i>`}).join("")}</div>
   <span class="walker" style="left:${at}%">${avaHTML()}</span>
   <div class="cross">${laid} of ${BR_ALL} across</div>
  </div>`;
}

/* ---- v202: two letters, one sound \u2014 taught, then hunted ----
   Four cards with a word printed small underneath was not teaching anything:
   the child never had to do anything with the pair, and nothing on the screen
   ever separated the two letters from the one sound they make. So the group
   is now two things. First the pair is pulled out of a real word, one word at
   a time, with the tiles bracketed underneath so the eye sees two shapes and
   the ear is told there is one sound. Then they are hunted: twelve letters,
   four of them written with two, find all four. Hunting is the only thing
   here that proves a child can tell the difference. */
const DIGR=[{d:"mb",w:"mbabba",en:"a donkey"},{d:"nd",w:"ndaarugol",en:"to look"},
            {d:"ng",w:"ngaari",en:"a bull"},{d:"nj",w:"njaareendi",en:"sand"}];
/* the singles are the halves themselves, so the hunt cannot be won by shape */
const HUNT=["m","mb","d","n","nd","b","ng","g","p","nj","t","k"];
function digraphStop(){
 const found=S.diFound||{}, nF=Object.keys(found).length;
 const laid=(GTEACH.length-1)*BR_PER+Math.min(nF,BR_PER);
 if((S.diPhase||"meet")!=="hunt"){
  const i=Math.min(S.diI||0,DIGR.length-1), D=DIGR[i], last=i>=DIGR.length-1;
  sayNow("Two letters standing together for one sound. Say the word, then the sound on its own.");
  return wrap(`<div class="pens gteach digr">
    ${bridgeHTML(laid)}
    <h3 class="tkt">two letters, one sound</h3>
    <div class="diword ff"><b>${esc(D.d)}</b>${esc(D.w.slice(D.d.length))}</div>
    <p class="digl">${esc(D.en)}</p>
    <div class="ditiles">
     <span class="km p big"><i class="kt">${esc(D.d[0])}</i><i class="kt">${esc(D.d[1])}</i>
      <span class="kjoin"></span></span>
     <span class="diar">\u2192</span>
     <span class="dione ff">${esc(D.d)}</span>
    </div>
    <p class="rhyme">they never come apart \u2014 one sound, not two</p>
    <div class="lower">
     <button class="hearbtn big" data-clip="letters/word-${pad(LIX[D.d],2)}.mp3">
      <span class="bars"><i></i><i></i><i></i></span>listen</button>
     <button class="wallbtn good" data-dinext>${last?"now find them \u203a":"next \u203a"}</button>
    </div>
    <div class="wmnav solo nb"><span class="pos">${i+1} of ${DIGR.length}</span></div>
   </div>`,laid,BR_ALL,true);
 }
 const all=nF>=DIGR.length;
 sayNow("Four of these are written with two letters. Find them all.");
 return wrap(`<div class="pens gteach hunt">
   ${bridgeHTML(laid)}
   <h3 class="tkt">${all?"all four found":"find the ones written with two letters"}</h3>
   <div class="hgrid${nF?"":" nudge"}">${HUNT.map(function(x){
     return `<button class="tk ff${found[x]?" got":""}${S.diMiss===x?" no":""}"
       data-dihunt="${esc(x)}">${esc(x)}</button>`}).join("")}</div>
   <p class="rhyme">${S.diMiss?`<b class="ff">${esc(S.diMiss)}</b> is one letter \u2014 look for two`
     :`${nF} of ${DIGR.length} found`}</p>
   ${all?`<div class="lower"><button class="wallbtn good" data-hdone>across \u203a</button></div>`:""}
  </div>`,laid,BR_ALL,true);
}

function gteach(){
 const i=Math.min(S.gT||0,GTEACH.length-1), T=GTEACH[i];
 if(T.k==="P") return digraphStop();
 if(!S.gTP) S.gTP={};
 const key=function(x){ return i+"|"+x };
 const heard=T.items.filter(function(x){ return S.gTP[key(x)] }).length;
 const sil=brSilent(T,i);                        /* no clips for this group */
 const planks=sil?Math.min(heard,BR_PER):(S.brP||0), laid=i*BR_PER+planks;
 const ready=!sil && heard>=3;                   /* listen a little first */
 /* ---- v199: the question belongs to the group on screen ----
    The third correct answer advances the group on a 620ms delay, but the
    handler renders once immediately as well — and that render, still on the
    old group with brAsk cleared, picked a fresh question from the OLD list.
    620ms later the group changed underneath it, so the child arrived at
    "one letter, one sound" being asked to find a vowel that was nowhere on
    the screen. Checking membership rather than emptiness also repairs any
    saved game already stuck in that state. */
 if(ready && !S.brRight && (!S.brAsk || T.items.indexOf(S.brAsk)<0)){ S.brAsk=brPick(T,i) }
 const asking=ready && S.brAsk;
 const clip=asking?T.clip(S.brAsk):null;
 const silent=asking && AUDIO.missing[clipPath(clip)];
 sayNow(asking
  ?"A sound plays. Find the letter that made it \u2014 a wrong tap just plays that letter."
  :sil?"No recordings for these yet. Press each one and say it for them \u2014 three lays the planks."
  :"Press the letters and listen. Nothing to answer yet.");
 /* v202: the letters are the thing on this screen, so they are the biggest
    thing on it, they sit in the middle, and while none has been pressed they
    lift gently one after another. The moment one is pressed they hold still —
    an animation that carries on after it has been obeyed is just noise. */
 return wrap(`<div class="pens gteach">
   ${bridgeHTML(laid)}
   <div class="tkind"><span class="pg">${PENS[T.k].g}</span>
     <span class="pn">${esc(PENS[T.k].n)}</span></div>
   <h3 class="tkt">${esc(T.t)}</h3>
   <div class="tgrid big${heard?"":" nudge"}">${T.items.map(function(x){
     const got=S.gTP[key(x)];
     return `<button class="tk ff${got?" got":""}${S.brRight===x?" right":""}" data-gt="${esc(x)}"
       data-gtclip="${esc(T.clip(x))}">${esc(x)}</button>`}).join("")}</div>
   <p class="rhyme">${esc(T.why)}</p>
   <div class="lower">
    ${asking&&!silent?`<p class="aq">which one was that?</p>
      <button class="hearbtn big" data-clip="${esc(clip)}">
       <span class="bars"><i></i><i></i><i></i></span>listen</button>`
     :`<p class="waitline">${sil
        ?`press ${Math.max(0,BR_PER-heard)} more to lay the next plank`
        :`press ${Math.max(0,3-heard)} more to start crossing`}</p>`}
   </div>
   <div class="wmnav solo nb"><span class="pos">${i+1} of ${GTEACH.length}</span></div>
  </div>`,laid,BR_ALL,true);
}
function penAte(round,k){ return round.filter(function(x){ return S.gput[x[0]]===k }) }

function gpens(){
 if((S.gPhase||"teach")!=="sort") return gteach();
 const rounds=chunk(GITEMS,8), round=rounds[S.gRound]||[];
 const left=round.filter(function(x){ return !(x[0] in S.gput) });
 if(!left.length) return gfeast(rounds,round);
 sayNow(S.gsel?"Now give it to the one who eats it."
   :"Pick a letter, then give it to the one who eats it.");
 return wrap(`<div class="pens">
   <div class="plitters">${left.map(function(it){
     const l=it[0];
     return `<button class="key ff pl${S.gsel===l?" on":""}${S.gmiss===l?" spat":""}"
       data-g="${esc(l)}">${esc(l)}</button>`}).join("")}</div>
   <div class="penrow">${PENK.map(function(k){
     const mine=penAte(round,k);
     return `<button class="pen${S.gsel?" hungry":""}${S.gfed===k?" chew":""}${S.gno===k?" no":""}"
       data-gbin="${k}">
       <span class="pg">${PENS[k].g}</span>
       <span class="pn">${esc(PENS[k].n)}</span>
       <span class="pate">${mine.map(function(x){
         return `<i class="ff">${esc(x[0])}</i>`}).join("")}</span>
      </button>`}).join("")}</div>
  </div>`,S.gRound,rounds.length,true);
}

/* ---- what each of them ate ----
   The pile is read back as a pile: the letters an animal took, shown together
   and said one after another. A group heard as a group is the thing the
   sorting was for — without this the activity ends the moment the last letter
   lands, and the child never hears what they have just built. */
function gfeast(rounds,round){
 const last=S.gRound>=rounds.length-1;
 sayNow("Tap an animal to hear everything it ate.");
 return wrap(`<div class="feast">
   <div class="fbig">${last?"🏆":"🍽️"}</div>
   <h2>${last?"Every letter sorted":"Round "+(S.gRound+1)+" — everyone is fed"}</h2>
   ${PENK.map(function(k){
     const mine=penAte(round,k);
     if(!mine.length) return "";
     return `<button class="fedrow${S.gheard&&S.gheard[k]?" heard":" wait"}" data-hearpen="${k}">
       <span class="pg">${PENS[k].g}</span>
       <span class="fl">${mine.map(function(x){
         return `<i class="ff">${esc(x[0])}</i>`}).join("")}</span>
       <span class="bars"><i></i><i></i><i></i></span></button>`}).join("")}
   <button class="wallbtn good" ${last?"data-gdone":"data-gnextround"}
     >next \u203a</button>
  </div>`,S.gRound+1,rounds.length,true);
}

/* ---- the sound machine, made to fit on a phone ----
   Three things were wrong. The board stood at a fixed 216px whether it held a
   syllable or two grey dashes, so an empty machine ate a third of the screen
   showing nothing. The 27 consonants ran six to a row, which is five rows, and
   pushed the vowels off the bottom — a child had to scroll away from the thing
   they were building in order to finish building it.
   And SHORT/LONG was a mode: a toggle sitting two rows above the vowels,
   silently rewriting them. Length is the hardest contrast in this book and the
   one thing that cannot be shown on paper, and a mode is the single worst
   shape for a contrast, because you can never see both halves at once. It is
   ten keys now, in two rows that line up — a directly above aa — so the
   difference is a thing to look at rather than a state to be in. Choosing aa
   IS choosing long; there is nothing else to set. */
/* ---- the first syllable of every word in the course ----
   280 sounds and no reason to care about any of them. Some of the 280 are the
   opening of a word the child already owns, and the machine can say so —
   which is the moment it stops being noise and starts being language. */
const SYLWORD=(function(){
 const m={};
 W2.forEach(function(w,i){
  const t=tok(w.sg||""); if(t.length<2) return;
  const c=t[0]; if(VOW.indexOf(c)>=0) return;      /* starts on a vowel */
  const v=t[1]; if(VOW.indexOf(v)<0) return;
  const key=c+((t[2]===v)?v+v:v);
  if(m[key]===undefined) m[key]=i;
 });
 return m;
})();
const CHALW=Object.keys(SYLWORD).map(function(k){return SYLWORD[k]});
/* one place builds a syllable's file name, so the press, the hear button and
   the warming can never disagree about which clip a syllable is */
let SYMFRESH=false;                 /* true only on the render that opens the sheet */
function sylPath(c,v,lng){ return `syl/c${ci(c)}v${vi(v)}${lng?'l':'s'}.mp3` }
function warmCons(c){
 if(!c) return;
 const l=[]; VOW.forEach(function(v){ l.push(sylPath(c,v,false)); l.push(sylPath(c,v,true)) });
 warmClips(l);
}
function noteSyl(){
 const c=S.cons,v=S.vow; if(!c||!v) return;
 const s=c+(S.long?v+v:v);
 if(!S.made) S.made=[];
 if(S.made.indexOf(s)<0){ S.made.push(s); if(S.made.length>16) S.made.shift(); }
