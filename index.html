/* ---- v204: one little word at a time ----
   Seven markers were all pressable from the first second, so the panel was a
   menu and there was nothing to finish. A marker now opens only when the one
   above it has been read all the way through — every word in its family — so
   arriving at the next one is something the child did rather than something
   that was already there. */
function jobSeenW(k){ return (S.jobSeenW||{})[k]||{} }
function jobDone(k){
 const g=JOBSET.filter(function(x){ return x.k===k })[0]; if(!g) return false;
 const seen=jobSeenW(k);
 for(let i=0;i<g.ws.length;i++){ if(!seen[i]) return false }
 return true;
}
function jobLocked(k){
 const i=JOBSET.map(function(g){ return g.k }).indexOf(k);
 if(i<=0) return false;
 return !jobDone(JOBSET[i-1].k);
}
function jobMark(k,i){
 if(!S.jobSeenW) S.jobSeenW={};
 if(!S.jobSeenW[k]) S.jobSeenW[k]={};
 S.jobSeenW[k][i]=1;
}
function jobSelK(){
 const k=S.jobSel;
 return JOBSET.some(function(g){ return g.k===k })?k:null;
}
function jobGrp(k){ return JOBSET.filter(function(g){ return g.k===k })[0]||JOBSET[0] }
/* ---- the display ----
   The 1 and its caption sit above a rule and never change. Below it the one
   thing being counted, its noun with the little word beside it, and a stepper.
   The stepper is what makes the panel legible as a panel: arrows and a
   position both say, without a word of any language, that there is more behind
   this and you are the one who moves it. */
/* "the buffalos", "the flys", "the doorway (way in or out)s" — a bolted-on s
   is wrong often enough to be worth four rules. A gloss with a bracket or a
   space in it is left alone; the four pictures already say plural. */
function enPl(en){
 if(en.indexOf("(")>=0) return en;                         /* the parenthetical gloss */
 if(en.indexOf(" ")>=0){ const p=en.split(" ");
  p[p.length-1]=enPl(p[p.length-1]); return p.join(" ") }   /* nail cutters */
 if(/[^f]fe?$/.test(en)) return en.replace(/fe?$/,"ves");   /* knives, leaves, not girafves */
 if(/[^aeiou]y$/.test(en)) return en.slice(0,-1)+"ies";     /* flies */
 if(/(s|x|z|ch|sh)$/.test(en)) return en+"es";
 return en+"s";
}
function jobDisp(){
 const k=jobSelK();
 if(!k) return `<div class="jempty"><span class="jarrow">\u2039</span>
   <b>press a little word</b></div>`;
 const g=jobGrp(k);
 const n=g.ws.length, i=((S.jobW||0)%n+n)%n, w2=W2[g.ws[i]];
 const many=g.n>1;
 return `<div class="jqty${many?" many":""}">
   <span class="jgs">${Array.from({length:g.n}).map(function(){
     return `<span class="jg">${w2.g}</span>`}).join("")}</span>
   ${""/* the caption under the numeral said "one of it" / "two or more" in
        English, which is nothing to a child who does not read English. The
        numeral and the objects above it already say how many. Only the
        translation of a WORD is kept anywhere in the course. */}
   <span class="jn">${g.n}${many?"<i>+</i>":""}</span>
  </div>
  <span class="jrule"></span>
  <button class="jbody" data-jobsay="words/w${pad(g.ws[i],2)}-${g.f}.mp3"
    aria-label="hear ${esc(w2[g.f])}">
   <span class="jword"><b class="ff">${esc(w2[g.f])}</b>
     <b class="ff jm">${esc(k)}</b></span>
   <small class="jen">the ${esc(many?enPl(w2.en):w2.en)}</small></button>
  <div class="jstep${jobDone(k)?"":" fresh"}">
   <button data-jobw="-1" aria-label="Previous word">${BACKSVG}</button>
   <span class="jpos">${i+1} <i>/</i> ${n}</span>
   <button class="fwd" data-jobw="1" aria-label="Next word">${BACKSVG}</button>
  </div>`;
}
function jobFoot(all){
 const left=JOBSET.filter(function(g){ return !(S.jobSeen||{})[g.k] }).length;
 return all?`<button class="wallbtn good" data-jobdone>next \u203a</button>`
  :`<div class="jgate"><span class="jdots">${JOBSET.map(function(g){
     return `<i class="${(S.jobSeen||{})[g.k]?"on":""}" style="${mvars(g.k)}"></i>`
    }).join("")}</span><b>${JOBSET.length-left} / ${JOBSET.length}</b>
    <small>press every little word</small></div>`;
}
/* Same rule as the four cards: patch, never re-render. A rebuild would send
   the whole screen through its arrival animation on every press, and the word
   arriving in the panel is the one thing here that should move. */
function jobPress(){
 const list=document.querySelector(".joblist"); if(!list) return false;
 const keys=list.querySelectorAll(".jobkey"); if(!keys.length) return false;
 const k=jobSelK();
 keys.forEach(function(r){
  r.classList.remove("nudge");        /* v202: chosen, so they stop asking */
  const k2=r.dataset.jobpick, lk=jobLocked(k2);
  r.classList.toggle("lock",lk);      /* v204: finishing one opens the next */
  r.classList.toggle("full",jobDone(k2));
  if(lk) r.setAttribute("disabled",""); else r.removeAttribute("disabled");
  r.classList.toggle("on",r.dataset.jobpick===k);
  if(r.dataset.jobpick===k&&(S.jobSeen||{})[k]) r.classList.add("seen");
 });
 const disp=document.querySelector(".jobdisp");
 if(disp){ disp.setAttribute("style",mvars(k)); disp.innerHTML=jobDisp();
  try{ markLongVowels(disp) }catch(e){} }
 const foot=document.querySelector(".jobfoot");
 if(foot){
  const all=JOBSET.every(function(g){ return (S.jobSeen||{})[g.k] });
  const st=all?"go":"wait"+JOBSET.filter(function(g){ return !(S.jobSeen||{})[g.k] }).length;
  if(foot.dataset.st!==st){ foot.dataset.st=st; foot.innerHTML=jobFoot(all) }
 }
 try{ dockDoor() }catch(e){}
 return true;
}
function lsFoot(all){
 return all?`<p class="lsagain">press any of them again to hear it</p>
   <button class="wallbtn good" data-lsgo>next \u203a</button>`
  :`<p class="waitline">press all four</p>`;
}
/* ---- one card answers, not four ----
   render() rebuilds the page, and the doors inside every card carry the drop
   animation that every object in this course arrives with. So pressing ngal
   made all sixteen doors fall in again and the page fade with them: four cards
   answering a press meant for one, which reads as "all of these are the
   answer". A press on a card already on screen is therefore patched in place —
   the classes on the four cards and the line underneath — and the whole page
   is only rebuilt if that grid is not there to patch. */
function lsPress(k){
 const grid=document.querySelector(".lsgrid"); if(!grid) return false;
 const cards=grid.querySelectorAll(".lscard"); if(!cards.length) return false;
 let hit=null;
 cards.forEach(function(c){
  c.classList.remove("said");
  c.classList.remove("on");            /* v171: the shade does not linger */
  if(c.dataset.lsmeet===k){ hit=c; c.classList.add("on") }
 });
 if(!hit) return false;
 void hit.offsetWidth;              /* restart the flash on a repeat press */
 hit.classList.add("said");
 const foot=document.querySelector(".lsfoot");
 if(foot){
  const all=LITTLE.every(function(L){ return S.lsSeen[L.k] }), st=all?"go":"wait";
  if(foot.dataset.st!==st){ foot.dataset.st=st; foot.innerHTML=lsFoot(all) }
 }
 try{ dockDoor() }catch(e){}   /* v204: the way on arrives late here too */
 return true;
}
function lsPic(k,g,scale){
 const p2=LSPIC[k]||[1,48], n=p2[0], z=Math.round(p2[1]*(scale||1));
 return `<div class="lsobjs">${Array.from({length:n}).map(function(){
   return `<span class="obj" style="font-size:${z}px">${g}</span>`}).join("")}</div>`;
}
/* Which noun takes which little word is a fact about the word list, not
   something to type from memory: ndee belongs to jawre and naakoore, never to
   the mirror — ndaarorgal is an -al word and takes ngal like the rest. These
   four are read straight out of W2, so they cannot drift from the course. */
/* ---- the little words that say how many, grouped by the word ----
   This screen used to show only the singular markers, and every one of them
   put a 1 at the top of the panel. A number that never moves teaches nothing:
   you cannot learn what a variable means from a single value, and a child
   pressing five buttons and getting 1 five times has been shown that the 1 is
   furniture. The plural markers are here for that reason. Press ngal and the
   panel says one; press ɗee and it says four; the number is now the thing the
   button controls, which is the whole point of the little word.
   A family has to be a family to be visible, so a marker needs at least three
   nouns to earn a button — that keeps the eleven singular markers down to the
   five that are genuinely families and leaves ɓee, which has one noun, to the
   reference sheet. ngel and koy are deliberately absent: they would add
   smallness as a second variable, and the first screen at Tolo already teaches
   those two. One variable at a time is what makes the number readable. */
const JOBCAP=4;
const JOBSET=(function(){
 const g={sg:{},pl:{}}, o={sg:[],pl:[]};
 W2.forEach(function(w,i){
  [["sg",0],["pl",1]].forEach(function(f){
   const k=w.m[f[1]];
   if(!g[f[0]][k]){ g[f[0]][k]=[]; o[f[0]].push(k) }
   g[f[0]][k].push(i);
  });
 });
 const out=[];
 [["sg",1,"one of it"],["pl",2,"two or more"]].forEach(function(t){
  o[t[0]].filter(function(k){ return g[t[0]][k].length>=3 })
   .sort(function(a,b){ return g[t[0]][b].length-g[t[0]][a].length })
   /* v171: a family is shown, not enumerated. ngal had thirteen words behind
      it and ngol three, so pressing ngal opened a chore and pressing ngol
      opened a glance \u2014 the same button doing two different sized jobs. Four
      is the cap: enough that the marker is plainly not a label on one noun,
      few enough that a child reaches the end of every one of them.
      v172: the numeral under the marker counts what is actually there. It had
      said 13 while the stepper stopped at 1/4, which reads as a broken screen;
      the real family size is a fact for the grown-up drawer, not a promise to
      a child that nine more words are coming. */
   .forEach(function(k){ out.push({k:k,ws:g[t[0]][k].slice(0,JOBCAP),
     all:g[t[0]][k].length,f:t[0],n:t[1],l:t[2]}) });
 });
 return out;
})();
const JOBSPLIT=JOBSET.filter(function(x){ return x.f==="sg" }).length;
const LSQ=(function(){
 const out=[];
 for(let r=0;r<8;r++) out.push([r%LITTLE.length, FAMSIX[(r*2+1)%FAMSIX.length]]);
 return out;
})();
function littleset(){
 if(!S.lsSeen) S.lsSeen={};
 /* ---- four jobs, not four words ----
    A child who has just met four little words will reasonably think that is
    all of them. It is four JOBS: one of it, a little one, little ones, many of
    them. The job "one of it" has a dozen different words for it depending on
    which family the noun belongs to — ngal for a door, nduu for a dog, ndee
    for a mirror — and those are the seven stations later in Fuuta Jaloo. Said
    here, once, so the later stops are an expansion rather than a surprise. */
 return lsCards();
}
/* ---- v206: the seven families, on their own ----
   Two lessons were living in one stop. The four cards say what the four jobs
   ARE, on one noun, and belong at the front of the Fouta. The panel says that
   "one of it" is a job several different words do, and how many nouns each
   one covers \u2014 which cannot be shown until the nouns exist. So it is the
   last stop of the road rather than the second. */
function jobset(){
 {
  /* Five little words on the left, one display on the right, and the display
     is the only thing on the screen that moves. The words that take each
     marker live inside it, one at a time, so the child pages through ngal's
     thirteen and nduu's four and sees for themselves that a marker is a family
     rather than a label on one noun. The 1 never leaves the top: whichever
     marker is showing and whichever of its words, it is still one of them.
     The rows used to hold the nouns and an icon each. Both moved into the
     panel — if a thing is on both sides nothing arrives, and the panel is
     decoration rather than a display. */
  const sel=jobSelK(), seen=S.jobSeen||{};
  const all=JOBSET.every(function(g){ return seen[g.k] });
  sayNow(all?"The little word says how many. Press them again to see."
    :"Press a little word. Watch the number at the top change.");
  return `<div class="lset">
    <div class="jobwrap">
     <div class="joblist">${JOBSET.map(function(g,i){
       const pre=(i===JOBSPLIT?`<span class="jsplit" aria-hidden="true"></span>`:"");
        const lk=jobLocked(g.k), dn=jobDone(g.k);
       return pre+`<button class="jobkey${seen[g.k]?" seen":""}${sel===g.k?" on":""}${
         lk?" lock":(sel||i>0?"":" nudge")}${dn?" full":""}"
         style="${mvars(g.k)}" data-jobpick="${esc(g.k)}"${lk?" disabled":""}>
         <b class="ff">${esc(g.k)}</b><small>${g.ws.length}</small>
         ${lk?`<span class="jlock">\ud83d\udd12</span>`:""}</button>`}).join("")}</div>
     <div class="jobdisp${sel?"":" waiting"}" style="${mvars(sel)}"
      aria-live="polite">${jobDisp()}</div>
    </div>
    <div class="jobfoot" data-st="${all?"go":"wait"+JOBSET.filter(function(g){
      return !seen[g.k] }).length}">${jobFoot(all)}</div>
    <p class="rhyme">one for one \u2014 another for two or more</p>
   </div>`;
 }
}
function lsCards(){
 if(S.lsPhase!=="match"){
  const all=LITTLE.every(function(L){ return S.lsSeen[L.k] });
  sayNow(all?"Four little words, four meanings. Now match them."
    :"Press each little word. Look at what it means.");
  return `<div class="lset">
    <div class="lsgrid">${LITTLE.map(function(L){
      const w0=W2[FAMSIX[0]];
      /* v171: a card no longer keeps a shade once it has been visited. Four
         cards in four different states said "these are done, that one is
         live", which is a progress report - and it made the three unvisited
         ones look like the only pressable things left. All four sit in the
         same clean, inviting state; only the one being pressed lights up.
         What has and has not been met is still counted, quietly, by the dots
         under the grid. */
      return `<button class="lscard${S.lsSay===L.k?" on said":""}" style="${mvars(L.k)}"
