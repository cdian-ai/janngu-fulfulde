/* v216: the same corner says yes when the answer lands */
.gloss.aside.said{color:var(--leaf-deep);font-weight:700}
.wmpic.cheer{animation:cheerjump .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes cheerjump{0%,100%{transform:none}
  35%{transform:translateY(-16px) scale(1.12) rotate(-4deg)}
  65%{transform:translateY(0) scale(1.04)}}
.matched{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:20px;
  animation:przin .45s cubic-bezier(.2,1.5,.4,1) both}
.matched b{font-family:'FulSerif',serif;font-size:40px;color:var(--leaf-deep);line-height:1.1}
.matched .mtick{font-size:22px;color:var(--leaf-deep)}
/* v209: the same moment on the listening card — the phrase, whole, said again */
.matched.wide{margin-top:16px}
.matched.wide b{font-family:'FulSerif',serif;font-size:30px;color:var(--ink);
  line-height:1.2;text-align:center}
.matched.wide b .mk{color:var(--mk-deep)}
.matched.wide small{font-size:13px;color:var(--muted)}
.posline{margin-top:auto;padding-top:16px;width:100%}
@media (prefers-reduced-motion:reduce){.wmpic.cheer{animation:none}}
/* v204: on the finding card the picture IS the question, so it is the biggest
   thing on the screen and the answers sit well below it */
.hf.wmcard .wmpic{font-size:112px;padding:18px 0 4px}
/* v213: the check cards drew the thing at the old small size while the finding
   card had grown. One size for the object a question is about. */
/* v233: a picture at 104px pushed the word, the choices and the reason for
   the card below the fold on a phone. */
.hf .wmpic{font-size:72px;padding:6px 0 2px}
.hf.wmcard .gloss{font-size:15px}
.gloss{font-size:12.5px;color:var(--muted);margin-top:5px;text-align:center;
  letter-spacing:.01em}
/* the rhyme, said once, in the singular only */
.rhyme{font-size:11.5px;color:var(--amber-deep);margin:10px 0 0;text-align:center;
  letter-spacing:.01em}
.rhyme b{font-family:'FulSerif',serif;font-size:14px}
.wordbig .tail{color:var(--amber-deep)}
/* the little word sits on either side of the noun, and the book teaches both
   from its first page: Ngal alluwal — Alluwal ngal. In front it points the
   noun out, behind it holds it down. The primer calls the two positions
   jooporde and toɗɗorde; a child needs neither name, only to see both. */
.bothways{display:flex;gap:10px;justify-content:center;margin:11px 0 0}
.bothways span{flex:1;max-width:150px;background:var(--sunk);border-radius:12px;
  padding:8px 6px;font-family:'FulSerif',serif;font-size:15px;color:var(--unit)}
.bothways b{color:var(--amber-deep)}
.bothways em{display:block;font-family:'FulSans',sans-serif;font-style:normal;
  font-size:10.5px;color:var(--muted);margin-top:4px;letter-spacing:.03em}
/* word tiles are wider and quieter than letter tiles — a word is read, not seen */
.hfk.word{min-width:auto;min-height:62px;font-size:20px;padding:0 18px;
  color:var(--unit)}

/* the little word taught on its own, before it is asked for */
/* Seeing ngal after ngel one card apart is memory work; seeing them side by
   side in identical boxes is looking. The rail carries the whole set on every
   card, with the one being taught lit. */
/* Each little word keeps one colour wherever it appears — rail, big mark, chip
   and the tinted ending — so the colour is a second way of telling them apart
   for a child who has not yet learned to read the difference. ngal is amber
   everywhere; the rest take leaf, coral and plum in the order they are taught. */
/* v233: five little words in this rail on the stop that has five, and the
   first of them sat under the sound button. It clears it now, and the
   buttons are narrow enough that five fit a phone in one line. */
.mrail{display:flex;gap:6px;justify-content:center;margin:30px 0 14px;flex-wrap:wrap}
.mrail button{flex:0 1 auto;min-width:54px;box-sizing:border-box;text-align:center;
  padding:7px 7px;border:none;border-radius:11px;background:var(--sunk);color:#A9AEC2;
  font-family:'FulSerif',serif;font-size:15px;font-weight:700;cursor:pointer;
  min-height:42px;transition:transform .12s}
.mrail button:active{transform:scale(.94)}
.mrail button.seen{color:var(--mk-deep);background:var(--mk-soft)}
.mrail button.on{background:var(--mk);color:#241a06;box-shadow:0 3px 0 var(--mk-deep)}

/* One phrase on screen, big, and the marker walks round the word rather than
   two half-size versions sitting side by side where neither is being read. */
.turnc{display:block;width:100%;border:none;background:none;padding:6px 0 0;
  font:inherit;cursor:pointer;text-align:center}
.turnhint{display:inline-flex;align-items:center;gap:6px;margin-top:9px;padding:6px 13px;
  border-radius:999px;background:var(--sunk);color:var(--muted);font-size:11.5px}
.turnhint b{font-size:14px;color:var(--mk-deep)}
@keyframes walk{from{opacity:0;transform:translateX(var(--from)) scale(.9)}
  to{opacity:1;transform:none}}
.chipm.walked{animation:walk .34s cubic-bezier(.2,.9,.3,1) both}
.famrow{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:10px 0 0}
.famrow span{background:var(--sunk);border-radius:9px;padding:5px 10px;font-size:12.5px;
  color:var(--muted)}
.famrow b{font-family:'FulSerif',serif;font-size:14px;color:var(--ink)}
.bigmark{font-size:46px;color:var(--amber-deep);line-height:1.1;text-align:center;
  font-weight:600;letter-spacing:.01em}
.marksays{font-size:14px;color:var(--unit);margin:2px 0 10px;text-align:center;
  font-weight:600}
/* ---- v213: an empty slot has one shape in this course ----
   The blank chip was a flat grey box with a ? in it; the empty box in a phrase
   and the empty plaque are dashed sockets. Same job, so the same shape — a
   child should not have to learn twice that a dashed outline means "this is
   where the little word goes". */
.chipm.blank{background:var(--sunk);color:#A9AEC2;box-shadow:none;
  border:2px dashed rgba(0,0,0,.28)}
/* two words side by side: what holds, and what follows the word */
.cmp{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.cmp th{font-size:24px;padding:4px 6px;font-weight:400}
.cmp th:first-child{width:34%}
.cmp td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle;
  font-family:'FulSerif',serif;color:var(--unit)}
.cmp td.lbl{font-family:'FulSans',sans-serif;font-size:11.5px;color:var(--muted);
  letter-spacing:.02em}
.cmp td b{display:inline-block;min-width:56px;text-align:center}
.cmp tr.diff td b{color:var(--amber-deep)}
.cmp tr.same td b{color:#A9AEC2}
.cmp tr.same td{color:var(--muted)}


/* ================= v79 — the helicopter, and a longer view of the road =========
   Two changes to the road screen. The strip of the other Foutas is gone: once a
   child is inside a Fouta they stay in it, and the back arrow in the header is
   the way out. That space goes to the road, and the stops are drawn smaller and
   closer so three or four are on screen at once. And the traveller flies: a
   helicopter follows the road between stops and lands on the one they have
   reached, colouring the road in as it passes. */
.node{width:116px!important;gap:4px!important}
.node .disc{width:70px!important;height:70px!important;font-size:30px!important;border-width:3px!important}
.node.now .disc{width:84px!important;height:84px!important;font-size:36px!important}
.node.later .disc{width:60px!important;height:60px!important;font-size:25px!important}
.node.now .disc.ltr{font-size:42px!important}
.node.later .disc.ltr{font-size:28px!important}
.node .me{width:40px!important;height:40px!important;margin-left:-20px!important;top:-23px!important;font-size:20px}
.noderow{padding:0!important}
.noderow.l{padding-left:22px!important}.noderow.r{padding-right:22px!important}
.pnote{margin:0 0 8px!important}
.shead{margin:8px 0 6px!important}
.trail{padding:0 0 8px!important}
.road .rdb{stroke-width:28}
.road .rd{stroke-width:24}
.road .rdw{stroke-width:24}
.road .rdf{fill:none;stroke:var(--road);stroke-width:24;stroke-linecap:round;stroke-linejoin:round}

.heli{position:absolute;z-index:6;left:0;top:0;width:0;height:0;pointer-events:none}
.heli .hb{position:absolute;left:-26px;top:-44px;font-size:42px;line-height:1;
  filter:drop-shadow(0 6px 8px rgba(16,28,69,.25));animation:hov .9s ease-in-out infinite}
.heli .rot{position:absolute;left:-33px;top:-48px;width:66px;height:7px;border-radius:6px;
  background:rgba(16,28,69,.28);animation:rotor .16s linear infinite}
.heli .rope{position:absolute;left:-1px;top:-6px;width:2px;height:14px;background:rgba(16,28,69,.30)}
.heli .hme{position:absolute;left:-19px;top:8px;width:38px;height:38px;border-radius:50%;
  background:var(--surface);border:3px solid var(--gold);display:grid;place-items:center;
  font-size:19px;overflow:hidden;box-shadow:0 4px 10px rgba(120,80,10,.28);
  animation:sway 1.6s ease-in-out infinite}
.heli .hme img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.heli.land .hb{animation:none;transform:translateY(-12px);transition:transform .55s ease}
.heli.land .rot{opacity:.4;transition:opacity .55s}
.heli.land .hme{animation:none;opacity:0;transition:opacity .3s .08s}
.puff{position:absolute;z-index:5;left:0;top:0;width:0;height:0;pointer-events:none}
.puff::before,.puff::after{content:"\2728";position:absolute;font-size:21px;animation:sparkout .75s ease-out both}
.puff::before{left:-30px;top:-14px}
.puff::after{left:12px;top:-20px;animation-delay:.1s}
@keyframes rotor{0%{transform:scaleX(1)}50%{transform:scaleX(.12)}100%{transform:scaleX(1)}}
@keyframes hov{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes sparkout{0%{opacity:0;transform:scale(.4)}40%{opacity:1}100%{opacity:0;transform:scale(1.5) translateY(-16px)}}
@media (prefers-reduced-motion: reduce){
 .heli .rot,.heli .hb,.heli .hme,.puff::before,.puff::after{animation:none!important}
}

/* ---- v80: room above the road for the rotor, and no road ahead of the flight ---- */
.band{padding-top:52px!important}
.road .rdl{transition:opacity .45s ease}
.heli{will-change:left,top}

/* ---- v81: the road is drawn once and stays drawn; only new stretches fly ---- */
.road .rdb,.road .rd,.road .rdw{transition:none}

/* ---- v83: hear it again, or go on ----
   A teaching card has exactly two things a child can do next, and both now sit
   on the card, side by side, in the same place every time. The sound is on the
   left because that is what they came for; the way onward is on the right,
   filled in the Fouta's colour so it is plainly the door. Neither hides under
   the other, and a child who taps the letter a fourth time is not being
   punished for missing a button that was never where they were looking. */
.twoway{display:flex;gap:9px;width:100%;margin-top:13px}
.twoway .again{flex:0 0 84px}
.twoway .tw{flex:1 1 0;min-height:54px;border:none;border-radius:16px;cursor:pointer;
  font-family:'FulSans',sans-serif;font-size:13.5px;font-weight:700;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:7px;padding:0 8px;line-height:1.25}
.twoway .again{background:var(--gold-bg);color:var(--gold-deep)}
.twoway .on{background:var(--unit);color:#fff}
.twoway .tw:active{transform:scale(.97)}
.twoway .tw .ic{font-size:16px;line-height:1}

/* ---- v87: the options offer themselves, and the road says where to start ----
   A row of three grey squares looks like a caption until something moves. They
   now rise in turn, a beat apart, so the row reads as three things waiting to
   be pressed rather than three things printed on a card. It stops the moment
   one is chosen, and never runs for a child who has asked for less motion. */
.hfk.wait{animation:offer 2.6s ease-in-out infinite}
.hfk.wait:nth-child(2){animation-delay:.3s}
.hfk.wait:nth-child(3){animation-delay:.6s}
.hfk.wait:active{animation:none;transform:scale(.94)}
@keyframes offer{
  0%,66%,100%{transform:translateY(0);box-shadow:0 2px 5px rgba(16,28,69,.07)}
  76%{transform:translateY(-8px);box-shadow:0 10px 16px rgba(16,28,69,.13)}
  88%{transform:translateY(-2px);box-shadow:0 4px 8px rgba(16,28,69,.09)}}

/* where the helicopter set you down, when you have just arrived rather than
   walked here. A label pinned over one stop, not a banner across the road —
   it should be the size of the thing it is pointing at, and it leans to the
   side that stop sits on so the point lands on the disc. */
.signrow{display:flex;padding:8px 0 0}
.signrow.m{justify-content:center}
.signrow.l{justify-content:flex-start;padding-left:20px}
.signrow.r{justify-content:flex-end;padding-right:20px}
.startsign{position:relative;border:none;cursor:pointer;max-width:214px;
  border-radius:16px;padding:9px 16px 10px;font-family:'FulSans',sans-serif;
  background:linear-gradient(135deg,#E3A73A,#F3CB66);
  color:#3B2606;box-shadow:0 4px 12px rgba(120,86,12,.26);
  animation:signin .45s cubic-bezier(.2,1.5,.4,1) both, signbob 2.6s ease-in-out 1s infinite}
.startsign b{display:block;font-size:16.5px;letter-spacing:.01em;line-height:1.15}
.startsign small{display:block;font-size:11px;opacity:.72;margin-top:1px}
.startsign .arw{position:absolute;left:50%;bottom:-6px;
  transform:translateX(-50%) rotate(45deg);
  width:14px;height:14px;background:#F3CB66;border-radius:3px}
.signrow.l .startsign .arw{left:42px}
.signrow.r .startsign .arw{left:auto;right:42px}
@keyframes signin{0%{opacity:0;transform:translateY(-14px) scale(.9)}100%{opacity:1;transform:none}}
@keyframes signbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){
  .hfk.wait{animation:none}
  .startsign{animation:signin .01s both}}

/* ---- v89 ---- */
/* the sign beside the stop, pointing sideways at it */
.noderow.signed{align-items:center;gap:10px}
.startsign.l,.startsign.r{max-width:172px;flex:0 1 auto}
.startsign.r .arw{left:auto;right:-6px;top:50%;bottom:auto;
  transform:translateY(-50%) rotate(45deg)}
.startsign.l .arw{left:-6px;top:50%;bottom:auto;
  transform:translateY(-50%) rotate(45deg)}
.startsign.l b,.startsign.r b{font-size:15.5px}

/* ---- the listen button ----
   It was a wide amber bar with a word in it, which is the same shape as every
   other button in the course. This one is not a step forward, it is the sound
   itself, so it is now a block with the bars standing up inside it — a thing
   that looks like it makes a noise rather than one that takes you somewhere. */
.hearbtn.big{min-height:108px;min-width:138px;padding:0 30px;margin:8px 0 4px;
  flex-direction:column;gap:9px;border-radius:32px;border-bottom:none;
  background:linear-gradient(160deg,#FCE9C2,#F2CB77)!important;color:#6B4A12!important;
  box-shadow:0 7px 18px rgba(150,110,20,.2),inset 0 -4px 0 rgba(120,85,10,.1);
  font-size:14.5px;font-weight:800;letter-spacing:.07em}
.hearbtn.big:active{transform:translateY(3px);
  box-shadow:0 3px 9px rgba(150,110,20,.2),inset 0 -2px 0 rgba(120,85,10,.1)}
.hearbtn.big .bars{height:38px;gap:6px;align-items:center}
.hearbtn.big .bars i{width:7px;border-radius:4px;background:#C08D28}
.hearbtn.big .bars i:nth-child(1){height:18px}
.hearbtn.big .bars i:nth-child(2){height:38px}
.hearbtn.big .bars i:nth-child(3){height:25px}
.hearbtn.big.on .bars i{animation:bobbig .52s ease-in-out infinite}
.hearbtn.big.on .bars i:nth-child(2){animation-delay:.11s}
.hearbtn.big.on .bars i:nth-child(3){animation-delay:.22s}
@keyframes bobbig{0%,100%{height:14px}50%{height:38px}}

/* ---- the three choices ----
   Each gets its own quiet colour so the row reads as three separate things.
   Kept pale on purpose: the letter is what the child is meant to look at, and
   a strong colour behind it would be one more thing competing with the shape.
   Right, wrong and shown-answer states still win over the tint. */
.hfrow{gap:11px}
.hfk{min-width:86px;min-height:90px;font-size:38px;border-radius:22px}
.hfk:not(.hit):not(.miss):not(.show):nth-child(1){background:#E8F1EA;color:#2E5947}
.hfk:not(.hit):not(.miss):not(.show):nth-child(2){background:#E9EDF9;color:#333F79}
.hfk:not(.hit):not(.miss):not(.show):nth-child(3){background:#FAEFE2;color:#75521F}
.hfk:not(.hit):not(.miss):not(.show):nth-child(4){background:#F1EBF6;color:#553A70}
.hfk.word{min-height:74px;font-size:22px}

/* ---- v90: the way on wears the colour of being right ----
   Green already means "that one" everywhere in the course — the ring round a
   correct answer, the tick, the words under it. The button that follows a
   correct answer now says the same thing in the same colour, so a child reads
   the whole bottom of the card as one green result rather than a green answer
   and a grey instruction. Only buttons that appear after a right answer take
   it; nothing else in the course turns green. */
/* v171: .good on a door is now a no-op. The class is left on the markup so the
   history of each screen still reads, but the way on does not change colour
   according to how you arrived at it. */
.wallbtn.good{}

/* ---- v92: the picture arrives before it is named ---- */
.wmpic{padding:14px 0 6px}
.wmpic span{display:inline-block}
.wmpic.ent-walk,.wmpic.ent-fly,.wmpic.ent-parade{overflow:hidden}
.wmpic.ent-walk{animation:travelin 1.6s cubic-bezier(.3,.75,.35,1) both}
.wmpic.ent-walk span{animation:trot .32s ease-in-out 5 both}
.wmpic.ent-fly{animation:flyin 1.5s cubic-bezier(.35,.7,.35,1) both}
.wmpic.ent-fly span{animation:flap .21s ease-in-out 7 both}
.wmpic.ent-parade{animation:travelin 1.15s cubic-bezier(.3,.8,.35,1) both}
.wmpic.ent-parade span{animation:rock .29s ease-in-out 4 both}
.wmpic.ent-fall span{animation:leaffall 1.9s ease-in-out both}
@keyframes travelin{0%{transform:translateX(125%)}100%{transform:translateX(0)}}
@keyframes trot{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(-2deg)}}
@keyframes flyin{0%{transform:translate(130%,-34px)}55%{transform:translate(22%,22px)}
  100%{transform:translate(0,0)}}
@keyframes flap{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes rock{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes leaffall{
  0%{transform:translate(48px,-170px) rotate(-30deg);opacity:0}
  12%{opacity:1}
  34%{transform:translate(-42px,-104px) rotate(24deg)}
  58%{transform:translate(36px,-54px) rotate(-18deg)}
  80%{transform:translate(-16px,-12px) rotate(11deg)}
  100%{transform:translate(0,0) rotate(0)}}
.wordbig.reveal,.gloss.reveal{animation:namein .48s ease both}
@keyframes namein{0%{opacity:0;transform:translateY(9px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .wmpic,.wmpic span,.wordbig.reveal,.gloss.reveal{animation:none!important}}

/* ---- v94 ---- */
.wmnav.solo{justify-content:flex-start;gap:12px;margin-top:18px;padding-top:12px}
.wmnav.solo button{width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;
  justify-content:center;background:var(--tint,#F1F2F8);color:#4A5068}
.wmnav.solo button svg{width:21px;height:21px}
.wmnav.solo button:active{opacity:1;background:#E4E6F0}
.hfrow.reveal{animation:namein .48s ease both}

/* ---- v95: the story, in colour ---- */
.tale{background:none;box-shadow:none;padding:0}
.tbeat{position:relative;padding:16px 16px 15px 17px;border-radius:20px;margin:0 0 11px;
  border-top:none!important}
.tbeat + .tbeat{border-top:none}
.tbeat .bn{position:absolute;top:-9px;left:14px;min-width:24px;height:24px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;
  font-family:'FulSans',sans-serif;color:#fff;padding:0 7px}
.tbeat .ful{font-family:'FulSerif',serif;font-size:20px;line-height:1.45;margin-top:4px}
.tbeat .eng{font-size:13.5px;line-height:1.55;color:#4A5064;margin-top:10px;
  background:rgba(255,255,255,.72);border-radius:13px;padding:9px 12px}
/* v209: one story, one colour */
.tale.one{margin-top:2px}
.tale.one .tful{background:#E7F1EA;border-radius:20px;padding:16px 16px 14px}
.tale.one .tful p{font-family:'FulSerif',serif;font-size:20px;line-height:1.5;
  color:#255C44;margin:0 0 12px}
.tale.one .tful p:last-child{margin-bottom:0}
.tale.one .teng{background:rgba(255,255,255,.78);border:1px solid var(--line);
  border-radius:16px;padding:12px 14px;margin-top:10px}
.tale.one .teng p{font-size:13.5px;line-height:1.55;color:#4A5064;margin:0 0 8px}
.tale.one .teng p:last-child{margin-bottom:0}
.tbeat.c0{background:#E7F1EA} .tbeat.c0 .ful{color:#255C44} .tbeat.c0 .bn{background:#3C7C60}
.tbeat.c1{background:#E8ECF8} .tbeat.c1 .ful{color:#2F3B77} .tbeat.c1 .bn{background:#4A57A0}
.tbeat.c2{background:#FAEEE0} .tbeat.c2 .ful{color:#6F4C1B} .tbeat.c2 .bn{background:#A0762F}
.tbeat.c3{background:#F1EAF7} .tbeat.c3 .ful{color:#523870} .tbeat.c3 .bn{background:#75589A}
.way .storyhead .wicon{font-size:26px;width:56px;height:56px;border-radius:19px;
  display:flex;align-items:center;justify-content:center}

/* the listen-again on a find card sits under the choices, quiet and gold */
.againrow{display:flex;justify-content:center;margin-top:14px}

.findme.show{opacity:1;transform:none;pointer-events:auto}
.findme:active{transform:scale(.93)}

/* ---- v114 ---- */
/* the turn button keeps one colour, whichever little word is showing */
.turnbtn .tb-ic{background:#EDEFF7!important;color:#3B4270!important;
  box-shadow:0 4px 0 #C9CCDC,0 6px 14px rgba(16,28,69,.14)!important}
.turnbtn .tb-lb{color:#3B4270!important}

/* the picture arrives once, when the word does — not again on every turn */
.objs.still .obj{animation:none!important}

/* the marker travels across the word rather than reappearing on the far side */
.turnc{transition:opacity .3s ease}
.turnc.turning{opacity:.25}
.turnc.arrived .chipm.walked{animation:walkacross .78s cubic-bezier(.3,.05,.2,1) both}
@keyframes walkacross{
  0%{transform:translateX(var(--from)) scale(.9);opacity:0}
  22%{opacity:1}
  70%{transform:translateX(calc(var(--from) * -0.12)) scale(1.06)}
  100%{transform:none;opacity:1}}
.turnc.arrived .wordbig{animation:wordshift .78s cubic-bezier(.3,.05,.2,1) both}
@keyframes wordshift{0%{transform:translateX(calc(var(--from) * -0.32))}
  100%{transform:none}}

/* the picture on a find card is the sound button */
.wmpic.tappic{position:relative;border:none;background:none;cursor:pointer;
  width:100%;padding:14px 0 6px}
.wmpic.tappic .tapsay{position:absolute;right:calc(50% - 74px);top:16px;
  width:28px;height:28px;border-radius:50%;font-style:normal;font-size:15px;
  display:flex;align-items:center;justify-content:center;
  background:var(--gold-bg,#FBF0DC);color:var(--gold-deep,#8A6516);
  box-shadow:0 2px 6px rgba(120,86,12,.18)}
.wmpic.tappic:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){
  .turnc.arrived .chipm.walked,.turnc.arrived .wordbig{animation:none}}

/* ---- v115: room between a charm and the stop it lies near ---- */
.chrow{padding:5px 0}
.chrow.l{padding-left:34px}
.chrow.r{padding-right:34px}

/* ==================== v117 ====================
   Two changes, both of them the same idea: make the thing that moves be the
   thing you touch, and make it stop where the meaning is. */

/* ---- the little word travels between two boxes ----
   The turn button is gone. The marker lives in one of two sockets, one either
   side of the noun; the empty one breathes, and tapping it sends the marker
   across. The labels under the sockets never move, so THIS and THE are
   properties of the place rather than facts to be remembered. */
.turnc{display:block;width:100%;border:none;background:none;padding:8px 0 2px;text-align:center}
.phrase{display:flex;align-items:flex-start;justify-content:center;gap:8px;
  max-width:100%;padding:0 2px}
.dock{flex:0 0 auto;border:none;background:none;padding:0;margin:0;cursor:pointer;
  font:inherit;display:flex;flex-direction:column;align-items:center;gap:5px}
.dock .slot{display:block;box-sizing:border-box;min-width:60px;height:41px;border-radius:11px;
  border:2px dashed var(--mk,#C9CCDC);background:var(--mk-soft,#F1F2F8);
  animation:dockwait 1.9s ease-in-out infinite}
@keyframes dockwait{0%,100%{opacity:.55;transform:scale(1)}
  50%{opacity:1;transform:scale(1.06)}}
.dock .dl{font-family:'FulSans',sans-serif;font-size:10.5px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;color:#A2A7BC;line-height:1}
.dock.full .dl{color:var(--mk-deep,#4A5068)}
.dock.empty:active .slot{transform:scale(.94);animation:none}
.dock.full:active .chipm{transform:translateY(2px)}
.turnc .chipm{min-width:60px;font-size:20px;padding:6px 10px;
  background:var(--mk-soft)!important;color:var(--mk-deep)!important}
.pword{border:none;background:none;padding:0 1px;margin:0;cursor:pointer;
  font-family:'FulSerif',serif;font-weight:600;line-height:1.05;
  font-size:clamp(21px,7vw,38px);color:var(--mk-deep,#3A3F55);
  align-self:flex-start;margin-top:1px}
.turnc .gloss{font-size:15px;margin-top:11px}
@media (prefers-reduced-motion:reduce){.dock .slot{animation:none}}

/* the picture had a button standing next to it, so it sat off to one side of
   its own card; with the button gone it is centred again */
.picturn{justify-content:center!important;padding:0!important;gap:10px}
.picturn .objs{flex:0 1 auto!important}

/* ---- the helicopter stops for what is on the road ---- */
.heli.hover .hb{animation:hov .9s ease-in-out infinite}
.heli.hover .rope{height:30px;transition:height .45s ease}
.heli.hover .rot{animation-duration:.11s}

/* ==================== v118 ====================
   The tile says the letter's name, and the letter is the loud part of it. */
.hfk.name{font-size:31px;min-width:80px;padding:0 9px}
.hfk.name.long{font-size:25px;min-width:72px;padding:0 7px}
.hfk .lt{font-weight:700}
.hfk .lx{opacity:.42;font-weight:400}

/* ==================== v120 ====================
   A door on every card that only opens once the word has been both sides,
   a first card that is built up a piece at a time, and a sound machine
   that fits on a phone. */

/* the piece the walkthrough is currently asking for */
.tapme{cursor:pointer;animation:tapme 1.7s ease-in-out infinite}
@keyframes tapme{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.dock.idle{opacity:.34}
.dock.idle .slot{animation:none}
.waitline{font-family:'FulSans',sans-serif;font-size:13px;color:#9096AE;
  margin-top:15px;text-align:center}
@media (prefers-reduced-motion:reduce){.tapme{animation:none}}

/* ---- the sound machine ---- */
.symac{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.syout{font-family:'FulSerif',serif;font-size:44px;font-weight:600;color:var(--ink);
  line-height:1.05;min-height:50px;display:flex;align-items:center;justify-content:center}
.syout .dashes{color:rgba(27,46,107,.17);font-size:30px;letter-spacing:.1em}
.sytip{font-size:13px;color:var(--muted)}
.hearbtn.slim{padding:7px 17px;font-size:16px;min-height:0}
.crow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%;margin-top:2px}
.vpad{width:100%;display:flex;flex-direction:column;gap:6px;margin-top:3px;
  border-top:1px solid var(--line);padding-top:9px}
.vrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.key.ck{min-height:45px;font-size:17px;padding:0 2px}
.symac .key.v{min-height:47px;font-size:19px}

/* ==================== v121 ====================
   The walkthrough asked a child to tap a div. Every tap in this app is found
   with closest("button"), so those two steps were dead on arrival. */
.bare{border:none;background:none;padding:0;margin:0;font:inherit;color:inherit;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
button.bigmark{display:block;width:100%}
.picbtn{display:flex;justify-content:center;align-items:center;width:100%}

/* ==================== v122 ====================
   The name of a letter and the sound of a letter are two facts, and the
   second one is the one that reads. */
.lxt{width:100%;border-collapse:collapse;font-size:12px;margin:0 0 12px}
.lxt td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.lxt .lxf{font-family:'FulSerif',serif;font-weight:700;font-size:13.5px;white-space:nowrap}
.lxt .lxs{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.lxt .lxs.book{color:#2F6B45}
.lxt .lxs.derived{color:#8A5A12}
.lxt .lxu{color:#6C7186;font-size:11px}
.nameis{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;
  color:#A2A7BC;margin-top:3px;text-transform:none}

/* ==================== v123 ====================
   Four animals instead of four grammar words, a vowel and the same vowel
   held, and a machine that keeps what you made. */

/* ---- the pens ---- */
.pens{width:100%;display:flex;flex-direction:column;gap:12px}
.plitters{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;min-height:52px}
.key.pl{min-width:56px;min-height:50px;font-size:20px;padding:0 11px}
.key.pl.spat{animation:spat .42s ease}
@keyframes spat{0%,100%{transform:translateY(0)}30%{transform:translateY(-9px) rotate(-7deg)}
  60%{transform:translateY(-4px) rotate(6deg)}}
.penrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.pen{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 6px 8px;
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r-card);
  box-shadow:var(--shadow);cursor:pointer;min-height:96px;font:inherit}
.pen .pg{font-size:30px;line-height:1.1}
.pen .pn{font-family:'FulSans',sans-serif;font-size:10.5px;font-weight:700;
  letter-spacing:.02em;color:var(--muted);text-align:center;line-height:1.25}
.pen .pate{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:2px}
.pen .pate i{font-style:normal;background:#E4F1E7;color:#2E5947;border-radius:6px;
  padding:1px 6px;font-size:13px;font-weight:600}
.pen.hungry{border-color:var(--unit)}
.pen.hungry .pg{animation:hungry 1.5s ease-in-out infinite}
@keyframes hungry{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.pen.chew .pg{animation:chew .5s ease}
@keyframes chew{0%,100%{transform:scale(1)}35%{transform:scale(1.3) rotate(-6deg)}
  70%{transform:scale(1.1) rotate(5deg)}}
.pen.no{border-color:#D9A08C}
.pen.no .pg{animation:nope .45s ease}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}}

/* ---- what they ate ---- */
.feast{width:100%;display:flex;flex-direction:column;align-items:center;gap:9px}
.feast .fbig{font-size:44px}
.feast h2{font-family:'FulSerif',serif;font-size:19px;margin:0 0 4px;text-align:center;color:var(--ink)}
.fedrow{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r-card);
  box-shadow:var(--shadow);cursor:pointer;font:inherit}
.fedrow .pg{font-size:26px}
.fedrow .fl{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.fedrow .fl i{font-style:normal;background:var(--sunk);border-radius:7px;padding:2px 8px;
  font-size:16px;font-weight:600;color:var(--ink)}
.fedrow.wait{animation:offer 2.6s ease-in-out infinite}
.fedrow.heard{opacity:.72}

/* ---- short and long ---- */
.vlen{width:100%;display:flex;flex-direction:column;align-items:center}
.vlrail{display:flex;gap:6px;justify-content:center;margin:8px 0 13px}
.vlchip{min-width:44px;min-height:38px;border:none;border-radius:11px;background:var(--sunk);
  font-size:17px;font-weight:600;color:var(--muted);cursor:pointer}
.vlchip.done{background:#E4F1E7;color:#2E5947}
.vlchip.on{background:var(--unit);color:#fff}
.vlpair{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%}
/* v190: the twin is the PAIR, not the letter.
   The tint was applied to every token equal to the doubled letter, so nunnu
   lit its first n as well as the nn in the middle — three green blocks under
   a card that says "two n side by side". A child looking for two together was
   being shown three apart. Only the adjacent pair is marked now, and it is
   marked as one continuous block so it reads as a pair rather than as two
   letters that happen to match. */
.gemtwin{background:rgba(79,157,105,.32)}
.gemtwin.ta{border-radius:6px 0 0 6px;padding-left:3px}
.gemtwin.tb{border-radius:0 6px 6px 0;padding-right:3px}
/* ============ v195: one place for listening ============
   Every card that plays a sound now keeps its listen button at the FOOT of the
   card, above the navigation, so a thumb finds it in the same place on every
   screen instead of hunting for it at the top on one and the bottom on the
   next. .doarea already stretches; .lower is pushed down to meet it. */
.lower{margin-top:auto;padding-top:14px;width:100%;display:flex;
  flex-direction:column;align-items:center;gap:8px}
/* ---- v223: this was the rule pushing the button off the card ----
   min-height:100% made the activity as tall as the whole card, so whatever
   came after it — the way on — was forced past the bottom edge and clipped.
   It was written when the card sized itself to its contents; now the card is
   measured to the room available, and the activity takes what it needs. */
.doarea>.hf,.doarea>.vlen,.doarea>.meet{display:flex;flex-direction:column;
  min-height:0;width:100%}
/* v196: the card grows to meet the button.
   .lower was pushed to the bottom of the CARD, but the card was still sized to
   its contents — so the listen button sat just under the letters with white
   space and then the page below it. Only the screens that have a .lower are
   stretched; every other card keeps sizing to what is in it. main already
   reserves room for the docked navigation, so the card stops above it. */
/* v207: growth is gone — the shared min-height is what makes them uniform */
.doarea:has(> .hf),.doarea:has(> .vlen){justify-content:flex-start}
.viw{display:flex;justify-content:center;gap:4px;margin:16px 0 8px}
.viwl{font-family:'FulSerif',Georgia,serif;font-size:44px;font-weight:600;color:var(--ink);
  background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:4px 12px;
  cursor:pointer;transition:background .18s ease,transform .12s ease}
.viwl.hit{background:var(--leaf);border-color:var(--leaf-deep);color:#fff}
.viwl.miss{animation:shake .32s ease}
.vlcard{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 8px 11px;
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r-card);
  box-shadow:var(--shadow);cursor:pointer;font:inherit}
.vlcard .vlw{font-size:34px;font-weight:600;color:var(--ink);line-height:1}
.vlcard .vlbar{display:block;width:100%;height:14px;border-radius:7px;background:var(--sunk);
  overflow:hidden}
/* v195: gold on brown read as a textbook. The bar is the thing a child is
   meant to want to press, so it is coral now, full strength, and thicker. */
.vlcard .vlbar i{display:block;height:100%;border-radius:5px;background:var(--coral);
  opacity:1}
/* v188: the stretch belongs to the press, not to the state.
   Every press rebuilds this screen, and the animation was hung on .heard — so
   once a child had heard the long one, pressing the short one re-added .heard
   to BOTH cards and both bars stretched. It read as "they answer together",
   which is the opposite of the one thing this screen exists to teach. */
.vlcard.heard .vlbar i{opacity:1}
.vlcard.just .vlbar i{animation:stretch .55s ease}
@keyframes stretch{from{transform:scaleX(.1);transform-origin:left}to{transform:scaleX(1)}}
.vlcard .vll{font-family:'FulSans',sans-serif;font-size:10.5px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;color:#A2A7BC}
.vlcard.heard{border-color:var(--amber-deep)}
/* v201: the same two cards, now as an answer rather than a demonstration */
.vchk .tkt{margin:2px 0 10px;font-size:17px}
.vchk .tkt .ff{color:var(--gold-deep)}
.vlcard.vcw .vlw .vv{color:var(--coral,#D4694A)}
.vlcard.vcw.right{border-color:var(--leaf-deep,#3C7C60);
  box-shadow:0 0 0 3px rgba(79,157,105,.24)}
.vlcard.vcw.wrong{animation:shake .4s}
.vlcard.vcw[disabled]{opacity:1}

/* ---- the machine keeps what you made ---- */
.found{display:flex;align-items:center;gap:9px;margin-top:8px;padding:7px 12px 7px 9px;
  border:1px solid var(--line);background:var(--ivory-warm,#FAF3E6);border-radius:14px;
  box-shadow:var(--shadow);cursor:pointer;font:inherit;max-width:100%}
.found .fg{font-size:22px}
.found .ft{font-size:13px;color:var(--ink);text-align:left;line-height:1.3}
.maderow{display:flex;gap:6px;overflow-x:auto;width:100%;padding:9px 1px 3px;
  -webkit-overflow-scrolling:touch}
.madechip{flex:0 0 auto;border:none;background:var(--sunk);border-radius:10px;
  padding:5px 11px;font-size:16px;font-weight:600;color:var(--muted);cursor:pointer}
.madechip.on{background:var(--unit);color:#fff}
.fivedots{display:flex;align-items:center;gap:5px;margin-top:2px}
.fivedots i{width:8px;height:8px;border-radius:50%;background:var(--sunk);display:block}
.fivedots i.on{background:var(--amber-deep)}
.fivedots span{font-family:'FulSans',sans-serif;font-size:10.5px;font-weight:700;
  color:#A2A7BC;margin-left:5px;letter-spacing:.03em}
.chal{display:flex;align-items:center;gap:8px;width:100%;padding:8px 6px 8px 10px;
  background:var(--sunk);border-radius:14px;margin-bottom:4px}
.chal .cw{font-size:22px}
.chal .ct{flex:1;font-size:13px;line-height:1.35;color:var(--ink);text-align:left}
.chal.won{background:#E4F1E7}
.chal .cx{border:none;background:none;font-size:19px;color:var(--muted);cursor:pointer;
  padding:0 6px;line-height:1}
.askme{margin-top:11px;border:1px dashed var(--line);background:none;border-radius:13px;
  padding:9px 14px;font-family:'FulSans',sans-serif;font-size:13px;font-weight:700;
  color:var(--muted);cursor:pointer}
@media (prefers-reduced-motion:reduce){
  .pen.hungry .pg,.pen.chew .pg,.pen.no .pg,.key.pl.spat,.fedrow.wait,
  .vlcard.just .vlbar i{animation:none}}

/* ==================== v124 ====================
   A station for each little word, on the seven diiwe. */
.lw{width:100%;display:flex;flex-direction:column;align-items:center}
.lwwords{display:flex;flex-direction:column;gap:7px;width:100%;margin-top:11px}
.lwword{display:flex;align-items:center;justify-content:center;text-align:center;
  gap:11px;width:100%;padding:11px;
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r-card);
  box-shadow:var(--shadow);cursor:pointer;font:inherit;text-align:left}
.lwword .lg{font-size:26px;flex:0 0 auto}
.lwword .lt{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.lwword .lt b{font-size:19px;color:var(--mk-deep);line-height:1.25}
.lwword .lt small{font-size:11.5px;color:var(--muted)}
.lw .rhyme{max-width:31em}

/* ==================== v125 ====================
   The letters are the screen; the vowels are a sheet that comes up over
   them. Nothing scrolls, and nothing is two half-decisions at once. */
.symac{position:relative}
.symac .sytip{min-height:17px;margin-bottom:3px}
.symac .crow{margin-top:0}

.symscrim{position:fixed;inset:0;border:none;padding:0;background:rgba(20,26,48,.28);
  z-index:65;cursor:pointer}
.symscrim.fresh{animation:scrimin .22s ease}
@keyframes scrimin{from{opacity:0}to{opacity:1}}
.symsheet{position:fixed;left:0;right:0;bottom:0;z-index:66;
  background:var(--surface,#fff);border-radius:24px 24px 0 0;
  padding:8px 14px calc(16px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -8px 34px rgba(16,28,69,.20);
  display:flex;flex-direction:column;align-items:center;gap:7px}
.symsheet.fresh{animation:sheetup .28s cubic-bezier(.2,.8,.25,1)}
@keyframes sheetup{from{transform:translateY(102%)}to{transform:translateY(0)}}
.symsheet .grab{display:block;width:38px;height:4px;border-radius:2px;
  background:var(--line);margin-bottom:2px}
.symsheet .shead{display:flex;align-items:center;gap:10px;width:100%}
.symsheet .sc{font-size:30px;font-weight:600;color:var(--unit);line-height:1;
  min-width:46px;text-align:center;background:var(--sunk);border-radius:12px;
  padding:5px 8px}
.symsheet .sn{flex:1;font-family:'FulSans',sans-serif;font-size:12px;font-weight:700;
  color:var(--muted);text-align:left}
.symsheet .cx{border:none;background:none;font-size:23px;line-height:1;
  color:var(--muted);cursor:pointer;padding:2px 6px}
.symsheet .syout{min-height:46px;font-size:40px}
.symsheet .vpad{border-top:none;padding-top:2px;margin-top:0}
.symsheet .fivedots{margin-top:1px}
@media (prefers-reduced-motion:reduce){
  .symscrim,.symsheet{animation:none}}

/* ============ v199: the vowels live in the card ============
   The vowel sheet was position:fixed to the bottom of the window, and that
   one decision has cost five builds: it slid up on every tap, it sat under
   the docked navigation, it fell off the bottom of a phone in an in-app
   browser, and it depends on no ancestor ever having a transform. It is now
   simply the card's second face — pick a letter and the grid is replaced by
   that letter and its vowels, in flow, scrolling with everything else.
   Nothing can position it off the screen because nothing is positioning it. */
.symsheet{position:static;left:auto;right:auto;bottom:auto;z-index:auto;
  padding:0;background:none;box-shadow:none;border-radius:0;width:100%;gap:8px}
.symsheet .grab{display:none}
.symsheet.fresh{animation:panelin .26s cubic-bezier(.2,.8,.25,1) both}
@keyframes panelin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.symscrim{display:none}
.symsheet .shead{background:var(--sunk);border-radius:16px;padding:7px 8px 7px 7px}
.symsheet .cx{font-size:12.5px;font-family:'FulSans',sans-serif;font-weight:700;
  letter-spacing:.02em;padding:7px 11px;border-radius:12px;background:var(--surface);
  color:var(--unit);white-space:nowrap}

/* ==================== v126 ====================
   The letter speaks, the dots arrive, the vowels wake. */
/* v180: dimmed, not locked. It says "the letter is still talking", and a
   child who presses anyway gets their sound rather than a dead key. */
.symsheet .key.v.asleep{opacity:.38;box-shadow:none!important}
.symsheet .key.v{transition:opacity .3s ease,background .25s ease,color .25s ease}
.symsheet .key.v.wake{animation:vwake .5s cubic-bezier(.2,.9,.3,1) both}
.symsheet .vrow .key.v.wake:nth-child(1){animation-delay:.00s}
.symsheet .vrow .key.v.wake:nth-child(2){animation-delay:.05s}
.symsheet .vrow .key.v.wake:nth-child(3){animation-delay:.10s}
.symsheet .vrow .key.v.wake:nth-child(4){animation-delay:.15s}
.symsheet .vrow .key.v.wake:nth-child(5){animation-delay:.20s}
@keyframes vwake{from{opacity:.3;transform:translateY(7px) scale(.94)}
  to{opacity:1;transform:none}}
.symsheet .key.v.just{background:var(--amber)!important;color:#3B2606!important}
.fivedots.arrive{animation:dotsin .42s ease both}
@keyframes dotsin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .symsheet .key.v.wake,.fivedots.arrive{animation:none}}

/* ==================== v180 ====================
   The sheet came up from the bottom of the screen, and the bottom of the
   screen was already spoken for: the docked back / start over / forward strip
   sits there on every screen of the course, with the settings handle under it.
   Between them they cover about ninety pixels — which is exactly the long
   vowel row and the five dots. So the second half of the machine, the half
   that holds aa ee ii oo uu, was printed underneath furniture.
   While the sheet is open the strip goes away. It is a sheet over the letters
   with its own close and its own scrim; the arrows behind it were not
   reachable anyway, and the whole sheet is one screen of the journey, not
   several. The settings handle stays — a grown-up may want it mid-play — so
   the sheet keeps a floor clear of it, and the keys come down a little so
   there is room for both rows on a short phone. */
body.sheetopen .stepnav{display:none}
/* v180.1: the sheet is NOT a scrolling box. It was given a max-height, its own
   overflow and momentum scrolling, which on iOS makes it a momentum scroller
   nested inside main's momentum scroller — the combination that stops the
   inner one being painted at all, which is why the vowels vanished rather than
   merely sitting low. It is content-sized again, as it was, and the fix for
   the overlap is the one that was actually needed: the strip stands down and
   the sheet keeps a floor clear of the settings handle. It also sits above the
   drawer now, so nothing can be drawn over its lower half. */
.symscrim{z-index:95}
.symsheet{z-index:96;
  padding-bottom:calc(58px + env(safe-area-inset-bottom,0px))}
.symsheet .syout{min-height:38px;font-size:34px}
.symsheet .hearbtn.slim{padding:6px 16px;font-size:15px}
.symsheet .vpad{gap:7px}
.symsheet .key.v{min-height:46px;font-size:19px}
.symsheet .found{margin:1px 0 0}
/* a short phone (or a big keyboard font) gives up the trimmings before it
   gives up a row of vowels */
@media (max-height:700px){
  .symsheet{gap:5px}
  .symsheet .sc{font-size:25px;padding:3px 7px;min-width:40px}
  .symsheet .syout{min-height:32px;font-size:29px}
  .symsheet .key.v{min-height:42px;font-size:18px}
  .symsheet .fivedots{margin-top:0}
}
@media (max-height:620px){
  .symsheet .fivedots{display:none}
  .symsheet .syout{min-height:28px;font-size:26px}
  .symsheet .key.v{min-height:39px;font-size:17px}
}

/* ==================== v129 ====================
   Three faults on the marker cards, all of them about a child being asked to
   do something nobody showed them.

   1. THE LITTLE WORD ARRIVED SILENT. A letter is met by being said and
      pressed three times before anything is asked of it. A marker — which is
      a word, and a harder one than a letter — was a large piece of type with
      a caption under it and a tap to get past. It is now met exactly the way
      a letter is met: it says itself on arrival, it jumps on each press, it
      is pressed three times, and only then does the door open onto the boxes.
   2. MOVING IT ROUND THE BACK WAS A GUESS. The second placement was the same
      quiet empty socket as the first, with a line of instruction above it.
      The word now lifts out of the front box on its own, an arc is drawn over
      the noun to the empty box behind, and the door says how many of the two
      places have been filled.
   3. THIS DOOR, THESE LITTLE ONES. The front box was labelled THIS for every
      marker, including koy and ɗee, which are these/those and never this.
      The label follows the marker now.
   And the round-arrow on the find card read as a switch rather than a replay,
   so every "hear it again" in the course is a speaker. */
.spk{width:18px;height:18px;display:inline-block;vertical-align:-3px}
.tapsay .spk{width:22px;height:22px;vertical-align:0}
.mkmeet .jletter{font-size:44px!important;letter-spacing:-.5px}
.mkmeet .grownup .nameis{color:var(--mk-deep)}
/* the arc from the front box to the empty one behind */
.turnc{position:relative}
.turnc .arc{position:absolute;left:0;right:0;top:-2px;height:46px;pointer-events:none}
.turnc .arc svg{width:100%;height:100%;overflow:visible}
.turnc .arc path{fill:none;stroke:var(--mk-deep);stroke-width:2.5;stroke-linecap:round;
  stroke-dasharray:260;stroke-dashoffset:260;animation:arcdraw 1.5s ease-out 1 forwards}
.turnc .arc polygon{fill:var(--mk-deep);opacity:0;animation:archead 1.6s ease-out 1 forwards}
@keyframes arcdraw{0%{stroke-dashoffset:260}100%{stroke-dashoffset:0}}
@keyframes archead{0%,80%{opacity:0}100%{opacity:1}}
.dock.asking{border-color:var(--mk-deep)!important;animation:dockask 1.5s ease-in-out 3}
@keyframes dockask{0%,100%{transform:none;box-shadow:none}
  55%{transform:translateY(-3px);box-shadow:0 0 0 6px var(--mk-soft)}}
.sidecue{margin:12px 0 0;text-align:center;font-size:16px;font-weight:700;color:var(--mk-deep)}
.sidecue small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:3px}
.seelist{display:flex;flex-direction:column;gap:8px}
/* ---- a word is a thing you press ----
   The rows were flat pills the colour of the card behind them, with a small
   grey speaker at the end: nothing about them said press me, and once pressed
   nothing much said you had. They are raised tiles now, with a real button on
   the right that fills in when the word has been heard, and they sink under
   the finger. The finding screen uses the same tile, so a child who has
   pressed one knows what the other is for. */
.seerow{display:grid;grid-template-columns:26px 1fr 34px;gap:9px;align-items:center;
  width:100%;padding:11px 11px;background:#fff;border:1.5px solid var(--line);
  border-radius:18px;text-align:left;font:inherit;cursor:pointer;
  box-shadow:0 2px 0 rgba(16,28,69,.07),0 8px 18px rgba(16,28,69,.05);
  transition:transform .12s ease,box-shadow .12s ease}
.seerow:active{transform:translateY(2px);box-shadow:none}
.seerow b{font-size:22px;color:var(--ink)}
/* v204: bigger tiles, and the word centred in them rather than lined up left
   behind a picture. The row is a word to be read, not a list item. */
.endsee .seelist{gap:10px}
.endsee .seerow{padding:15px 12px}
/* ---- v210: the pill is as wide as the row, and the word fits inside it ----
   The tile was shrinking to its content while the word inside it was fixed at
   31px, so on the braced screen — where the three tiles share the width with
   the brace and the plaque — the word ran straight out of the box it was
   supposed to be sitting in. The tile now takes the whole row and the type
   gives way, not the layout. */
.endsee .seerow{grid-template-columns:minmax(0,1fr);justify-items:center;
  text-align:center;padding:20px 12px;border-radius:22px;width:100%}
.endsee .seerow>*{min-width:0;max-width:100%}
/* ---- v211: the wrong cure ----
   v210 let the word break anywhere. But the card centres its contents, so the
   braced grid was sizing itself to its contents at the same time — and a word
   allowed to break at any letter has a minimum width of one letter. The two
   rules fed each other and stacked baafe down the screen a letter at a time.
   The grid takes the full width of the card instead, and the word is not
   allowed to break mid-word at all: it shrinks to fit, and that is all. */
.endsee .seerow{text-align:center!important}
.endsee .seerow b{text-align:center;font-size:clamp(17px,6.4vw,31px);line-height:1.15;
  overflow-wrap:normal;word-break:keep-all;hyphens:none;
  display:block;width:100%;white-space:nowrap}
.seewrap.braced{width:100%}
.seewrap.braced .seerow b{font-size:clamp(13px,4.6vw,24px)}
/* nothing anywhere prints wider than the tile holding it */
/* v211: shrink to fit, never break a word across lines */
.seerow b,.echip,.lopt .lp,.hfk,.ecw,.ecmk{max-width:100%;
  overflow-wrap:normal;word-break:keep-all}
.spotc b{max-width:100%;overflow-wrap:normal;word-break:keep-all}
.hfk{font-size:clamp(15px,5.2vw,24px)}
.echip{font-size:clamp(17px,6vw,27px)}
/* The stem only steps back on the LAST screen of the stage, where the point
   is that three different words share one ending. On the meeting screen the
   child is reading each word for the first time and on the finding screens
   they are being asked to tell words apart \u2014 greying two thirds of a word a
   child has never seen is not emphasis, it is a word half taken away. */
.seewrap.braced .seerow b .stem{opacity:.42}
.seerow b i{font-style:normal;color:var(--end-ink);background:transparent;
  border-bottom:3px solid var(--end-line);border-radius:0;padding:0 1px 1px;font-weight:700}
/* ---- the row IS the button ----
   The speaker on the right made the row look like a label with a control
   stuck on the end, and a child pressing the word rather than the icon had
   to be lucky. There is no icon now: the whole tile is the thing to press,
   and while it has not been pressed it lifts and settles on its own so the
   invitation is in the movement rather than in a symbol. */
.seerow.bare{grid-template-columns:26px 1fr}
.seerow.bare.nudge{animation:rownudge 2.1s ease-in-out infinite}
@keyframes rownudge{0%,100%{transform:none;
   box-shadow:0 2px 0 rgba(16,28,69,.07),0 8px 18px rgba(16,28,69,.05)}
  50%{transform:translateY(-3px);
   box-shadow:0 4px 0 var(--mk-soft),0 12px 22px rgba(16,28,69,.09)}}
@media (prefers-reduced-motion:reduce){.seerow.bare.nudge{animation:none}}
/* no tinted rows and no filled buttons: on a screen whose whole job is to
   make one word matter, everything else stays quiet. */
/* v177: a word that has been pressed here looks like a word that has been
   found at the sorting screen two stages later - same green edge, same pale
   green ground. It is the same act (you picked this one, it counted) and it
   was being reported in two different visual languages: a grey border here, a
   leaf-green tile there. */
.seerow.heard{border-color:var(--leaf-deep);background:#F3F9F1}
.seerow.took{border-color:var(--leaf-deep);background:#F3F9F1}
.seewrap{display:grid;grid-template-columns:1fr;gap:0;width:100%}
.seewrap .seelist{width:100%;min-width:0}
/* the plaque ran off the right-hand edge because the tiles were given all the
   room they asked for. The three of them share what is left after the little
   word has taken its own — which is the right way round anyway: it is the
   bigger thing on this screen. */
.seewrap.braced{grid-template-columns:minmax(0,1fr) 16px 118px;align-items:center;gap:10px}
.seewrap.braced .bracemk{padding-left:6px}
/* the brace DRAWS itself, top to bottom, and the little word lands after it
   has finished — the point being that the three words are gathered first and
   the marker is what they arrive at */
.seewrap .brace{align-self:stretch;display:flex}
.seewrap .brace svg{width:18px;height:100%;overflow:visible}
.seewrap .brace path{fill:none;stroke:var(--mk-deep);stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;opacity:.8;
  stroke-dasharray:300;animation:bracedraw .6s ease-out both}
@keyframes bracedraw{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
.seewrap .bracemk{animation:ecarrive .45s ease-out .5s both}
.endsee .erule{animation:ecarrive .4s ease-out .7s both}
@media (prefers-reduced-motion:reduce){
  .seewrap .brace path,.seewrap .bracemk,.endsee .erule{animation:none}}
/* ---- an important word should look like one ----
   ngal was set in the same type as the words around it, so the eye read it as
   one more word in a sentence. It stands on its own plaque now — bordered,
   raised and labelled — which is what this whole stop is about. */
.mkplaque{cursor:pointer;font:inherit;display:inline-flex;flex-direction:column;align-items:center;gap:1px;
  padding:8px 15px 6px;background:#fff;border:2px solid var(--mk-deep);
  border-radius:15px;box-shadow:0 3px 0 var(--mk-soft),0 8px 18px rgba(16,28,69,.09)}
.mkplaque b{font-size:27px;line-height:1.05;color:var(--mk-deep)}
.mkplaque small{font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);font-weight:700}
.mkplaque.big{padding:12px 10px 8px;width:108px}
.mkplaque.big b{font-size:31px}
.mkplaque.big small{font-size:8px;letter-spacing:.1em}
/* v212: the ? is a place waiting to be filled, and the course already has a
   shape for that — the dashed socket. Same shape, so a child reads it the
   same way. */
.mkplaque.q{border:2px dashed rgba(0,0,0,.28);background:var(--sunk);box-shadow:none}
.mkplaque.q b{color:var(--muted);opacity:.55}
.sidecue.big{font-size:22px;gap:10px;margin-top:14px}
.sidecue.big .cuebox{width:66px;height:40px}
.eshelf .eslot{border:2px dashed rgba(0,0,0,.22);cursor:default;padding:0}
.eshelf .eslot.got{border-style:solid;border-color:var(--leaf-deep);background:#F3F9F1}
.eshelf .eslot.got{cursor:pointer}
.eshelf .eslot.got:active{transform:scale(.94)}
.erule{margin:16px 0 4px;text-align:center;animation:ecarrive .4s ease-out both}
.erule .er1{margin:0;font-size:15px;color:var(--muted)}
.erule .er2{margin:6px 0 0;font-size:19px;color:var(--ink)}
.erule .er2 b{color:var(--ink)}
.erule .er2 b.mk{color:var(--mk-deep)}
/* the one thing to press should not be the greyest thing on the card */
/* v212: it had taken the little word's colour. There is one listen button. */
.hearbtn.mkbtn{background:var(--gold-bg)!important;color:var(--gold-deep)!important;
  box-shadow:inset 0 0 0 1.5px var(--mk-deep)!important;font-weight:800}
.hearbtn.mkbtn .bars i{background:var(--gold-deep)}
.wmnav.solo.pair{justify-content:center;gap:14px}
.wmnav.pair .fwd svg{transform:scaleX(-1)}
/* on the three screens that end the card the way out sat below the fold, so a
   child who wanted to go back could not reach it. It rides at the top now. */
.boxcard .wmnav.pair{margin:0 0 10px}
.demosay{margin:14px 0 0;text-align:center;font-size:20px;color:var(--ink)}
.demosay b{color:var(--ink)}
.demosay small{display:block;font-size:12px;color:var(--muted);margin-top:3px;font-weight:600}
.swdots{display:flex;justify-content:center;gap:7px;margin:0 0 10px}
.swdot{width:9px;height:9px;border-radius:50%;background:rgba(0,0,0,.13)}
.swdot.on{background:var(--mk-deep)}
.swdot.now{box-shadow:0 0 0 3px var(--mk-soft)}
.urow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:6px 0 2px}
.uvs{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ubox{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px 8px;
  text-align:center;box-shadow:0 2px 0 rgba(16,28,69,.06)}
.ubox.alt{background:#F7F8FC}
.ubox .uobjs{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:2px;min-height:60px}
.ubox .uph{margin:6px 0 0;font-size:19px;color:var(--ink)}
.ubox .uph b.mk{color:var(--mk-deep)}
.ubox .uph b.other{color:#5B6076}
.ubox .uph b.dim{color:var(--muted);font-size:16px}
.ubox .uen{margin:4px 0 0;font-size:11.5px;color:var(--muted);line-height:1.3}
.lsgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* v207: the four cards are the whole screen here, so they take it */
.lsgrid .lscard{padding:20px 10px 18px}
.lscard b{font-size:31px!important}
.lsagain{margin-top:22px}
/* v204: the cards sat at the top with half a screen of nothing under them */
.lset{display:flex;flex-direction:column;justify-content:center;min-height:64vh}
.lscard{background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 8px 10px;
  font:inherit;cursor:pointer;text-align:center;
  box-shadow:0 2px 0 rgba(16,28,69,.07),0 8px 18px rgba(16,28,69,.05);
  transition:transform .12s ease,box-shadow .12s ease}
.lscard:active{transform:translateY(2px);box-shadow:none}
/* ---- a press has to leave a mark ----
   Pressing a card re-renders the screen, so the element the finger touched is
   replaced before :active can be seen, and a second press on a card already
   met produced identical HTML — nothing moved, no sound, and the card looked
   broken. The press now belongs to the state: the card just pressed keeps a
   ring in its own marker colour and flashes once, every time, met or not, so
   the four can be gone back over as often as a child likes. The ring is not
   the animation, so it still shows with reduced motion on. */
.lscard.said{outline:3px solid var(--unit);outline-offset:2px;
  animation:lssaid .55s ease-out}
/* ---- the count says it without a language ----
   "one of it" and "little ones" only mean anything to a child who reads
   English, and plenty of the children this is for read French, or nothing yet.
   How many there are is on the card already — the numeral just names what the
   picture shows, and how big they are is shown by how big they are drawn. So
   one big / one small / four small / four big is legible with no words at all,
   and the English underneath becomes a caption rather than the carrier. */
.lscard{position:relative}
.lscount{position:absolute;left:8px;top:8px;min-width:22px;height:22px;border-radius:8px;
  background:var(--mk-soft);border:1.5px solid var(--mk-deep);color:var(--mk-deep);
  font-family:'FulSans',sans-serif;font-size:12.5px;font-weight:700;
  display:grid;place-items:center;padding:0 4px}
.mkplaque.jobnum b{font-family:'FulSans',sans-serif;font-size:38px;line-height:1}
.mkplaque.jobnum small{font-size:8.5px;letter-spacing:.06em;text-transform:none;
  color:var(--muted);font-weight:600}
@keyframes lssaid{
  0%{transform:scale(.95);box-shadow:0 0 0 0 var(--mk-soft)}
  35%{transform:scale(1.02);box-shadow:0 0 0 10px var(--mk-soft)}
  100%{transform:none;box-shadow:0 2px 0 rgba(16,28,69,.07),0 8px 18px rgba(16,28,69,.05)}}
.lsagain{margin:9px 0 0;text-align:center;font-size:12px;color:var(--muted)}
/* v202: a pressed card is outlined, not filled. Four cards in four different
   fills read as four states of something rather than one choice.
   v204: and the outline is ONE colour on every card. Four selection colours
   made the highlight look like part of the content; selection is a state of
   the interface, and the interface should say it the same way every time.
   The words keep their own colours \u2014 those are the thing being taught. */
.lscard.on{border-color:var(--unit)!important;background:#fff;
  box-shadow:0 0 0 3px var(--unit-bg,#E7E5F7)}
.lscard b{display:block;margin-top:6px;font-size:25px;color:var(--mk-deep)}
.lscard small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.lsobjs{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:2px;min-height:62px}
.lsstage{background:#fff;border:1.5px solid var(--line);border-radius:20px;
  padding:16px 10px;text-align:center;margin-bottom:12px;min-height:96px}
.lsstage .lsobjs{min-height:70px}
.lsans{margin:8px 0 0;font-size:20px;color:var(--ink)}
.lsans b.mk{color:var(--mk-deep)}
.seerow.jobrow{grid-template-columns:1fr;row-gap:2px;padding:10px 12px;
  border-color:rgba(16,28,69,.16);position:relative;transition:border-color .15s ease}
.seerow.jobrow .jw{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.seerow.jobrow .jw b{font-size:19px;color:var(--ink)}
.seerow.jobrow .jw b.mk{font-size:19px;color:var(--mk-deep);font-weight:800}
.seerow.jobrow .jen{grid-column:1;font-size:11.5px;color:var(--muted);font-weight:600}
/* pressed once keeps its own colour; the one now showing in the panel is the
   only one filled in, so the left and the right always agree */
.seerow.jobrow.seen{border-color:var(--mk-deep)}
.seerow.jobrow.on{background:var(--mk-soft);border-color:var(--mk-deep);
  box-shadow:0 0 0 2px var(--mk-soft)}
.seerow.jobrow.seen::after{content:"\2713";position:absolute;right:10px;top:9px;
  font-size:12px;font-weight:800;color:var(--mk-deep);opacity:.65}
.seerow.jobrow.on::after{opacity:1}

/* ---- markers on the left, one display on the right ---- */
/* One row, two columns, one height. The column of markers grew past the panel
   and then ran under the floating arrows, so reaching \u0257ii meant scrolling the
   whole page and losing sight of the display — the thing you press the markers
   to watch. The row is now a fixed height that fits above the arrows, the
   panel fills it, and the markers scroll inside their own half. */
/* v204: the panel uses the screen it is given — the rail stays as wide as it
   needs and everything else is the display. */
.jobwrap{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;
  align-items:stretch;margin-top:4px;height:clamp(300px,56vh,560px)}
.joblist{display:flex;flex-direction:column;gap:7px;height:100%;
  overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 3px 16px;margin:-2px -3px 0;
  scrollbar-width:thin;
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 24px),transparent);
  mask-image:linear-gradient(180deg,#000 calc(100% - 24px),transparent)}
.jobkey{flex:0 0 auto}
.jobkey{position:relative;background:#fff;border:2px solid rgba(16,28,69,.14);border-radius:15px;
  padding:9px 6px 7px;cursor:pointer;font:inherit;text-align:center;
  box-shadow:0 2px 0 rgba(16,28,69,.07);transition:transform .12s ease,border-color .15s ease}
.jobkey:active{transform:translateY(2px);box-shadow:none}
.jobkey b{display:block;font-size:19px;color:var(--mk-deep);font-weight:800;line-height:1.1}
.jobkey small{display:block;margin-top:1px;font-size:10.5px;font-weight:700;color:var(--muted)}
.jobkey.seen{border-color:var(--mk-deep)}
.jobkey.on{background:var(--mk-soft);border-color:var(--mk-deep);box-shadow:0 0 0 2px var(--mk-soft)}
.jobkey.seen::after{content:"\2713";position:absolute;right:6px;top:5px;font-size:10px;
  font-weight:800;color:var(--mk-deep);opacity:.6}
/* the hairline is the only thing saying "these ones are different" — no word
   of any language does that job here */
.jsplit{display:block;height:2px;border-radius:2px;background:rgba(16,28,69,.16);margin:3px 12px}

/* The panel has to look like a thing that changes rather than a label, so it
   is sunk into the page, framed in the colour of whatever is showing, and
   carries its own arrows and a position. */

/* ==================== v186 ====================
   The photo is a picture, not a handle.
   On iOS a drag that starts on an <img> is a drag of the image: Safari lifts
   it, scales it up under the finger as a drag preview, and swallows the
   gesture — so a swipe up on the dashboard zoomed the child's face instead of
   scrolling the page. The avatar is the only image in the whole course, it is
   never meant to be dragged, saved or selected, and every place it appears the
   tap target is its parent (.me, .findme, .cur, .trav), never the img itself.
   So the img gives up pointer events entirely: the parent still receives the
   tap that opens the picker, and the scroll belongs to the page again.
   touch-action:manipulation on those parents also stops a double tap on a face
   being read as a request to zoom. */
img{-webkit-user-drag:none;user-drag:none;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  pointer-events:none}
.me,.findme,.cur,.trav,.cwalker,.hme{touch-action:manipulation}
