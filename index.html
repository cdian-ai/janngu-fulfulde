/* ---------- wrappers ---------- */
/* the grey instruction line is now the thing you tap to hear it read out,
   so no separate ? button is needed and the corner is free */
/* ---- the instruction is a sound, not a sentence ----
   Every card carried its instruction in English across the top. A child who
   does not read English got a grey band of nothing; a child who does read
   English got told the answer. The line is now a button that says the
   instruction out loud (say/<activity>.mp3) and shows no text at all, so the
   screen has to make its own case — which is the right pressure to be under.
   The English has not been thrown away: it is in the grown-up drawer, under
   "What to do", where the person who can read it is. */
function wrap(inner,i,n,clean){
 S.progI=i||0; S.progN=n||1;
 /* ---- v175: the ear is the way to the instruction, not a lottery ----
    It pointed at say/<activity>.mp3 for all thirty-seven activities and not one
    of those files exists, so pressing it did nothing at all - the single worst
    thing a button can do to a child. It now opens the settings drawer at the
    instruction for the stage they are standing in, which is written and always
    there; the drawer's own button plays the clip if a copy has one. */
 const ear=`<button class="sayear" data-howto
   aria-label="what to do"><span class="bars"><i></i><i></i><i></i></span></button>`;
 if(clean){
  /* "bare" leaves even the listen button off, for a screen fighting for height */
  return `<div class="doarea clean">${clean==="bare"?"":ear}${inner}</div>`;
 }
 return ear+`<div class="doarea">${inner}</div>`;
}
function face(f,t){return `<div class="faceline"><span class="f">${f}</span><p>${t}</p></div>`}
/* ---- the instruction has to be written where it will be read ----
   Each of the seven letter stops is its own activity (hf0…hf6) with its own
   ACTS entry, built from the group. Both the meeting screen and the question
   screen were setting ACTS.hearfind.say — a spare object no stop points at —
   so every line either of them ever wrote was thrown away, and the hint above
   the card has always read "Listen. Then tap the letter you heard." even
   while the child was being asked to press a letter three times. */
function sayNow(txt){ const a=ACTS[S.act]; if(a) a.say=txt; }
/* several sounds one after another, which is how a group is heard as a group
   rather than as a list of separate things */
function playSeq(paths,gap){
 (paths||[]).forEach(function(pth,i){
  setTimeout(function(){ try{ play(null,pth) }catch(e){} }, i*(gap||820));
 });
}
function lclip(l){ const i=LIX[l]; return i===undefined?"":"letters/sound-"+pad(i,2)+".mp3" }
function done(em,t){return `<div class="finish"><div class="big">${em}</div><h2>${esc(t)}</h2>
 <button class="ctl" style="width:100%;margin-top:10px" data-finish>done ✓</button></div>`}
/* every open-ended activity gets the same finish affordance */
function finishBar(){return `<div class="controls" style="margin-top:11px">
 <button class="ctl${S.act==="nummac"?" clean":""}" data-finish><span class="em">✓</span>I've finished this</button></div>`}

/* wordmac ends when its four little words have each been opened and turned,
   and that door appears on its own — a second "I've finished this" underneath
   offered a child a way out of a lesson they had not had yet */

/* ================= v249: COUNTING, TAUGHT BEFORE IT IS BUILT =================
   Numbers used to arrive at step 38 as a single machine with two dials. The
   machine is a good tool and was a poor lesson: it handed a child 37 and the
   name for 37 without ever showing why jeeɗiɗi is seven. Teaching is now split
   from the tool. One hand and The other hand sit in Fuuta Tooro, straight after
   the syllable machine, because go’o ɗiɗi tati nayi jowi are two-syllable words
   made of letters the child has just met — they are reading practice that
   happens to be counting. Ten and the tens stays in Fuuta Masina in front of
   the machine, which then stops being a lesson and becomes the payoff.
   Peeral does the teaching for us: he prints jeego’o as /jowi e go’o/ and
   jeeɗiɗi as /jowi e ɗiɗi/, breaking the word open on the page. Six to nine
   are not nine words to memorise, they are five wearing a coat.
   Twenty is not built: sappo and noogay are their own words, and cappanɗe only
   begins at thirty — Peeral says so in the entry. Three ideas, not one. */
const HAND=[
 {n:1,w:"go’o",  syl:["go","’o"]},
 {n:2,w:"ɗiɗi",  syl:["ɗi","ɗi"]},
 {n:3,w:"tati",  syl:["ta","ti"]},
 {n:4,w:"nayi",  syl:["na","yi"]},
 {n:5,w:"jowi",  syl:["jo","wi"]}
];
const JEE=[
 {n:6,w:"jeego’o", tail:"go’o", o:["go’o","ɗiɗi","nayi"]},
 {n:7,w:"jeeɗiɗi", tail:"ɗiɗi", o:["tati","ɗiɗi","go’o"]},
 {n:8,w:"jeetati", tail:"tati", o:["nayi","go’o","tati"]},
 {n:9,w:"jeenayi", tail:"nayi", o:["nayi","ɗiɗi","tati"]}
];
const TENSTEP=[
 {n:10,w:"sappo",         why:"Ten has a word of its own. Nothing to build."},
 {n:20,w:"noogay",        why:"So does twenty. These two you simply know."},
 {n:30,w:"cappanɗe tati", why:"From thirty on, it is cappanɗe and a number you already have. Three tens."}
];


/* The checks ask with counters and words only — never with the numeral beside
   the answer, which would let a child pass by matching shapes. Option orders are
   fixed in the data rather than shuffled at render, because a re-render on every
   tap would move the buttons under the child's finger. */
const HANDQ=[
 {n:3,o:["nayi","tati","ɗiɗi"]},
 {n:1,o:["go’o","jowi","tati"]},
 {n:5,o:["nayi","jowi","go’o"]},
 {n:2,o:["ɗiɗi","tati","nayi"]},
 {n:4,o:["jowi","ɗiɗi","nayi"]}
];
const TENQ=[
 {n:10, a:"sappo",             o:["noogay","sappo","cappanɗe go’o"]},
 /* the wrong answer offered for twenty is the mistake itself: two tens. */
 {n:20, a:"noogay",            o:["cappanɗe ɗiɗi","noogay","sappo"]},
 {n:40, a:"cappanɗe nayi",     o:["cappanɗe nayi","cappanɗe tati","noogay"]},
 {n:70, a:"cappanɗe jeeɗiɗi",  o:["cappanɗe jeego’o","cappanɗe jeeɗiɗi","cappanɗe jeetati"]},
 {n:90, a:"cappanɗe jeenayi",  o:["cappanɗe jeenayi","cappanɗe jeetati","teemedere"]},
 {n:100,a:"teemedere",         o:["cappanɗe sappo","teemedere","cappanɗe jeenayi"]}
];

function ndots(k,cls){ let s=""; for(let i=0;i<k;i++) s+=`<i class="coin${cls?" "+cls:""}"></i>`; return s }

/* ---- one hand ---- */
function hand(){
 /* v250: the five cards teach, and then five questions ask. Counters only —
    the numeral is off the question card on purpose, so the child counts. */
 if(S.hnPhase==="q"){
  const qi=S.hqI||0;
  if(qi>=HANDQ.length) return done("🖐️","One hand");
  const q=HANDQ[qi], ans=HAND[q.n-1].w, pick=S.hqPick, right=pick===ans;
  return wrap(`<div class="nhead">
    <div class="bay" style="justify-content:center">${ndots(q.n)}</div>
    <div class="numword">${right?esc(ans):`<span class="jeeblank">?</span>`}</div>
   </div>`,HAND.length+qi,HAND.length+HANDQ.length)
  +(right?face("⭐",`<b class="ff">${esc(ans)}</b> — ${q.n}.`)
         +`<button class="wallbtn" data-hqnext>next ›</button>`
    :`<div class="controls c3">${q.o.map(function(x){
       return `<button class="ctl big${pick===x?" wrong":""}" data-hq="${esc(x)}">${esc(x)}</button>`}).join("")}</div>`
     +(pick?face("🤔","Count them again, one finger at a time.")
           :face("👆","Count the dots. Tap the word.")));
 }
 const i=S.hnI||0;
 if(i>=HAND.length){ S.hnPhase="q"; return hand() }
 const c=HAND[i], said=S.hnSaid;
 return wrap(`<div class="nhead">
   <div class="numeral">${c.n}</div>
   <div class="bay" style="justify-content:center">${ndots(c.n)}</div>
   <div class="numword">${c.syl.map(function(s){return `<span class="syl">${esc(s)}</span>`}).join("")}</div>
   <button class="hearbtn" data-clip="num/n${pad(c.n,3)}.mp3" data-hsaid><span class="bars"><i></i><i></i><i></i></span>listen</button>
  </div>`,i,HAND.length+HANDQ.length)
 +(said?`<button class="wallbtn" data-hnext>next ›</button>`
       :face("👆","Press it, then say it. Hold up that many fingers while you do."));
}

/* ---- the other hand: the tail IS the number ---- */
function jee(){
 /* v250: this stop used to open with a question, which asked a child to spot a
    pattern nobody had shown them. The four cards below now say it plainly —
    five, and this many more, and here is the word with the two halves tinted —
    and only then does it ask. Teaching before testing, as everywhere else. */
 if(S.jePhase!=="q"){
  const m=S.jmI||0;
  if(m>=JEE.length){ S.jePhase="q"; return jee() }
  const c=JEE[m], small=c.n-5, said=S.jmSaid;
  return wrap(`<div class="nhead">
    <div class="numeral">${c.n}</div>
    <div class="mat" style="gap:8px">
     <div class="col"><span class="cname"><span class="sw" style="background:#6E9C7C"></span><b>jowi</b>five</span>
      <div class="bay">${ndots(5)}</div></div>
     <div class="col"><span class="cname"><span class="sw" style="background:#F0B54A"></span><b>${esc(HAND[small-1].w)}</b>${small} more</span>
      <div class="bay">${ndots(small,"gold")}</div></div>
    </div>
    <div class="numword"><span class="jeepre">jee</span><span class="jeetail ok">${esc(c.tail)}</span></div>
    <button class="hearbtn" data-clip="num/n${pad(c.n,3)}.mp3" data-jmsaid><span class="bars"><i></i><i></i><i></i></span>listen</button>
   </div>`,m,JEE.length*2)
  +(said?face("🖐️",`<b class="ff">jee</b> is jowi — five. After it comes <b class="ff">${esc(c.tail)}</b>, the number you added.`)
        +`<button class="wallbtn" data-jmnext>next ›</button>`
   :face("👀","Five on one hand, and this many on the other. Press the word."));
 }
 const i=S.jeI||0;
 if(i>=JEE.length) return done("🖐️🖐️","The other hand");
 const c=JEE[i], pick=S.jePick, right=pick===c.tail;
 const small=c.n-5;
 return wrap(`<div class="nhead">
   <div class="numeral">${c.n}</div>
   <div class="mat" style="gap:8px">
    <div class="col"><span class="cname"><span class="sw" style="background:#6E9C7C"></span><b>jowi</b>five</span>
     <div class="bay">${ndots(5)}</div></div>
    <div class="col"><span class="cname"><span class="sw" style="background:#F0B54A"></span><b>?</b>${small} more</span>
     <div class="bay">${ndots(small,"gold")}</div></div>
   </div>
   <div class="numword"><span class="jeepre">jee</span>${pick?`<span class="jeetail${right?" ok":" no"}">${esc(pick)}</span>`:`<span class="jeeblank">?</span>`}</div>
   ${right?`<button class="hearbtn" data-clip="num/n${pad(c.n,3)}.mp3"><span class="bars"><i></i><i></i><i></i></span>listen</button>`:""}
  </div>`,JEE.length+i,JEE.length*2)
 +(right?face("⭐",`<b class="ff">${esc(c.w)}</b> — five and ${small}.`)
        +`<button class="wallbtn" data-jenext>next ›</button>`
   :`<div class="controls c3">${c.o.map(function(x){
      return `<button class="ctl big${pick===x?" wrong":""}" data-je="${esc(x)}">${esc(x)}</button>`}).join("")}</div>`
    +(pick?face("🤔","Not that one. Count the gold ones — that is the word you need.")
          :face("🖐️","Five, and how many more? Tap the word that finishes it.")));
}

/* ---- ten, twenty, and the rest ---- */
function tens(){
 const N=TENSTEP.length+1+TENQ.length;
 if(S.tnPhase==="q"){
  const qi=S.tqI||0;
  if(qi>=TENQ.length) return done("🪜","Ten and the tens");
  const q=TENQ[qi], pick=S.tqPick, right=pick===q.a;
  return wrap(`<div class="nhead">
    <div class="numeral">${q.n}</div>
    <div class="numword ff">${right?esc(q.a):`<span class="jeeblank">?</span>`}</div>
    ${right?`<button class="hearbtn" data-clip="num/n${pad(q.n,3)}.mp3"><span class="bars"><i></i><i></i><i></i></span>listen</button>`:""}
   </div>`,TENSTEP.length+1+qi,N)
  +(right?face("⭐",q.n<30?"Its own word — nothing built.":`cappanɗe and the number: ${Math.floor(q.n/10)} tens.`)
         +`<button class="wallbtn" data-tqnext>next ›</button>`
   :`<div class="controls">${q.o.map(function(x){
      return `<button class="ctl${pick===x?" wrong":""}" data-tq="${esc(x)}">${esc(x)}</button>`}).join("")}</div>`
    +(pick?face("🤔",q.n<30?"This one is not built from anything. It has its own word.":"How many tens is it? That is the number after cappanɗe.")
          :face("🪜","Which word is this number?")));
 }
 const i=S.tnI||0;
 if(i>=TENSTEP.length){
  return wrap(`<div class="nhead"><div class="numword">the whole ladder</div></div>
   <div class="tenlad">${[1,2,3,4,5,6,7,8,9].map(function(k){
     return `<button class="tenrung" data-clip="num/n${pad(k*10,3)}.mp3"><b>${k*10}</b><span class="ff">${esc(TENSW[k])}</span></button>`}).join("")}
    <button class="tenrung hun" data-clip="num/n100.mp3"><b>100</b><span class="ff">teemedere</span></button></div>`,TENSTEP.length,N)
   +`<button class="wallbtn" data-tqgo>now check ›</button>`;
 }
 const c=TENSTEP[i];
 return wrap(`<div class="nhead">
   <div class="numeral">${c.n}</div>
   <div class="numword ff">${esc(c.w)}</div>
   <button class="hearbtn" data-clip="num/n${pad(c.n,3)}.mp3"><span class="bars"><i></i><i></i><i></i></span>listen</button>
  </div>`,i,N)
 +face(i===2?"🪜":"🔟",esc(c.why))
 +`<button class="wallbtn" data-tnnext>next ›</button>`;
}

const OPEN_ENDED=["parade","sylmac","nummac","days","sentread"];
const VIEWS={hand,jee,tens,parade,hearfind,greet,kinfolk,onemany,verbs,adjs,gpens,sylmac,pairs,gemin,littleset,jobset,wordmac,wordmac2,wordmac3,makeword,masswords,mpens,swap,nummac,numq,days,seasons,splitter,shapes,names,sentbuild,sentmark,sentread};

/* one stop per letter group — they share the activity, each carrying its own
   group, so a child can finish the vowels and stop without losing anything */
const HFEM=["\ud83d\udd0a","\ud83d\udc44","\ud83e\udeb6","\ud83d\udc43","\ud83c\udf2c\ufe0f","\ud83d\udca7","\ud83d\udd17"];
SQ.forEach(function(c,i){

   else { S.mStep=4; S.dStep=0 }
  }
  else if(ms===4){
   if((S.dStep||0)<1) S.dStep=1;
   else { S.mStep=5; S.pI=0; S.pSide="behind"; S.pDone={} }
  }
  else if(ms===5){
   if((S.pI||0)<2){ S.pI=(S.pI||0)+1; S.pSide="behind" }
   else if(hear2){ S.mStep=6; S.lI=0; S.lPick=null; S.lMiss=null }
  }
  else if(ms===6&&hear2){
   if((S.lI||0)<3){ S.lI=(S.lI||0)+1; S.lPick=null; S.lMiss=null }
  }
  sMove(); render(); return}
 if(d.mback!==undefined){
  const k=S.wmM||0, ms=S.mStep||0;
  /* inside the ending stage, back means the step before within it */
  if(ms===1&&S.mEphase==="join"){
   S.mEphase="spot"; S.mRound=2; S.mSpotBad=null; sMove(); render(); return }
  if(ms===1&&S.mEphase==="spot"&&S.mRound===2){
   S.mRound=1; S.mSpot={}; S.mSpotBad=null; sMove(); render(); return }
  if(ms===1&&S.mEphase==="spot"){ S.mEphase="see"; S.mSpotBad=null; sMove(); render(); return }
  if(ms===2&&(S.mEi||0)>0){ S.mEi=(S.mEi||0)-1; S.mEbad=null; sMove(); render(); return }
  if(ms===3&&((S.uRound||0)>0||(S.uStep||0)>0)){
   if((S.uRound||0)>0){ S.uRound=0 } else { S.uStep=(S.uStep||0)-1 }
   S.uPick=null; S.uMiss=null; sMove(); render(); return }
  if(ms===4&&(S.dStep||0)>0){ S.dStep=0; sMove(); render(); return }
  if(ms===5&&(S.pI||0)>0){ S.pI=(S.pI||0)-1; S.pSide="behind"; sMove(); render(); return }
  if(ms===6&&(S.lI||0)>0){ S.lI=(S.lI||0)-1; S.lPick=null; S.lMiss=null; sMove(); render(); return }
  /* stage 3 \u2014 "what ngal is for" \u2014 was cut; back steps over its number */
  let prev=ms-1; if(prev===3) prev=2;
  if(prev<0){
   if(k>0){ S.wmM=k-1; S.mStep=0; S.mPress=0; S.mEi=0; S.mEdone={}; S.mEbad=null;
    S.mSide="front"; S.mTurned=false }
  } else {
   S.mStep=prev; S.mEbad=null;
   if(prev===0) S.mPress=0;
   if(prev===1){ S.mEphase="join"; S.mSpotBad=null }
   if(prev===2){ S.mEi=6 }
   if(prev===4){ S.dStep=1 }
   if(prev===5){ S.pI=2; S.pSide="behind" }
   if(prev<=2){ S.mSide="front"; S.mTurned=false }
  }
  sMove(); render(); return}
 if(d.enext!==undefined){ S.mEi=(S.mEi||0)+1; S.mEbad=null; sMove(); render(); return}
 if(d.ecel!==undefined){ S.eCel="seen"; sMove(); render(); return}
 if(d.mpress!==undefined){
  /* the meeting: press it, it moves, it says itself again */
  const cur=mCard(S.wmM);
  S.mPress=Math.min((S.mPress||0)+1,PRESSES);
  if(cur) try{ play(t,mkclip(cur.k)) }catch(e2){}
  sMove(); render();
  if(S.mPress>=PRESSES) setTimeout(function(){ sGood() },260);
  return}
 if(d.mkagain!==undefined){ S.mPress=0; sMove(); render();
  const cur=mCard(S.wmM);
  if(cur) try{ play(null,mkclip(cur.k)) }catch(e2){}
  return}
 if(d.cmp!==undefined){
  const i=+d.cmp, L=LITTLE[i]; if(!L) return;
  if(!S.cmpOpen) S.cmpOpen={};
  S.cmpOpen[i]=1; sMove(); render();
  playSeq(["words/w"+pad(5,2)+"-"+L.f+".mp3",
           "words/w"+pad(CMPW,2)+"-"+L.f+".mp3"],900);
  return}
 if(d.mstep!==undefined){
  S.eCel=null;                      /* v230: each little word earns its own */
  /* v212: jumping straight to the doing stage needs its state cleared */
  if(d.pfresh&&(+d.mstep)+1===5){ S.pI=0; S.pSide="behind"; S.pDone={} }
  /* one step of the first card's walkthrough */
  const cl=t.getAttribute&&t.getAttribute("data-stepclip");
  if(cl) play(t,cl);
  if(d.dock){ S.mSide=d.dock; S.mTurned=true;
   const cur=mCard(S.wmM);
   if(cur) seeSide(cur.k,d.dock); }
  S.mStep=(+d.mstep)+1; sMove(); render(); return}
 if(d.mflip!==undefined){ if(SWIPED){SWIPED=false;return}
  /* a box that already holds the little word is not an invitation to empty
     it — tapping it says the phrase again */
  if(d.dock&&d.dock===(S.mSide||"front")){
   try{ const b=document.querySelector(".turnc [data-mclip],.turnc[data-mclip]");
    if(b) play(t,b.getAttribute("data-mclip")); }catch(e){}
   return; }
  flipSide(d.dock||null); return}
 if(d.fnext!==undefined){
  S.mkPhase="fcheck";S.fmI=0;S.fmPick=null;S.fmMiss=null;
  sMove();render();return}
 if(d.fpick!==undefined){const want=W2[FQ[Math.min(S.fmI||0,FQ.length-1)]].m[0];
  if(S.fmPick===want) return;
  if(d.fpick===want){S.fmPick=want;S.fmMiss=null;sGood();render()}
  else{S.fmMiss=d.fpick;sOops();render();
   setTimeout(function(){S.fmMiss=null;render()},420)}
  return}
 if(d.fgo!==undefined){
  if(S.fmI>=FQ.length-1){S.mkPhase="build";S.mkI=0;S.mkPick=null;S.touched=false}
  else{S.fmI++;S.fmPick=null;S.fmMiss=null}
  sMove();render();return}
 if(d.mk){const q=MQ[S.mkI],tgt=W2[q.i].m[MIX[q.f]];
  S.mkPick=d.mk;(d.mk===tgt?sGood:sOops)();render();return}
 if(d.mknext!==undefined){S.mkI++;S.mkPick=null;
  if(S.mkI>=MQ.length){finishAct();return}
  render();return}
 if(d.form){const w=S.form;S.form=d.form;S.flip=(w==="sg")!==(S.form==="sg");
  try{ if(wmMark(S.wi,S.form)){ formPop(S.wi,S.form); sGood() } }catch(e2){}
  render();setTimeout(function(){S.flip=false},520);return}
 if(d.wnext!==undefined){
  /* v233: forward only. The last word in the deck finishes the stop rather
     than wrapping round to the first, which is what the old strip did and
     which gave a child no way of knowing they had been all the way round. */
  const DECK=metWords(); let at=DECK.indexOf(S.wi); if(at<0) at=0;
  if(at>=DECK.length-1){ finishAct(); return }
  S.wi=DECK[at+1]; S.wmSeenF={}; S.form="sg"; sMove(); render(); return}
 if(d.wi){
  const DECK=metWords(); let at=DECK.indexOf(S.wi); if(at<0) at=0;

 if(d.cq!==undefined){const q=CQ[S.ci];S.cpick=+d.cq;

 if(d.cnext!==undefined){S.ci++;S.cpick=null;S.chint=false;render();return}
 if(d.lt){S.spick=d.lt;(d.lt===SWAP[S.si].b?sGood:sOops)();render();return}
 if(d.snext!==undefined){S.si=S.si+1;if(S.si>=SWAP.length){finishAct();return}S.spick=null;render();return}
 if(d.t){S.numPrev={t:S.tens,o:S.ones};S.tens=Math.max(0,Math.min(10,S.tens+(+d.t)));
  if(S.tens===10) S.ones=0;                 /* the book counts to a hundred, and stops */
  render();return}
 if(d.o){S.numPrev={t:S.tens,o:S.ones};S.ones=Math.max(0,Math.min(9,S.ones+(+d.o)));render();return}
 if(d.nq!==undefined){S.nqa=+d.nq;(S.nqa===NUMQ[S.nq]?sGood:sOops)();render();return}
 if(d.nqnext!==undefined){S.nq++;S.nqa=null;render();return}
 if(d.d!==undefined){S.di=+d.d;render();return}
 if(d.mo){S.mo=S.mo===d.mo?null:d.mo;render();return}
 if(d.sb){if(S.mo){S.moput[S.mo]=d.sb;S.mo=null;render()}return}
 if(d.cut!==undefined){const i=+d.cut;
  S.scuts=S.scuts.indexOf(i)>=0?S.scuts.filter(function(x){return x!==i}):S.scuts.concat([i]).sort(function(a,b){return a-b});

 if(d.check!==undefined){const w=cutsFrom(SPLITS[S.spi][1]);

 if(d.snext2!==undefined){S.spi=S.spi+1;

  S.scuts=[];S.sdone=false;render();return}
 if(d.sh){const sh=SHAPES[S.shi][1];

   setTimeout(function(){S.shi++;if(S.shi>=SHAPES.length){finishAct();return}render()},400)}
  else{t.classList.add("wrong");S.shwrong=d.sh;setTimeout(render,400)} return}
 if(d.pick){ S.sbp=S.sbp.concat([d.pick]); sTap(); render(); return; }
 if(d.unpick!==undefined){ S.sbp=S.sbp.slice(0,+d.unpick); render(); return; }
 if(d.sbnext!==undefined){ S.sbi++; S.sbp=[]; if(S.sbi>=SHUF.length){ finishAct(); return } render(); return; }
 if(d.cap!==undefined){ S.smCap=!S.smCap; (S.smCap?sGood:sOops)(); render(); return; }
 if(d.stop!==undefined){ S.smStop=!S.smStop; (S.smStop?sGood:sOops)(); render(); return; }
 if(d.smnext!==undefined){ S.smi++; S.smCap=false; S.smStop=false;
   if(S.smi>=MARKI.length){ finishAct(); return } render(); return; }
 if(d.sri){ S.sri=(S.sri+(+d.sri)+SENT.length)%SENT.length; S.srShow=false; render(); return; }
 if(d.srshow!==undefined){ S.srShow=true; render(); return; }
 if(d.ncut!==undefined){const i=+d.ncut;
  S.nacuts=S.nacuts.indexOf(i)>=0?S.nacuts.filter(function(x){return x!==i}):S.nacuts.concat([i]).sort(function(a,b){return a-b});

 if(d.ncheck!==undefined){const w=cutsFrom(NAMES[S.nai][1]);

 if(d.nnext!==undefined){S.nai=S.nai+1;
